<style>.manual-stock-qr{margin:0 0 18px}.manual-stock-qr .btn{width:100%;min-height:52px;font-size:18px}.manual-stock-qr .message{margin-top:10px}.manual-stock-qr [hidden]{display:none!important}</style>
<script>
const ManualStockQr=(()=>{
  const scanner='https://dmgpcnviengiat-wq.github.io/qr-scan/scan.html',prefix='MANUAL_STOCK_QR:',el=id=>document.getElementById(id);
  let busy=false,handledToken='';
  const owner=()=>String(currentUser?.useName||'').trim().toLowerCase(),hintKey=user=>'MOBILE_MANUAL_QR_PENDING_'+user;
  function stockId(value){const text=String(value??'').trim();if(!text||text.length>4096)throw Error('QR không có mã kho hợp lệ.');if(text.startsWith('{')){let parsed;try{parsed=JSON.parse(text);}catch{throw Error('QR không có mã kho hợp lệ.');}const ids=parsed&&typeof parsed==='object'&&!Array.isArray(parsed)?[parsed.Id,parsed.IdKho,parsed.idKho].filter(v=>typeof v==='string'&&v.trim()).map(v=>v.trim()):[];if(new Set(ids).size!==1)throw Error('QR không có một mã kho duy nhất.');return ids[0];}return text;}
  function apply(value){const id=stockId(value),matches=stockItems.filter(item=>String(item.Id).trim()===id);if(!matches.length)throw Error('Không tìm thấy mã kho '+id+' trong tồn khả dụng. Mã có thể đã hết tồn hoặc chưa được duyệt.');if(matches.length!==1)throw Error('Mã kho bị trùng: '+id+'. Vui lòng kiểm tra lại.');const item=matches[0];el('manualMa').value=item.maNguyenLieu||'';el('manualName').value=item.tenNguyenLieu||'';renderManualIdOptions();el('manualId').value=item.Id;handleManualIdChange();const details=el('manualLot')?.closest?.('details');if(details)details.open=true;return item;}
  function storage(mode,key,value){const fallback='MOBILE_MANUAL_QR_DATA_'+key;if(mode==='get'){const saved=localStorage.getItem(fallback);if(saved)return Promise.resolve(JSON.parse(saved));}if(mode==='delete')localStorage.removeItem(fallback);return new Promise((resolve,reject)=>{
    if(!window.indexedDB){reject(Error('Trình duyệt chưa cho phép lưu bản nháp. Không chuyển trang để tránh mất dữ liệu.'));return;}
    const open=window.indexedDB.open('worker-manual-stock-qr',1);open.onupgradeneeded=()=>{if(!open.result.objectStoreNames.contains('pending'))open.result.createObjectStore('pending');};open.onerror=()=>reject(Error('Không mở được bộ nhớ bản nháp trên điện thoại.'));open.onsuccess=()=>{const db=open.result;let result;try{const tx=db.transaction('pending',mode==='get'?'readonly':'readwrite'),store=tx.objectStore('pending'),request=mode==='put'?store.put(value,key):mode==='delete'?store.delete(key):store.get(key);request.onsuccess=()=>{result=request.result;};tx.oncomplete=()=>{db.close();resolve(result);};tx.onerror=tx.onabort=()=>{db.close();reject(Error('Không lưu được bản nháp. Chưa mở trang quét để tránh mất dữ liệu.'));};}catch(error){db.close();reject(error);}};
  }).then(result=>{if(mode==='put')localStorage.removeItem(fallback);return result;}).catch(error=>{if(mode==='put'){try{localStorage.setItem(fallback,JSON.stringify(value));return;}catch{}}if(mode==='delete')return;throw error;});}
  function pending(value){busy=value;const button=el('manualStockQrButton');if(button){button.disabled=value;button.textContent=value?'Đang xử lý…':'Quét QR nguyên liệu';}}
  async function open(){if(busy)return;if(!sessionToken||!owner()){showMessage('manualStockQrStatus','error','Vui lòng đăng nhập lại trước khi quét.');return;}const token=sessionToken,user=owner();let loading=false;pending(true);try{
    const destination=new URL(scanner),back=new URL(MANUAL_QR_BOOT.url);if(destination.protocol!=='https:'||back.protocol!=='https:'||back.hostname!=='script.google.com')throw Error('Chưa xác định được link quay về ứng dụng.');back.search='';back.hash='';
    const nonce=Array.from(crypto.getRandomValues(new Uint8Array(16)),v=>v.toString(16).padStart(2,'0')).join('');
    const state={owner:user,savedAt:Date.now(),nonce,draft:manualDraft,editing:manualEditingIndex,form:{Id:el('manualId').value,ma:el('manualMa').value,name:el('manualName').value,quantity:el('manualQty').value,note:el('manualNote').value,photo:WorkerCamera.get('manual'),button:el('manualAddBtn').innerText}};
    showLoading('Đang chuẩn bị quét QR','Đang giữ phiếu và ảnh đang nhập…');loading=true;await storage('put',user,state);if(token!==sessionToken||user!==owner()){await storage('delete',user);throw Error('Phiên đăng nhập đã thay đổi. Vui lòng thử lại.');}localStorage.setItem(hintKey(user),nonce);
    destination.search=new URLSearchParams({returnUrl:back.href,lineId:prefix+nonce}).toString();const fallback=el('manualStockQrFallback');if(fallback){fallback.href=destination.href;fallback.hidden=true;setTimeout(()=>{if(owner()===user&&localStorage.getItem(hintKey(user))===nonce)fallback.hidden=false;},700);}try{window.top.location.href=destination.href;}catch(navigationError){if(fallback)fallback.hidden=false;}showMessage('manualStockQrStatus','info','Đang mở trang quét. Sau khi quét, hệ thống sẽ tự chọn nguyên liệu và lô.');
  }catch(error){showMessage('manualStockQrStatus','error',error.message||'Không mở được trang quét.');}finally{pending(false);if(loading&&token===sessionToken)hideLoading();}}
  async function afterStockLoaded(){if(!sessionToken||!owner()||handledToken===sessionToken)return;const token=sessionToken,user=owner();let loading=false;handledToken=token;pending(true);try{
    const hint=localStorage.getItem(hintKey(user));if(!hint){if(MANUAL_QR_BOOT.qr)showMessage('manualStockQrStatus','error','Lượt quét đã hết hiệu lực. Vui lòng quét lại.');return;}showLoading('Đang nhận kết quả quét','Đang khôi phục phiếu và đối chiếu tồn kho…');loading=true;const state=await storage('get',user);if(token!==sessionToken||user!==owner())return;
    if(!state){localStorage.removeItem(hintKey(user));if(MANUAL_QR_BOOT.qr)showMessage('manualStockQrStatus','error','Lượt quét không còn hiệu lực. Vui lòng bấm Quét QR nguyên liệu để quét lại.');return;}
    if(state.owner!==user||!Number.isFinite(state.savedAt)||Date.now()-state.savedAt>6*60*60*1000){await storage('delete',user);localStorage.removeItem(hintKey(user));showMessage('manualStockQrStatus','error','Bản nháp quét đã hết hạn. Vui lòng kiểm tra và tạo lại phiếu.');return;}
    const qr=String(MANUAL_QR_BOOT.qr||'').trim();if(state.nonce!==hint||(qr&&MANUAL_QR_BOOT.lineId!==prefix+state.nonce))throw Error('Kết quả không thuộc lượt quét hiện tại. Vui lòng quét lại.');
    manualDraft=Array.isArray(state.draft)?state.draft:[];manualEditingIndex=Number.isInteger(state.editing)&&state.editing>=0&&state.editing<manualDraft.length?state.editing:-1;renderManualDraft();showPage('pageSingle',el('menuSingle'));
    const form=state.form||{};el('manualMa').value=form.ma||'';el('manualName').value=form.name||'';renderManualIdOptions();const old=stockItems.filter(row=>String(row.Id)===String(form.Id));if(old.length===1){el('manualId').value=old[0].Id;handleManualIdChange();if(WorkerCamera.valid(form.photo))WorkerCamera.set('manual',form.photo);}else{el('manualId').value='';resetManualStockDetail(false);}
    el('manualQty').value=form.quantity||'';el('manualNote').value=form.note||'';if(form.button)el('manualAddBtn').innerText=form.button;
    localStorage.removeItem(hintKey(user));await storage('delete',user);if(token!==sessionToken||user!==owner())return;if(qr){const item=apply(qr);if(String(item.Id)===String(form.Id)){if(WorkerCamera.valid(form.photo))WorkerCamera.set('manual',form.photo);}else{el('manualQty').value='';el('manualNote').value='';}showMessage('manualStockQrStatus','success','Đã chọn '+item.tenNguyenLieu+' · '+item.Id+'. Kiểm tra lô và tồn kho bên dưới.');}
    else showMessage('manualStockQrStatus','info','Đã trở về phiếu đang nhập.');
  }catch(error){if(token===sessionToken)showMessage('manualStockQrStatus','error',error.message||'Không khôi phục được kết quả quét.');}
  finally{pending(false);if(loading&&token===sessionToken)hideLoading();if(token===sessionToken&&typeof google!=='undefined'&&google.script?.history?.replace)google.script.history.replace({}, {}, '');}}
  function clearPendingMemory(){if(busy||!owner())return;const user=owner();if(!localStorage.getItem(hintKey(user)))return;localStorage.removeItem(hintKey(user));const fallback=el('manualStockQrFallback');if(fallback)fallback.hidden=true;storage('delete',user).catch(()=>{});}
  window.addEventListener?.('pageshow',event=>{if(event.persisted)clearPendingMemory();});
  ['input','change','click'].forEach(name=>document.addEventListener?.(name,event=>{const target=event.target;if(!target?.closest?.('#pageSingle')||target.closest('.manual-stock-qr'))return;clearPendingMemory();}));
  return {open,afterStockLoaded,apply,stockId};
})();
</script>
