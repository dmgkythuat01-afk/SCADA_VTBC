<script>
const EquipmentPrint = (() => {
  const esc = v => String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date = (value, dateOnly=false) => {
    if (/T.*(?:Z|[+-]\d\d:\d\d)$/.test(String(value || ''))) {
      const parsed = new Date(value);
      if (!Number.isNaN(parsed.getTime())) {
        const parts = new Intl.DateTimeFormat('en-GB', {timeZone:'Asia/Ho_Chi_Minh',day:'2-digit',month:'2-digit',year:'numeric',...(!dateOnly?{hour:'2-digit',minute:'2-digit',second:'2-digit',hourCycle:'h23'}:{})}).format(parsed);
        return parts.replace(',','');
      }
    }
    const m = String(value || '').match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);
    return m ? m[3]+'/'+m[2]+'/'+m[1]+(dateOnly?'':m[4]) : String(value || '');
  };
  const logo = `<svg viewBox="100 490 1400 580" role="img" aria-label="DMC CLEANERS"><defs><linearGradient id="dmc" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40dadb"/><stop offset="0.5" stop-color="#428cce"/><stop offset="1" stop-color="#2100b1"/></linearGradient><linearGradient id="dmc-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1700a8"/><stop offset="1" stop-color="#40d9de"/></linearGradient></defs><g fill="url(#dmc)"><path d="M117 507H439C483 507 519 543 519 587V841C519 885 483 921 439 921H117V677H188V849H451V588H117Z"/><path d="M556 921V588C556 543 592 507 637 507H969C1014 507 1050 543 1050 588V921H979V588H845V921H762V588H639V921Z"/><path d="M1167 507H1488V588H1156V849H1417V677H1488V921H1167C1122 921 1086 885 1086 840V588C1086 543 1122 507 1167 507Z"/></g><path d="M117 677H188V849L117 921Z" fill="url(#dmc-side)"/><path d="M1417 677H1488V921L1417 849Z" fill="url(#dmc-side)"/><text x="107" y="1037" font-family="Arial,sans-serif" font-size="111" fill="#272727" textLength="1381" lengthAdjust="spacing">CLEANERS</text></svg>`;
  const styles = `
    @page{size:A4 landscape;margin:8mm}*{box-sizing:border-box}body{margin:0;color:#000;background:#eee;font:10pt "Times New Roman",serif}.toolbar{font:14px Arial;padding:12px;background:#e9f3ef;display:flex;flex-wrap:wrap;gap:12px;align-items:center;position:static;line-height:1.5}.toolbar button{flex-shrink:0}.toolbar span{flex:1 1 240px}.toolbar button{padding:10px 18px;cursor:pointer}.sheet{width:281mm;margin:12px auto;background:#fff;padding:0}.form{border:1px solid #000}.header{display:grid;grid-template-columns:40mm 1fr 61mm;min-height:18mm;border-bottom:1px solid}.logo{padding:3mm 6mm;display:flex;align-items:center}.logo svg{width:100%;height:14mm}.title{border-left:1px solid;border-right:1px solid;display:flex;align-items:center;justify-content:center;font-size:17pt;font-weight:bold;text-align:center;padding:2mm}.doc{font-size:9pt;padding:1mm 2mm;line-height:1.45}.meta{display:grid;grid-template-columns:minmax(0,1fr) 42mm minmax(0,1fr);gap:2mm 4mm;padding:2mm;line-height:1.45}.meta div{overflow-wrap:anywhere}.meta,.meta b,.meta-value{font-size:11pt}.meta-value{font-weight:normal}.origin-stamp{align-self:center;justify-self:center;display:flex;flex-direction:column;align-items:center;justify-content:center;width:39mm;min-height:18mm;padding:1mm;border:1.3pt solid #c94f64;color:#c94f64;transform:rotate(-3deg);line-height:1.15;white-space:nowrap}.origin-stamp span{font:16pt Arial,sans-serif}.origin-stamp strong{font-size:20pt;font-weight:bold}.methods{padding:1mm 2mm 2mm}.choices{display:flex;justify-content:space-around;margin-top:1mm}.box{display:inline-block;width:7mm;height:5mm;border:1px solid;text-align:center;margin-left:10mm;line-height:4mm;font-family:Arial}.row{display:grid;grid-template-columns:1fr 49mm;border-top:1px solid}.content{padding:1mm 2mm;min-width:0}.content h3,.section-title{font-size:11pt;margin:0;text-align:center}.text{white-space:pre-wrap;overflow-wrap:anywhere;line-height:1.3;margin:1mm 0}.request{min-height:38mm}.construction{min-height:23mm}.improvement{border-top:1px solid;min-height:18mm}.signature{border-left:1px solid;text-align:center;padding:1mm 2mm;min-height:18mm;overflow-wrap:anywhere}.signature h3{font-size:10pt;margin:0 0 1mm;font-style:italic;text-decoration-line:underline;text-underline-offset:0.22em;text-decoration-thickness:0.5pt;text-decoration-skip-ink:auto}.signed{font-size:9pt;line-height:1.15}.signed strong{display:block}.sign-pair{display:grid;grid-template-rows:1fr 1fr}.sign-pair>.signature+ .signature{border-top:1px solid}.acceptance{border-top:1px solid;border-bottom:1px solid;text-align:center;padding:1mm}.bottom{display:grid;grid-template-columns:31% 1fr 49mm;min-height:36mm}.bottom>.content+.content{border-left:1px solid}.qr-list{display:flex;justify-content:center;gap:3mm;flex-wrap:wrap}.qr{text-align:center;font-size:8pt;break-inside:avoid}.qr svg{display:block;width:28mm;height:28mm}.hint{font-size:8pt;text-align:center;margin:1mm}.reference{font-size:8pt;margin:1mm 0}.annex{break-before:page;padding:3mm 0}.annex h2{font-size:15pt}.annex h3{margin:4mm 0 1mm}.annex .text{line-height:1.45}.annex .qr-list{justify-content:flex-start;gap:8mm}.annex .qr svg{width:40mm;height:40mm}.annex .qr{width:48mm}.signed-check{font-family:Arial,sans-serif;font-weight:bold}
    @media print{body{background:#fff}.toolbar{display:none}.sheet{margin:0;width:100%}.header,.meta,.methods,.signature,.bottom,.qr{break-inside:avoid}a{color:#000;text-decoration:none}}
    @media screen and (max-width:900px){.toolbar{width:100%;min-width:0}.sheet{margin:10px}}
  `;
  function qr(photo, i) {
    const q = qrcode(0,'M'); q.addData(photo.url); q.make();
    return '<div class="qr">'+q.createSvgTag({cellSize:2,margin:8,scalable:true})+'<span>Ảnh '+(i+1)+'</span></div>';
  }
  function html(p) {
    const r=p.request, d=p.report, s=p.signatures, annex=[];
    const field=(label,v)=>'<div><b>'+label+':</b> '+'<span class="meta-value">'+esc(v || '........................................................')+'</span></div>';
    const text=(label,value,limit)=>{
      value=String(value || '');
      // Bound both explicit lines and characters; full text is always retained in annex.
      const maxLines = {'Nội dung đề nghị':4,'Biện pháp thi công':2,'Nội dung cải tiến':1,'Ý kiến đóng góp':2}[label] || 2;
      let shown=value, lines=value.split('\n');
      if(value.length>limit || lines.length>maxLines){shown=value.slice(0,limit).split('\n').slice(0,maxLines).join('\n'); annex.push({label,value}); shown+='\n(Xem đầy đủ tại phụ lục)';}
      return '<div class="text">'+esc(shown || '\u00a0')+'</div>';
    };
    const sign=(label,v)=>'<div class="signature"><h3>'+label+'</h3>'+(v?'<div class="signed"><strong>'+esc(v.name)+'</strong><span class="signed-check">✓</span> Đã ký duyệt<br>'+esc(date(v.time))+'</div>':'')+'</div>';
    const photos=p.photos || [];
    const body='<main class="sheet"><article class="form"><header class="header"><div class="logo">'+logo+'</div><div class="title">PHIẾU ĐỀ NGHỊ SỬA CHỮA/LÀM MỚI</div><div class="doc">Mã số: BM-QT-TB-01.05<br>Ngày ban hành/Sửa đổi: 01/10/2025<br>Lần ban hành/Sửa đổi: 03<br>Người ban hành: Nguyễn Thị Kim Chung</div></header><div class="meta"><div>'+field('NGÀY',date(r.createdAt,true))+field('NGƯỜI ĐỀ NGHỊ',p.creator.name)+field('CHỨC VỤ',p.creator.position)+field('PHÒNG, TỔ SẢN XUẤT',p.creator.production)+'</div><div class="origin-stamp" aria-label="ORIGIN BẢN GỐC"><span>ORIGIN</span><strong>BẢN GỐC</strong></div><div>'+field('ĐỀ NGHỊ TỚI PHÒNG',p.assignee.department)+field('NGƯỜI CHỊU TRÁCH NHIỆM',p.assignee.name)+field('PHÒNG, TỔ SẢN XUẤT',p.assignee.production)+field('ĐỀ NGHỊ NGÀY HOÀN THÀNH',date(r.deadline))+'</div></div><div class="methods"><b>PHƯƠNG THỨC ĐỀ NGHỊ</b> (Đánh dấu vào hình thức đề nghị)<div class="choices">'+[['repair','SỬA CHỮA'],['new_work','LÀM MỚI']].map(([key,label])=>'<span>'+label+'<span class="box">'+(r.type===key?'✓':'')+'</span></span>').join('')+'</div></div><div class="row"><section class="content request"><h3>Nội dung đề nghị</h3><p class="reference">'+esc([r.workshop,r.machine,r.device].filter(Boolean).join(' — '))+'</p>'+text('Nội dung đề nghị',r.description,450)+'</section><div class="sign-pair">'+sign('Xác nhận bởi phòng Cơ điện',null)+sign('Trưởng Ban An Toàn',s.safety)+'</div></div><div class="row"><section class="content construction"><b>Biện pháp thi công</b>'+text('Biện pháp thi công',d?.content,220)+'</section>'+sign('Ban Giám đốc',s.director)+'</div><section class="content improvement"><b>Nội dung cải tiến</b>'+text('Nội dung cải tiến',d?.improvement,100)+'</section><div class="acceptance">PHẦN BÀN GIAO/NGHIỆM THU</div><div class="bottom"><section class="content"><h3>Ý kiến đóng góp</h3>'+text('Ý kiến đóng góp',d?.feedback,140)+'</section><section class="content"><h3>Hình ảnh minh họa sau khi hoàn thành</h3><div class="qr-list">'+photos.slice(0,3).map(qr).join('')+'</div><p class="hint">'+(photos.length?'Quét QR và đăng nhập để xem ảnh.'+(photos.length>3?' Các ảnh còn lại ở phụ lục.':''):'')+'</p></section><div class="sign-pair">'+sign('Bộ phận tiếp nhận',s.receiving)+sign('Bộ phận bàn giao',s.handover)+'</div></div></article>';
    return body+(annex.length || photos.length>3?'<section class="annex"><h2>PHỤ LỤC — PHIẾU '+esc(r.id)+'</h2>'+annex.map(a=>'<h3>'+a.label+'</h3><div class="text">'+esc(a.value)+'</div>').join('')+(photos.length>3?'<h3>Hình ảnh minh họa</h3><div class="qr-list">'+photos.slice(3).map((p,i)=>qr(p,i+3)).join('')+'</div>':'')+'</section>':'')+'</main>';
  }
  function open() {
    const w=window.open('','_blank','width=1200,height=850');
    if(!w) throw Error('Trình duyệt đang chặn cửa sổ in. Vui lòng cho phép popup rồi thử lại.');
    w.document.write('<!doctype html><meta charset="utf-8"><title>Đang tải phiếu</title><p>Đang chuẩn bị bản in…</p>');
    w.document.close(); return w;
  }
  function render(w,p) {
    if(w.closed) throw Error('Cửa sổ in đã đóng. Hãy bấm In / Xuất PDF lại.');
    w.document.open();
    w.document.write('<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Phiếu '+esc(p.request.id)+'</title><style>'+styles+'</style></head><body><div class="toolbar"><button id="printButton" type="button">In / Lưu PDF</button><span>Chọn máy in hoặc “Lưu dưới dạng PDF” trong hộp thoại in.</span></div>'+html(p)+'</body></html>');
    w.document.close();
    w.document.getElementById('printButton').onclick=()=>{w.focus();w.print();};
    const ready=w.document.fonts?.ready || Promise.resolve();
    ready.then(()=>setTimeout(()=>{if(!w.closed){w.focus();w.print();}},250));
  }
  function fail(w,error){if(w && !w.closed){w.document.body.textContent='Không tạo được bản in: '+error.message;}}
  return {open,render,fail,html,styles};
})();
</script>
