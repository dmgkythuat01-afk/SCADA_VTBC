<script>
window.PlannedMaintenance=(()=>{
 const $=id=>document.getElementById(id),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>crypto.randomUUID(),today=()=>S.data?.today || new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Ho_Chi_Minh'});
 const S={token:'',data:null,tab:'due',loading:false,busy:false,error:'',notice:'',filters:{},draft:null,detail:'',saveKey:'',photoBusy:false};
 const dates=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):v||'—';
 function rpc(action,p={}){const token=Mobile.state.token;return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(r=>{if(token!==Mobile.state.token)return reject(Error('Phiên đã thay đổi.'));resolve(r);}).withFailureHandler(e=>reject(Error(e.message||'Không thực hiện được.'))).plannedMaintenanceApi(token,action,p));}
 document.addEventListener('toggle',e=>{if(e.target.matches?.('.pbd-filters'))S.filterOpen=e.target.open;},true);
 function reset(){Object.assign(S,{token:'',data:null,tab:'due',loading:false,busy:false,error:'',notice:'',filters:{},draft:null,detail:'',saveKey:''});}
 function visible(){return Mobile.state.page==='maintenance' && Mobile.state.token===S.token;}
 async function load(){if(S.loading||S.busy)return;const token=Mobile.state.token;S.loading=true;S.error='';render();try{const data=await rpc('snapshot');if(token===Mobile.state.token){S.data=data;S.token=token;if(!S.filters.from&&!S.filters.to){S.filters.from=MobileDateRange.lastSeven(data.today).from;S.filters.to=data.today;}}}catch(e){S.error=e.message;}finally{S.loading=false;if(Mobile.state.page==='maintenance')render();}}
 function open(){if(S.token!==Mobile.state.token)reset();S.token=Mobile.state.token;if(!S.data&&!S.loading)load();else render();}
 function option(v,selected,label=v){return '<option value="'+esc(v)+'" '+(v===selected?'selected':'')+'>'+esc(label)+'</option>';}
 function dateInput(kind,key,value,max=''){return '<span class="pbd-date-control"><input type="date" data-pbd-'+kind+'="'+key+'" value="'+esc(value||'')+'" '+(max?'max="'+esc(max)+'"':'')+' aria-label="'+(key==='from'?'Từ ngày':key==='to'?'Đến ngày':'Ngày thực tế thực hiện')+'"><span aria-hidden="true">'+esc(value?dates(value):'dd/mm/yyyy')+'</span><svg aria-hidden="true" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M7 3v4M17 3v4M3 10h18"/></svg></span>';}
 function field(key,label,values,selected,all=true){return '<label>'+esc(label)+'<select data-pbd-filter="'+key+'">'+(all?option('',selected,'Tất cả'):option('',selected,'Chọn '+label.toLowerCase()))+[...new Set(values.filter(Boolean))].map(v=>option(v,selected)).join('')+'</select></label>';}
 function scoped(){const f=S.filters;return (S.data?.criteria||[]).filter(c=>['tenXuong','tenMay','maThietBi','boPhanDanhGia','danhMucCanKiemTra'].every(k=>(S.tab==='create'&&['tenXuong','tenMay'].includes(k))||!f[k]||c[k]===f[k]));}
 function filterHtml(){const source=S.tab==='history'?S.data.criteria.concat(S.data.records.flatMap(r=>r.chiTiet)):S.data.criteria,all=S.tab==='create'?source.filter(c=>c.tenXuong===draft().workshop&&c.tenMay===draft().machine):source,f=S.filters,w=all.filter(c=>!f.tenXuong||c.tenXuong===f.tenXuong),m=w.filter(c=>!f.tenMay||c.tenMay===f.tenMay),d=m.filter(c=>!f.maThietBi||c.maThietBi===f.maThietBi);return '<details class="pbd-card pbd-filters" '+(S.filterOpen?'open':'')+'><summary>Bộ lọc danh mục</summary><div class="pbd-line"><span class="pbd-muted">Lọc đến danh mục cần kiểm tra</span><button class="pbd-link" data-pbd="clear">Xóa lọc</button></div><div class="pbd-grid">'+(S.tab==='create'?'':field('tenXuong','Xưởng',all.map(c=>c.tenXuong),f.tenXuong)+field('tenMay','Máy',w.map(c=>c.tenMay),f.tenMay))+'<label>Thiết bị<select data-pbd-filter="maThietBi">'+option('',f.maThietBi,'Tất cả')+[...new Map(m.map(c=>[c.maThietBi,c])).values()].map(c=>option(c.maThietBi,f.maThietBi,c.tenThietBi+' · '+c.maThietBi)).join('')+'</select></label>'+field('boPhanDanhGia','Bộ phận đánh giá',d.map(c=>c.boPhanDanhGia),f.boPhanDanhGia)+field('danhMucCanKiemTra','Danh mục cần kiểm tra',d.filter(c=>!f.boPhanDanhGia||c.boPhanDanhGia===f.boPhanDanhGia).map(c=>c.danhMucCanKiemTra),f.danhMucCanKiemTra)+'</div></details>';}
 function badge(c){return '<span class="pbd-badge '+(c.trangThaiLich==='Quá hạn'?'pbd-overdue':['Đến hạn','Sắp đến hạn'].includes(c.trangThaiLich)?'pbd-upcoming':'')+'">'+esc(c.trangThaiLich)+(c.soNgayConLai<0?' · '+(-c.soNgayConLai)+' ngày':'')+'</span>';}
 function due(){const rows=scoped(),counts=[rows.filter(c=>c.trangThaiLich==='Quá hạn').length,rows.filter(c=>c.trangThaiLich==='Đến hạn').length,rows.filter(c=>c.trangThaiLich==='Sắp đến hạn').length];const groups=new Map();rows.filter(c=>S.filters.status?c.trangThaiLich===S.filters.status:c.trangThaiLich!=='Chưa đến hạn').forEach(c=>{const k=JSON.stringify([c.tenXuong,c.tenMay]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(c);});return '<div class="pbd-stats">'+['Quá hạn','Đến hạn','Trong 14 ngày tới'].map((v,i)=>'<div><b>'+counts[i]+'</b>'+v+'</div>').join('')+'<section class="pbd-card">'+field('status','Trạng thái',['Quá hạn','Đến hạn','Sắp đến hạn','Chưa có mốc thực hiện','Chưa có tần suất','Chưa đến hạn'],S.filters.status)+'<p class="pbd-muted">Hạn tính từ ngày thực tế hoàn thành gần nhất; lần đầu dùng ngày lắp đặt nếu có. Mục thiếu mốc/tần suất được hiển thị riêng.</p></section>'+([...groups.values()].map(list=>'<section class="pbd-card"><p class="pbd-muted">'+esc(list[0].tenXuong)+'</p><h2>'+esc(list[0].tenMay)+'</h2><p>'+list.length+' tham số cần theo dõi</p><details><summary>Xem thiết bị và tham số</summary>'+list.map(c=>'<div class="pbd-param"><strong>'+esc(c.tenThietBi)+' · '+esc(c.danhMucCanKiemTra)+'</strong><p>'+esc(c.thamSoCanKiemTra)+' '+badge(c)+'</p><p class="pbd-muted">Tần suất: '+esc(c.tanSuatApDung||'Chưa khai báo')+' · Hạn: '+dates(c.ngayDenHan)+'<br>Lần gần nhất: '+dates(c.ngayGanNhat)+' · '+esc(c.nguoiGanNhat)+'</p></div>').join('')+'</details>'+(S.data.canWrite?'<div class="pbd-actions"><button class="primary" data-pbd="machine" data-w="'+esc(list[0].tenXuong)+'" data-m="'+esc(list[0].tenMay)+'">Tạo phiếu máy này</button></div>':'')+'</section>').join('') || '<div class="pbd-card pbd-empty">Không có tham số theo bộ lọc hiện tại.</div>');}
 function draft(){if(!S.draft)S.draft={id:'',revision:0,workshop:S.filters.tenXuong||'',machine:S.filters.tenMay||'',performedDate:today(),note:'',results:{},photos:[]};return S.draft;}
 function form(){if(!S.data.canWrite)return '<div class="pbd-card pbd-empty">Tài khoản này có quyền xem lịch và lịch sử. Kỹ thuật tạo phiếu bảo dưỡng.</div>';const d=draft(),all=S.data.criteria,stale=Object.values(d.results).filter(r=>!all.some(c=>c.key===r.key&&c.version===r.version)),workshops=[...new Set(all.map(c=>c.tenXuong))],machines=[...new Set(all.filter(c=>c.tenXuong===d.workshop).map(c=>c.tenMay))],rows=scoped().filter(c=>c.tenXuong===d.workshop&&c.tenMay===d.machine).filter(c=>!d.dueOnly||c.trangThaiLich!=='Chưa đến hạn'),groups=new Map();rows.forEach(c=>{const k=JSON.stringify([c.maThietBi,c.danhMucCanKiemTra]);if(!groups.has(k))groups.set(k,[]);groups.get(k).push(c);});return '<section class="pbd-card"><h2>'+(d.id?'Sửa phiếu nháp':'Tạo phiếu bảo dưỡng')+'</h2><p class="pbd-code">'+esc(d.id||'Mã PBD được cấp khi lưu lần đầu')+'</p><div class="pbd-grid"><label>Xưởng<select data-pbd-draft="workshop">'+option('',d.workshop,'Chọn xưởng')+workshops.map(v=>option(v,d.workshop)).join('')+'</select></label><label>Máy<select data-pbd-draft="machine">'+option('',d.machine,'Chọn máy')+machines.map(v=>option(v,d.machine)).join('')+'</select></label><label>Ngày thực tế thực hiện'+dateInput('draft','performedDate',d.performedDate,today())+'</label><label>Người thực hiện<input readonly value="'+esc(S.data.user.name||S.data.user.email)+'"></label><label>Phạm vi<select data-pbd-draft="dueOnly">'+option('false',String(!!d.dueOnly),'Toàn bộ checklist')+option('true',String(!!d.dueOnly),'Các mục cần theo dõi')+'</select></label></div><p class="pbd-muted">Chỉ các tham số đã chọn kết quả mới được lưu. Có thể lọc danh mục phía trên; lựa chọn đang ẩn vẫn được giữ.</p><p><b>Đã chọn '+Object.keys(d.results).length+' tham số</b></p>'+(stale.length?'<div class="pbd-error">Danh mục của '+stale.length+' tham số đã thay đổi. Bỏ lựa chọn cũ rồi đánh giá lại.</div>'+stale.map(r=>'<button class="pbd-link" data-pbd="uncheck" data-key="'+esc(r.key)+'">Bỏ tham số đã thay đổi</button>').join(''):'')+'</section>'+([...groups.values()].map(list=>'<section class="pbd-card"><h2>'+esc(list[0].tenThietBi)+'</h2><p class="pbd-muted">'+esc(list[0].maThietBi)+' · '+esc(list[0].boPhanDanhGia)+'</p><details open><summary>'+esc(list[0].danhMucCanKiemTra)+'</summary>'+list.map(c=>{const val=d.results[c.key];return '<div class="pbd-param"><label class="pbd-parameter-row"><span class="pbd-param-name"><strong>'+esc(c.thamSoCanKiemTra||'Chưa đặt tên tham số')+'</strong><small class="pbd-muted">'+esc(c.loai)+' · '+esc(c.tanSuatApDung)+' · '+esc(c.boPhanDanhGia)+'</small></span><select data-pbd-result="'+esc(c.key)+'" aria-label="Kết quả '+esc(c.thamSoCanKiemTra)+'">'+option('',val?.ketQua||'','Bỏ chọn')+c.options.map(o=>option(o,val?.ketQua)).join('')+'</select></label>'+(c.options.length?'':'<p class="pbd-error">Chưa khai báo chỉ tiêu đánh giá trong danh mục.</p>')+'</div>' ;}).join('')+'</details></section>').join('') || '<div class="pbd-card pbd-empty">Chọn xưởng và máy có checklist để bắt đầu.</div>')+'<section class="pbd-card"><label>Ghi chú chung<textarea rows="3" data-pbd-draft="note">'+esc(d.note)+'</textarea></label><h3 style="margin-top:16px">Ảnh thực hiện</h3><p class="pbd-muted">Có thể chọn/chụp nhiều ảnh; tối đa 12 ảnh. Ảnh lưu riêng tư trên Drive.</p><div class="pbd-actions"><label class="pbd-btn">Thêm ảnh<input type="file" accept="image/*" multiple data-pbd-photos hidden></label><label class="pbd-btn">Chụp ảnh<input type="file" accept="image/*" capture="environment" data-pbd-photos hidden></label></div><div class="pbd-photo-list">'+d.photos.map((p,i)=>'<div>'+esc(p.name)+'<button data-pbd="removePhoto" data-index="'+i+'" class="pbd-link">Xóa</button></div>').join('')+'</div></section><section class="pbd-savebar"><b>'+Object.keys(d.results).length+' tham số · '+d.photos.length+' ảnh</b><div class="pbd-actions"><button data-pbd="saveDraft">Lưu nháp</button><button class="primary" data-pbd="complete">Hoàn thành các mục đã chọn</button></div></section><div class="pbd-actions"><button data-pbd="new">Tạo phiếu khác</button></div>';}
 function history(){const f=S.filters,records=S.data.records.filter(r=>(!f.tenXuong||r.tenXuong===f.tenXuong)&&(!f.tenMay||r.tenMay===f.tenMay)&&(!f.from||r.ngayThucHien>=f.from)&&(!f.to||r.ngayThucHien<=f.to)&&(!f.danhMucCanKiemTra||r.chiTiet.some(c=>c.danhMucCanKiemTra===f.danhMucCanKiemTra))&&(!f.maThietBi||r.chiTiet.some(c=>c.maThietBi===f.maThietBi))&&(!f.boPhanDanhGia||r.chiTiet.some(c=>c.boPhanDanhGia===f.boPhanDanhGia)));return '<section class="pbd-card"><h2>Lịch sử phiếu bảo dưỡng</h2><div class="pbd-grid"><label>Từ ngày'+dateInput('filter','from',f.from)+'</label><label>Đến ngày'+dateInput('filter','to',f.to)+'</label></div></section>'+records.map(r=>'<article class="pbd-card"><div class="pbd-line"><span class="pbd-code">'+esc(r.maPhieuBaoDuong)+'</span><span class="pbd-badge">'+esc(r.trangThai)+'</span></div><h3>'+esc(r.tenMay)+'</h3><p>'+esc(r.tenXuong)+'</p><p class="pbd-muted">'+dates(r.ngayThucHien)+' · '+esc(r.tenNguoiThucHien)+' · '+r.chiTiet.length+' tham số</p><div class="pbd-actions"><button data-pbd="detail" data-id="'+esc(r.maPhieuBaoDuong)+'">Xem phiếu</button>'+(r.trangThai==='Nháp'&&r.nguoiTao===S.data.user.email?'<button data-pbd="edit" data-id="'+esc(r.maPhieuBaoDuong)+'">Tiếp tục phiếu nháp</button>':'')+'</div></article>').join('')+(records.length?'':'<div class="pbd-card pbd-empty">Chưa có phiếu trong khoảng lọc.</div>');}
 function detail(){const r=S.data.records.find(r=>r.maPhieuBaoDuong===S.detail);if(!r)return '';return '<section class="pbd-card"><button class="pbd-link" data-pbd="back">← Danh sách phiếu</button><h2>'+esc(r.tenMay)+'</h2><p class="pbd-code">'+esc(r.maPhieuBaoDuong)+'</p><p>'+esc(r.trangThai)+' · '+dates(r.ngayThucHien)+'</p><p>Người thực hiện: <b>'+esc(r.tenNguoiThucHien)+'</b></p><p class="pbd-muted">Người tạo: '+esc(r.tenNguoiTao)+' · '+esc(r.thoiGianTao)+'</p><p style="white-space:pre-wrap">'+esc(r.ghiChu)+'</p>'+r.chiTiet.map(c=>'<div class="pbd-detail-result"><strong>'+esc(c.tenThietBi)+' · '+esc(c.danhMucCanKiemTra)+'</strong><p>'+esc(c.thamSoCanKiemTra)+': <b>'+esc(c.ketQua)+'</b></p><small>'+esc(c.boPhanDanhGia)+' · '+esc(c.loai)+' · '+esc(c.tanSuatThamSo||c.tanSuatDanhMuc)+'</small><p style="white-space:pre-wrap">'+esc(c.ghiChu)+'</p></div>').join('')+'<div class="pbd-actions">'+r.danhSachAnh.map(p=>'<button data-pbd="viewPhoto" data-id="'+esc(r.maPhieuBaoDuong)+'" data-file="'+esc(p.id)+'">📷 '+esc(p.name)+'</button>').join('')+'</div><div id="pbdPhotoView"></div></section>';}
 function render(){if(Mobile.state.page!=='maintenance')return;const content=$('mobileContent');$('mobileDateFilter').hidden=true;content.innerHTML='<div class="pbd"><div class="pbd-line"><h1 style="font-size:24px">Bảo dưỡng</h1><button class="pbd-btn" data-pbd="reload">↻ Tải lại</button></div><div class="pbd-tabs">'+[['due','Cần bảo dưỡng'],['create','Tạo phiếu'],['history','Lịch sử']].map(([k,t])=>'<button data-pbd="tab" data-tab="'+k+'" class="'+(S.tab===k?'active':'')+'">'+t+'</button>').join('')+'</div><p id="pbdError" class="pbd-error">'+esc(S.error)+'</p><p class="pbd-success">'+esc(S.notice)+'</p>'+(S.loading?'<div class="pbd-card pbd-empty">Đang tải lịch và danh mục…</div>':!S.data?'<div class="pbd-card pbd-empty">Chưa tải được dữ liệu. Bấm Tải lại để thử.</div>':filterHtml()+(S.detail?detail():S.tab==='due'?due():S.tab==='create'?form():history()))+'</div>';if(S.busy||S.photoBusy)content.querySelectorAll('button,input,select,textarea').forEach(e=>e.disabled=true);}
 async function save(status){if(S.busy||S.photoBusy)return;const d=draft();if(!d.workshop||!d.machine)throw Error('Chọn xưởng và máy trước khi lưu.');const results=Object.values(d.results);if(!results.length)throw Error('Chọn kết quả của ít nhất một tham số.');if(status==='Hoàn thành'&&!confirm('Hoàn thành '+results.length+' tham số đã chọn? Phiếu hoàn thành sẽ giữ nguyên để lưu lịch sử.'))return;
 S.busy=true;S.error='';S.saveKey=S.saveKey||uid();render();try{const r=await rpc('save',{requestId:S.saveKey,id:d.id,revision:d.revision,status,workshop:d.workshop,machine:d.machine,performedDate:d.performedDate,note:d.note,results,photos:d.photos});d.id=r.maPhieuBaoDuong;d.revision=Number(r.phienBan);S.saveKey='';S.notice='Đã lưu '+r.maPhieuBaoDuong;S.data.records=S.data.records.filter(v=>v.maPhieuBaoDuong!==r.maPhieuBaoDuong).concat(r);if(status==='Hoàn thành'){S.draft=null;S.tab='history';S.detail=r.maPhieuBaoDuong;}else{S.draft=d;}}finally{S.busy=false;}await load();}
 async function image(file){const url=await new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(file);});const img=new Image();await new Promise((resolve,reject)=>{img.onload=resolve;img.onerror=()=>reject(Error('Không đọc được ảnh.'));img.src=url;});const scale=Math.min(1,1600/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.82);}
 document.addEventListener('input',e=>{if(!visible()||S.busy||S.photoBusy)return;if(e.target.dataset.pbdDraft && e.target.tagName!=='SELECT'){draft()[e.target.dataset.pbdDraft]=e.target.value;S.saveKey='';}if(e.target.dataset.pbdNote && draft().results[e.target.dataset.pbdNote]){draft().results[e.target.dataset.pbdNote].ghiChu=e.target.value;S.saveKey='';}});
 document.addEventListener('change',async e=>{if(!visible()||S.busy||S.photoBusy)return;try{const el=e.target;
 if(el.dataset.pbdFilter){const k=el.dataset.pbdFilter;S.filters[k]=el.value;S.filterOpen=true;if(k==='tenXuong'){delete S.filters.tenMay;delete S.filters.maThietBi;delete S.filters.danhMucCanKiemTra;}if(['tenMay','maThietBi','boPhanDanhGia'].includes(k))delete S.filters.danhMucCanKiemTra;render();}
 if(el.dataset.pbdDraft){const k=el.dataset.pbdDraft,d=draft();if(['workshop','machine'].includes(k)&&Object.keys(d.results).length&&!confirm('Đổi máy/xưởng sẽ bỏ các lựa chọn chưa lưu. Tiếp tục?')){render();return;}d[k]=k==='dueOnly'?el.value==='true':el.value;if(k==='workshop'){d.machine='';d.results={};}if(['workshop','machine'].includes(k)){d.results={};for(const field of ['tenXuong','tenMay','maThietBi','danhMucCanKiemTra'])delete S.filters[field];}S.saveKey='';render();}
 if(el.dataset.pbdResult){const c=S.data.criteria.find(c=>c.key===el.dataset.pbdResult),d=draft();if(!el.value)delete d.results[c.key];else d.results[c.key]={key:c.key,version:c.version,ketQua:el.value,ghiChu:d.results[c.key]?.ghiChu||''};S.saveKey='';const pos=window.scrollY;render();window.scrollTo(0,pos);}
 if(el.hasAttribute('data-pbd-photos')){const files=Array.from(el.files||[]);if(draft().photos.length+files.length>12)throw Error('Tối đa 12 ảnh mỗi phiếu.');S.photoBusy=true;render();try{for(const file of files){const meta=await rpc('upload',{uploadKey:uid(),name:file.name,dataUrl:await image(file)});draft().photos.push(meta);S.saveKey='';}}finally{S.photoBusy=false;}render();}
 }catch(err){S.error=err.message;render();}});
 document.addEventListener('click',async e=>{const button=e.target.closest('[data-pbd]');if(!button||!visible()||S.busy||S.photoBusy)return;e.preventDefault();try{S.error='';const action=button.dataset.pbd;
 if(action==='reload'){await load();return;}if(action==='tab'){S.tab=button.dataset.tab;S.detail='';S.notice='';}
 if(action==='clear'){S.filters={};S.filterOpen=true;}if(action==='machine'){const d=draft();if(Object.keys(d.results).length&&!confirm('Bỏ các lựa chọn chưa lưu để tạo phiếu máy này?'))return;S.draft={...d,id:'',revision:0,workshop:button.dataset.w,machine:button.dataset.m,results:{},photos:[],note:'',dueOnly:true};S.filters={tenXuong:button.dataset.w,tenMay:button.dataset.m};S.tab='create';S.detail='';}
 if(action==='uncheck'){delete draft().results[button.dataset.key];S.saveKey='';}if(action==='removePhoto'){draft().photos.splice(Number(button.dataset.index),1);S.saveKey='';}
 if(action==='saveDraft'||action==='complete'){await save(action==='complete'?'Hoàn thành':'Nháp');return;}
 if(action==='new'){if(S.draft&&Object.keys(S.draft.results).length&&!confirm('Bỏ nội dung đang nhập để tạo phiếu mới?'))return;S.draft=null;S.saveKey='';}
 if(action==='detail'){S.detail=button.dataset.id;S.tab='history';}if(action==='back')S.detail='';
 if(action==='edit'){const r=S.data.records.find(r=>r.maPhieuBaoDuong===button.dataset.id);S.draft={id:r.maPhieuBaoDuong,revision:Number(r.phienBan),workshop:r.tenXuong,machine:r.tenMay,performedDate:r.ngayThucHien,note:r.ghiChu,results:Object.fromEntries(r.chiTiet.map(c=>[c.key,{key:c.key,version:c.version,ketQua:c.ketQua,ghiChu:c.ghiChu}])),photos:r.danhSachAnh};S.tab='create';S.detail='';S.filters={};S.saveKey='';}
 if(action==='viewPhoto'){button.disabled=true;const r=await rpc('photo',{id:button.dataset.id,fileId:button.dataset.file});$('pbdPhotoView').innerHTML='<img class="pbd-fullphoto" src="'+esc(r.dataUrl)+'" alt="Ảnh bảo dưỡng">';button.disabled=false;return;}
 render();}catch(err){S.error=err.message;render();}});
 return {open,render,reset,state:S,load};
})();
