<style>
.khbd-filters{min-width:0;display:grid;grid-template-columns:100px minmax(150px,1fr) minmax(180px,1.3fr) minmax(140px,200px) auto;gap:12px;align-items:end}.khbd-filters label{min-width:0}.khbd-filters input,.khbd-filters select{width:100%;min-width:0;box-sizing:border-box}.khbd-scroll{overflow:auto;max-height:72vh;border:1px solid #d9e7e1;border-radius:10px}.khbd-table{border-collapse:separate;border-spacing:0;width:100%;min-width:1550px;font-size:13px}.khbd-table th,.khbd-table td{border-right:1px solid #cbdad3;border-bottom:1px solid #cbdad3;padding:7px;vertical-align:middle}.khbd-table thead th{position:sticky;top:0;background:#075743;color:#fff;z-index:2}.khbd-table .khbd-machine td{background:#d7eae1;font-weight:750;font-size:15px}.khbd-table .khbd-device td{background:#eff7f3;font-weight:700}.khbd-table input{width:76px;min-width:0;padding:8px 5px;background:transparent;border:1px solid transparent;border-radius:5px;font:inherit;box-sizing:border-box}.khbd-table input:focus{background:white;border-color:#0b8061;outline:1px solid #0b8061}.khbd-category{min-width:180px}.khbd-frequency{min-width:100px}.khbd-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:14px 0}.khbd-status{flex:1;color:#647c73;font-size:13px}.khbd-empty{font-style:italic;color:#71847c}.khbd-print-title{display:none}.khbd-stt{text-align:center!important;vertical-align:middle!important}.khbd-confirm td{height:64px;text-align:center;font-weight:700}.khbd-signatures{display:grid;grid-template-columns:1fr 1fr;text-align:center;gap:20px;min-height:130px;padding-top:28px;font-weight:700}.khbd-book{margin-top:24px;border-top:1px solid #d9e7e1;padding-top:16px}.khbd-book h3{margin:0 0 12px}
@media(min-width:1024px){#mobileContent[data-page="maintenance"] .pbd{max-width:none}#mobileContent[data-page="maintenance"] .pbd-tabs{max-width:none;width:100%}}
@media(max-width:650px){.khbd-filters{grid-template-columns:90px minmax(0,1fr);gap:10px}.khbd-filters label:nth-child(3),.khbd-filters label:nth-child(4){grid-column:1/-1}.khbd-filters button{grid-column:1/-1}.khbd-scroll{max-height:65vh}.khbd-toolbar button{flex:1}.khbd-status{flex:1 1 100%}.pbd-tabs{grid-template-columns:repeat(4,minmax(0,1fr))}.pbd-tabs button{padding-left:4px;padding-right:4px;font-size:13px}}
</style>
<script>
window.MaintenancePlanBook=(()=>{
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const S={token:'',options:null,year:new Date().getFullYear(),workshop:'',machine:'',department:'Cơ khí',data:null,loading:false,busy:false,dirty:false,error:'',notice:'',request:''};
 const rpc=(action,p={})=>new Promise((resolve,reject)=>{const token=Mobile.state.token;google.script.run.withSuccessHandler(r=>token===Mobile.state.token?resolve(r):reject(Error('Phiên đăng nhập đã thay đổi.'))).withFailureHandler(e=>reject(Error(e.message||'Không tải được sổ.'))).maintenancePlanBookApi(token,action,p);});
 const selection=()=>({year:Number(S.year),workshop:S.workshop,department:S.department});
 function reset(){Object.assign(S,{token:Mobile.state.token,options:null,data:null,loading:false,busy:false,dirty:false,error:'',notice:'',request:'',workshop:'',machine:'',department:'Cơ khí'});}
 function confirmLeave(){return !S.dirty||confirm('Sổ có nội dung chưa lưu. Bỏ thay đổi này?');}
 async function init(){if(S.token!==Mobile.state.token)reset();if(S.options||S.loading)return;S.loading=true;try{const o=await rpc('options');S.options=o;S.year=o.year;S.workshop=o.workshops[0]||'';}catch(e){S.error=e.message;}finally{S.loading=false;PlannedMaintenance.render();}if(S.workshop)await load(false);}
 async function load(ask=true){if(S.loading||S.busy||(ask&&!confirmLeave()))return;S.loading=true;S.error='';S.notice='';PlannedMaintenance.render();try{S.data=await rpc('load',selection());S.dirty=false;S.request='';}catch(e){S.error=e.message;}finally{S.loading=false;PlannedMaintenance.render();}}
 function option(v,s){return '<option '+(v===s?'selected':'')+' value="'+esc(v)+'">'+esc(v)+'</option>';}
 function selected(){return S.data?{...S.data,groups:S.data.groups.filter(g=>!S.machine||g.machine===S.machine)}:null;}
 function signatures(){return '<div class="khbd-signatures"><div>NGƯỜI LẬP</div><div>BAN GIÁM ĐỐC</div></div>';}
 function table(p,editable){let n=0;return '<table class="khbd-table"><colgroup><col style="width:45px"><col style="width:200px"><col style="width:90px"><col style="width:110px">'+Array(12).fill('<col>').join('')+'</colgroup><thead><tr><th class="khbd-stt">STT</th><th>Thiết bị / Danh mục</th><th>Công việc</th><th>Tần suất</th>'+Array.from({length:12},(_,i)=>'<th>Tháng '+(i+1)+'</th>').join('')+'</tr></thead><tbody>'+p.groups.map(g=>'<tr class="khbd-machine"><td colspan="16">'+esc(g.machine)+'</td></tr>'+g.devices.map(d=>'<tr class="khbd-device"><td class="khbd-stt" rowspan="'+(1+(d.categories.length?d.categories.reduce((sum,c)=>sum+c.actions.length,0):1))+'">'+(++n)+'</td><td colspan="15">'+esc(d.name)+' ('+esc(d.code)+')</td></tr>'+(d.categories.length?d.categories.map(c=>c.actions.map((a,i)=>'<tr>'+(i===0?'<td class="khbd-category" rowspan="2">'+esc(c.name)+'</td>':'')+'<td>'+esc(a.name)+'</td><td class="khbd-frequency">'+esc(a.frequency)+'</td>'+Array.from({length:12},(_,month)=>'<td>'+(editable?'<input type="text" maxlength="200" data-khbd-cell="'+esc(a.key)+'" data-month="'+month+'" aria-label="'+esc(d.name+' / '+c.name+' / '+a.name+' / Tháng '+(month+1))+'" value="'+esc(p.values[a.key]?.[month]||'')+'">':esc(p.values[a.key]?.[month]||''))+'</td>').join('')+'</tr>').join('')).join(''):'<tr><td colspan="15" class="khbd-empty">&nbsp;</td></tr>')).join('')).join('')+'<tr class="khbd-confirm"><td colspan="4">XÁC NHẬN</td>'+Array(12).fill('<td></td>').join('')+'</tr></tbody></table>';}
 function html(){if(S.token!==Mobile.state.token)reset();if(!S.options&&!S.loading)queueMicrotask(init);const d=selected();return '<section class="pbd-card"><h2>Sổ kế hoạch bảo dưỡng</h2><fieldset class="khbd-filters" style="border:0;padding:0;margin:0" '+(S.loading||S.busy?'disabled':'')+'><label>Năm<input type="number" min="2000" max="2100" data-khbd-filter="year" value="'+esc(S.year)+'"></label><label>Xưởng<select data-khbd-filter="workshop">'+(S.options?.workshops||[]).map(v=>option(v,S.workshop)).join('')+'</select></label><label>Dây chuyền<select data-khbd-filter="machine"><option value="">Tất cả dây chuyền</option>'+[...new Set((S.options?.machines||[]).filter(r=>r.workshop===S.workshop).map(r=>r.machine).concat(S.data?.groups.map(g=>g.machine)||[]))].map(v=>option(v,S.machine)).join('')+'</select></label><label>Bộ phận đánh giá<select data-khbd-filter="department">'+['Cơ khí','Điện'].map(v=>option(v,S.department)).join('')+'</select></label><button data-khbd-action="load" '+(S.loading||S.busy?'disabled':'')+'>Tải sổ</button></fieldset><p class="pbd-error" role="alert">'+esc(S.error)+'</p><p class="pbd-success">'+esc(S.notice)+'</p>'+(S.loading?'<p>Đang tải sổ…</p>':d?'<div class="khbd-toolbar">'+(d.canWrite?'<button class="primary" data-khbd-action="save" '+(S.busy||!S.dirty?'disabled':'')+'>'+(S.busy?'Đang lưu…':'Lưu sổ')+'</button>':'')+'<button data-khbd-action="print">In / Xuất PDF</button><span class="khbd-status">'+(S.dirty?'Có thay đổi chưa lưu':d.updatedAt?'Đã lưu: '+esc(d.updatedAt)+' · '+esc(d.updatedBy):'Sổ mới — nhập trực tiếp vào các ô tháng')+'</span></div><p class="pbd-muted">Năm '+esc(d.year)+' · '+esc(d.workshop)+' · '+esc(d.department)+'. Tần suất lấy từ DanhMucSoKH; chưa tự điền lịch các tháng.</p>'+d.groups.map(g=>'<article class="khbd-book"><h3>SỔ KHBD — '+esc(g.machine)+'</h3><div class="khbd-scroll">'+table({...d,groups:[g]},d.canWrite&&!S.busy)+'</div>'+signatures()+'</article>').join('')+'':'')+'</section>';}
 async function save(){if(!S.data||S.busy||S.loading)return;S.busy=true;S.error='';S.request=S.request||crypto.randomUUID();PlannedMaintenance.render();try{S.data=await rpc('save',{...selection(),year:S.data.year,workshop:S.data.workshop,department:S.data.department,revision:S.data.revision,version:S.data.version,values:S.data.values,requestId:S.request});S.dirty=false;S.request='';S.notice='Đã lưu sổ vào Google Sheets.';}catch(e){S.error=e.message;}finally{S.busy=false;PlannedMaintenance.render();}}
 document.addEventListener('input',e=>{if(!e.target.matches('[data-khbd-cell]'))return;const k=e.target.dataset.khbdCell,m=Number(e.target.dataset.month);S.data.values[k]=S.data.values[k]||Array(12).fill('');S.data.values[k][m]=e.target.value;S.dirty=true;S.request='';const b=document.querySelector('[data-khbd-action="save"]');if(b)b.disabled=false;const status=document.querySelector('.khbd-status');if(status)status.textContent='Có thay đổi chưa lưu';});
 document.addEventListener('change',e=>{const k=e.target.dataset.khbdFilter;if(!k)return;if(S.busy||S.loading){e.target.value=S[k];return;}if(k!=='machine'&&!confirmLeave()){e.target.value=S[k];return;}if(k==='machine'){S.machine=e.target.value;PlannedMaintenance.render();return;}S[k]=e.target.value;if(k==='workshop')S.machine='';S.data=null;S.dirty=false;S.error='';PlannedMaintenance.render();});
 document.addEventListener('click',async e=>{const b=e.target.closest('[data-khbd-action]');if(!b||b.disabled)return;const a=b.dataset.khbdAction;if(a==='load')await load();if(a==='save')await save();if(a==='print'&&S.data)MaintenancePlanBookPrint.open(selected(),table);});
 window.addEventListener('beforeunload',e=>{if(S.dirty){e.preventDefault();e.returnValue='';}});
 return {html,load,confirmLeave,table,selected,state:S};
})();
</script>
