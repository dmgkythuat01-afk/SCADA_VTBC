 const styles=`@page{size:A4 landscape;margin:12mm 12mm 18mm;@top-left{content:""}@top-center{content:""}@top-right{content:""}@bottom-left{content:"Quy trình quản lý thiết bị sản xuất";font:italic 9pt "Times New Roman"}@bottom-right{content:"CONTROL\\A KIỂM SOÁT";white-space:pre;text-align:center;color:#d74d59;border:1px solid #d74d59;font:700 10pt Arial;width:38mm;height:11mm;margin-top:2mm;vertical-align:middle}}*{box-sizing:border-box}body{font:9pt "Times New Roman",serif;margin:0;background:#edf1ee}.toolbar{padding:12px;background:#e2efe8;font:14px Arial}.toolbar button{padding:10px 18px;margin-right:12px}.paper+.paper{break-before:page;page-break-before:always}.khbd-stt{text-align:center!important;vertical-align:middle!important}.khbd-table .khbd-confirm td{height:14mm;text-align:center;font-weight:bold}.khbd-signatures{display:grid;grid-template-columns:1fr 1fr;text-align:center;font-weight:bold;min-height:24mm;padding-top:7mm;break-inside:avoid}.paper{width:273mm;margin:12px auto;background:white}.header{display:grid;grid-template-columns:40mm 1fr 72mm;border:1px solid;break-inside:avoid}.logo{padding:3mm;display:flex;align-items:center;justify-content:center;position:relative}.logo svg{width:30mm;height:13mm}.title{font-size:13pt;text-align:center;padding:3mm;border-left:1px solid;border-right:1px solid;font-weight:bold;line-height:1.4}.title small{font-size:11pt;font-weight:normal}.meta{font-size:9pt;padding:2mm;line-height:1.35}.issuer{white-space:nowrap}.stamp{position:absolute;left:33mm;top:10mm;width:40mm;white-space:nowrap;transform:rotate(-5deg);border:1px solid #d74d59;color:#d74d59;padding:1mm 3mm;font:700 11pt Arial;text-align:center;z-index:1;pointer-events:none}.khbd-table{border-collapse:collapse;width:100%;table-layout:fixed;font-size:8pt}.khbd-table col:nth-child(1){width:8mm!important}.khbd-table col:nth-child(2){width:40mm!important}.khbd-table col:nth-child(3){width:19mm!important}.khbd-table col:nth-child(4){width:22mm!important}.khbd-tab  function documentHtml(p,table){return '<!doctype html><html lang="vi"><head><meta charset="utf-8"><title>Sổ KHBD '+esc(p.year)+' — '+esc(p.workshop)+'</title><style>'+styles+'</style></head><body><div class="toolbar"><button id="khbdPrint">In / Lưu PDF</button>Khổ A4 ngang. Nội dung phản ánh các ô tháng hiện đang hiển thị.</div>'+p.groups.map(g=>'<main class="paper"><header class="header"><div class="logo">'+logo+'</div><div class="title">KẾ HOẠCH BẢO DƯỠNG THIẾT BỊ ĐỊNH KỲ<br><small>KHU VỰC: '+esc(g.machine)+' ('+(p.department==='Điện'?'ĐIỆN':'CƠ')+')<br>NĂM '+esc(p.year)+' · '+esc(p.workshop)+'</small></div><div class="meta">Mã số: BM-QT-TB-01.04.00<br>Ngày ban hành/Sửa đổi: 01/10/2025<br>Lần ban hành/Sửa đổi: 01<br><span class="issuer">Người ban hành: Nguyễn Thị Kim Chung</span></div></header>'+table({...p,groups:[g]},false).replace('</table>','<tfoot><tr><td colspan="16"></td></tr></tfoot></table>')+'<div class="khbd-signatures"><div>NGƯỜI LẬP</div><div>BAN GIÁM ĐỐC</div></div></main>').join('')+'</body></html>';}
 function open(p,table){const w=window.open('','_blank','width=1200,height=850');if(!w){alert('Cho phép cửa sổ bật lên để in sổ.');return;}w.document.write(documentHtml(p,table));w.document.close();w.document.getElementById('khbdPrint').onclick=()=>{w.focus();w.print();};(w.document.fonts?.ready||Promise.resolve()).then(()=>setTimeout(()=>{if(!w.closed){w.focus();w.print();}},250));}
