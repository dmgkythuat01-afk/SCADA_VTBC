<script>
window.PlannedMaintenancePrint=(()=>{
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const date=value=>{const m=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})(.*)$/);return m?m[3]+'/'+m[2]+'/'+m[1]+m[4]:String(value||'');};
  const logo = `<svg viewBox="100 490 1400 580" role="img" aria-label="DMC CLEANERS"><defs><linearGradient id="dmc" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#40dadb"/><stop offset="0.5" stop-color="#428cce"/><stop offset="1" stop-color="#2100b1"/></linearGradient><linearGradient id="dmc-side" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#1700a8"/><stop offset="1" stop-color="#40d9de"/></linearGradient></defs><g fill="url(#dmc)"><path d="M117 507H439C483 507 519 543 519 587V841C519 885 483 921 439 921H117V677H188V849H451V588H117Z"/><path d="M556 921V588C556 543 592 507 637 507H969C1014 507 1050 543 1050 588V921H979V588H845V921H762V588H639V921Z"/><path d="M1167 507H1488V588H1156V849H1417V677H1488V921H1167C1122 921 1086 885 1086 840V588C1086 543 1122 507 1167 507Z"/></g><path d="M117 677H188V849L117 921Z" fill="url(#dmc-side)"/><path d="M1417 677H1488V921L1417 849Z" fill="url(#dmc-side)"/><text x="107" y="1037" font-family="Arial,sans-serif" font-size="111" fill="#272727" textLength="1381" lengthAdjust="spacing">CLEANERS</text></svg>`;
  const styles=`
    @page{size:A4 portrait;margin:15mm 15mm 22mm;@top-left{content:""}@top-center{content:""}@top-right{content:""}@bottom-left{content:"Quy trình quản lý thiết bị sản xuất";font:italic 9.5pt "Times New Roman",serif;vertical-align:middle}}*{box-sizing:border-box}body{margin:0;background:#e9eeeb;color:#000;font:10.5pt "Times New Roman",serif}.toolbar{font:14px Arial,sans-serif;background:#e7f2ec;padding:12px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;line-height:1.5}.toolbar button{padding:10px 18px;cursor:pointer;font:inherit}.toolbar span{flex:1 1 260px}.paper{width:180mm;margin:12px auto;background:white;padding:0}.doc-header{display:grid;grid-template-columns:32mm minmax(0,1fr) 50mm;border:1px solid;min-height:19mm;break-inside:avoid}.logo{display:flex;align-items:center;justify-content:center;padding:3mm}.logo svg{width:26mm;height:11mm}.form-title{display:flex;align-items:center;justify-content:center;text-align:center;font-size:12.5pt;font-weight:bold;line-height:1.25;border-left:1px solid;border-right:1px solid;padding:2mm}.doc-meta{font-size:8pt;padding:1.5mm;line-height:1.35}.machine-title{font-size:10.5pt;text-align:center;margin:2mm 0 3mm;font-weight:bold}.info{line-height:1.5;margin-bottom:3mm;font-size:10.5pt}.info-row{display:flex;justify-content:space-between;gap:5mm}.info-row span{overflow-wrap:anywhere}.code{font-size:9pt}.device-table{width:100%;border-collapse:collapse;table-layout:fixed;margin:0 0 3mm}.device-table col:nth-child(1){width:26%}.device-table col:nth-child(2){width:24%}.device-table col:nth-child(3){width:50%}.device-table thead{display:table-header-group}.device-table th{text-align:left;font-size:10.5pt;padding:1.5mm 0 1mm;line-height:1.3}.device-table td{padding:.6mm 1mm .6mm 0;vertical-align:middle;line-height:1.25;overflow-wrap:anywhere}.device-table tr{break-inside:avoid;page-break-inside:avoid}.category{font-style:italic}.choices{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1mm}.choice{display:flex;align-items:center;justify-content:flex-end;gap:1mm;min-height:4.8mm;font-size:9pt;line-height:1.1;white-space:normal}.checkbox{display:inline-flex;align-items:center;justify-content:center;flex:0 0 4.1mm;width:4.1mm;height:4.1mm;border:1px solid #000;font:700 11pt Arial,sans-serif;line-height:1;color:#000}.closing{break-inside:avoid;page-break-inside:avoid;padding-top:3mm}.overall-row{display:grid;grid-template-columns:minmax(0,1fr) 80mm;gap:4mm;align-items:center;margin:2.5mm 0}.overall-row .choices{grid-template-columns:repeat(2,minmax(0,1fr))}.overall-row b{font-size:10.5pt}.overall-row .choice{font-size:10.5pt}.signatures{display:grid;grid-template-columns:1fr 1fr;gap:12mm;text-align:center;padding:9mm 0 2mm;min-height:31mm}.signature h3{font-size:10.5pt;margin:0 0 3mm}.signature strong{display:block;font-size:10.5pt}.signature p{font-size:10pt;line-height:1.4;margin:1mm 0}.unsigned{font-size:10pt;font-style:italic}.signed-mark{font-family:Arial,sans-serif;font-weight:bold}.print-error{padding:20px;font:16px Arial;white-space:pre-wrap}
    @media print{body{background:white}.toolbar{display:none}.paper{width:100%;margin:0;padding:0}a{color:#000}}
    @media screen and (max-width:760px){.paper{margin:10px;width:180mm}.toolbar{position:static}}
  `;
  function choices(options,result){return '<div class="choices">'+options.map(o=>'<span class="choice">'+esc(o)+'<span class="checkbox" aria-label="'+esc(o)+(o===result?' đã chọn':' chưa chọn')+'">'+(o===result?'✓':'')+'</span></span>').join('')+'</div>';}
  function signature(label,s,approval){return '<section class="signature"><h3>'+label+'</h3>'+(s?.time?'<strong>'+esc(s.name)+'</strong><p><span class="signed-mark">✓</span> '+(approval?'Đã ký duyệt':'Đã ký')+'<br>'+esc(date(s.time))+'</p>':'<p class="unsigned">(Ký, ghi rõ họ tên)</p>'+(s?.name?'<p>'+esc(s.name)+'</p>':''))+'</section>';}
  function html(p){return '<main class="paper"><header class="doc-header"><div class="logo">'+logo+'</div><div class="form-title">BIÊN BẢN KIỂM TRA ĐÁNH GIÁ<br>THIẾT BỊ ĐỊNH KỲ ('+esc(p.department)+')</div><div class="doc-meta">Mã số: BM-QT-TB-C1.04<br>Ngày ban hành/Sửa đổi: 31/10/2025<br>Lần ban hành/Sửa đổi: 1<br>Người ban hành: Nguyễn Thị Kim Chung</div></header><h1 class="machine-title">THIẾT BỊ KIỂM TRA: '+esc(p.machine)+'</h1><div class="info"><div>XƯỞNG: '+esc(p.workshop)+'</div><div class="info-row"><span>NGÀY KIỂM TRA: '+esc(date(p.day))+'</span><span class="code">'+esc(p.id)+'</span></div><div>NGƯỜI KIỂM TRA: '+esc(p.creator)+'</div></div>'+p.devices.map((d,i)=>'<table class="device-table"><colgroup><col><col><col></colgroup><thead><tr><th colspan="3">'+(i+1)+'. '+esc(d.name)+' ('+esc(d.code)+')</th></tr></thead><tbody>'+d.categories.map(g=>g.parameters.map((r,j)=>'<tr><td class="category">'+(j===0?esc(g.name):'')+'</td><td>'+esc(r.parameter?.trim().toLocaleLowerCase('vi')===g.name?.trim().toLocaleLowerCase('vi')?'':r.parameter)+'</td><td>'+choices(r.options,r.result)+'</td></tr>').join('')).join('')+'</tbody></table>').join('')+'<section class="closing"><div class="overall-row"><b>Đánh giá công tác vệ sinh</b>'+choices(['ĐẠT','KHÔNG ĐẠT'],p.hygiene)+'</div><div class="overall-row"><b>Đánh giá tình trạng hoạt động</b>'+choices(['ĐẠT','KHÔNG ĐẠT'],p.operation)+'</div><div class="signatures">'+signature('BỘ PHẬN KIỂM TRA',p.signatures.inspection,false)+signature('BỘ PHẬN SẢN XUẤT',p.signatures.production,true)+'</div></section></main>';}
  function documentHtml(p){return '<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>'+esc(p.id)+' — Biên bản kiểm tra thiết bị ('+esc(p.department)+')</title><style>'+styles+'</style></head><body><div class="toolbar"><button type="button" id="pbdPrintButton">In / Lưu PDF</button><span>Chọn máy in hoặc “Lưu dưới dạng PDF”. '+(p.catalogSource==='current'?'Phiếu cũ: danh mục chưa kiểm tra lấy theo cấu hình hiện tại.':'')+'</span></div>'+html(p)+'</body></html>';}
  function open(){const w=window.open('','_blank','width=1000,height=850');if(!w)throw Error('Trình duyệt đang chặn cửa sổ in. Cho phép popup rồi thử lại.');w.document.write('<!doctype html><meta charset="utf-8"><title>Chuẩn bị bản in</title><p>Đang tải đầy đủ checklist của máy…</p>');w.document.close();return w;}
  function render(w,p){if(w.closed)throw Error('Cửa sổ in đã đóng. Hãy mở lại.');w.document.open();w.document.write(documentHtml(p));w.document.close();w.document.getElementById('pbdPrintButton').onclick=()=>{w.focus();w.print();};(w.document.fonts?.ready || Promise.resolve()).then(()=>setTimeout(()=>{if(!w.closed){w.focus();w.print();}},250));}
  function fail(w,e){if(w&&!w.closed){w.document.body.textContent='Không tạo được bản in: '+e.message;}}
  return {open,render,fail,html,documentHtml,styles};
})();
</script>
