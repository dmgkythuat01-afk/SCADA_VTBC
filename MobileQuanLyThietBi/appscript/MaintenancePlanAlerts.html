<style>
.pbd-plan-alert-card{margin-top:16px}.pbd-plan-alert-card>h2{font-size:21px;margin-bottom:14px}.pbd-plan-alert-card .pbd-stats{grid-template-columns:repeat(3,minmax(0,1fr));margin:12px 0 18px}.pbd-plan-alert-card .pbd-stats>div{display:block;text-align:center;font-size:13px;padding:14px 10px}.pbd-plan-alert-card .pbd-stats b{display:block;margin-bottom:7px}.pbd-plan-machine>summary{cursor:pointer;padding:2px 0}.pbd-plan-machine>summary .pbd-muted{display:block;font-size:12px;font-weight:400;line-height:1.7}.pbd-plan-alert-card .pbd-stats small{display:block;font-size:11px;font-weight:400;margin-top:5px;color:#6c8178}.pbd-plan-machine{border-top:1px solid #e1ece6;padding-top:18px;margin-top:18px}.pbd-plan-machine h3{font-size:16px;margin:3px 0 5px;overflow-wrap:anywhere}.pbd-plan-items{display:grid;gap:10px;margin-top:12px}.pbd-plan-item{display:grid;grid-template-columns:minmax(0,1fr) minmax(230px,1fr);gap:14px;background:#f4f9f6;border:1px solid #dde9e2;border-left:4px solid #98b1a4;border-radius:12px;padding:14px}.pbd-plan-item.is-overdue{border-left-color:#c74c4c;background:#fff6f3}.pbd-plan-item.is-upcoming{border-left-color:#d7a447}.pbd-plan-item strong{display:block;margin-bottom:5px}.pbd-plan-item p{font-size:13px;line-height:1.65;margin:4px 0;overflow-wrap:anywhere}.pbd-plan-item .pbd-badge{margin-bottom:5px}.pbd-plan-unknown{margin-top:16px;border-top:1px dashed #d6e4dc;padding-top:14px}.pbd-plan-unknown summary{cursor:pointer;font-weight:650}.pbd-plan-empty{padding:18px 0;color:#6a8177;font-size:14px}.pbd-plan-footer{margin-top:14px;display:flex;flex-wrap:wrap;gap:10px;font-size:13px;color:#6a8177}.pbd-plan-link{border:0;background:none;color:#0b6a50;text-decoration:underline;cursor:pointer;padding:0}
@media(max-width:650px){.pbd-plan-item{grid-template-columns:minmax(0,1fr);gap:6px;padding:12px}.pbd-plan-alert-card .pbd-stats{grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.pbd-plan-alert-card .pbd-stats>div{font-size:11px;padding:12px 7px}.pbd-plan-alert-card .pbd-stats small{font-size:10px}.pbd-plan-alert-card .pbd-stats b{font-size:24px}}
</style>
<script>
window.MaintenancePlanAlerts=(()=>{
 const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),date=v=>/^\d{4}-\d{2}-\d{2}$/.test(v||'')?v.split('-').reverse().join('/'):'Chưa có';
 const count=(rows,keys)=>new Set(rows.map(r=>JSON.stringify(keys.map(k=>r[k])))).size;
 function badge(row){return '<span class="pbd-badge '+(row.trangThaiLich==='Quá hạn'?'pbd-overdue':['Đến hạn','Sắp đến hạn'].includes(row.trangThaiLich)?'pbd-upcoming':'')+'">'+esc(row.trangThaiLich)+(row.soNgayConLai<0?' · trễ '+(-row.soNgayConLai)+' ngày':row.soNgayConLai>0?' · còn '+row.soNgayConLai+' ngày':'')+'</span>';}
 function item(row){return '<div class="pbd-plan-item '+(row.trangThaiLich==='Quá hạn'?'is-overdue':['Đến hạn','Sắp đến hạn'].includes(row.trangThaiLich)?'is-upcoming':'')+'"><div><strong>'+esc(row.tenThietBi)+' · '+esc(row.maThietBi)+'</strong><p>'+esc(row.danhMucCanKiemTra)+' · '+esc(row.boPhanDanhGia)+'</p><p>Tần suất: <b>'+esc(row.tanSuatApDung||'Chưa khai báo')+'</b></p></div><div>'+badge(row)+'<p>Lần hoàn thành gần nhất: <b>'+date(row.ngayGanNhat)+'</b></p>'+(row.nguonNgay==='DanhMucSoKH'?'<p>Mốc lịch sử từ DanhMucSoKH</p>':'')+(row.nguonNgay==='ngayLapDat'?'<p>Mốc lần đầu từ ngày lắp đặt: '+date(row.ngayMoc)+'</p>':'')+'<p>Hạn tiếp theo: <b>'+date(row.ngayDenHan)+'</b></p></div></div>';}
 function groups(rows,canWrite){const groups=new Map();rows.slice().sort((a,b)=>(a.ngayDenHan||'9999').localeCompare(b.ngayDenHan||'9999')||a.tenMay.localeCompare(b.tenMay,'vi')||a.tenThietBi.localeCompare(b.tenThietBi,'vi')).forEach(row=>{const key=JSON.stringify([row.tenXuong,row.tenMay]);if(!groups.has(key))groups.set(key,[]);groups.get(key).push(row);});return [...groups.values()].map(items=>'<details class="pbd-plan-machine"><summary><span class="pbd-muted">'+esc(items[0].tenXuong)+'</span><h3>'+esc(items[0].tenMay)+'</h3><span class="pbd-muted">'+items.length+' hạng mục · '+count(items,['maThietBi'])+' thiết bị — bấm để xem</span></summary><div class="pbd-plan-items">'+items.map(item).join('')+'</div>'+(canWrite?'<div class="pbd-actions"><button data-pbd="machine" data-plan="1" data-w="'+esc(items[0].tenXuong)+'" data-m="'+esc(items[0].tenMay)+'">Tạo phiếu cho máy này</button></div>':'')+'</details>').join('');}
 function card(type,rows,status,canWrite){const selected=rows.filter(r=>r.loai===type),urgent=['Quá hạn','Đến hạn','Sắp đến hạn'],shown=selected.filter(r=>status?r.trangThaiLich===status:urgent.includes(r.trangThaiLich)),unknown=selected.filter(r=>['Chưa có mốc thực hiện','Chưa có tần suất'].includes(r.trangThaiLich)),future=selected.filter(r=>r.trangThaiLich==='Chưa đến hạn');return '<section class="pbd-card pbd-plan-alert-card" data-plan-card="'+esc(type)+'"><h2>'+type+'</h2><div class="pbd-stats">'+urgent.map((value,i)=>{const list=selected.filter(r=>r.trangThaiLich===value);return '<div><b>'+list.length+'</b>'+['Quá hạn','Đến hạn hôm nay','Trong 14 ngày tới'][i]+'<small>'+count(list,['tenXuong','tenMay'])+' máy · '+count(list,['tenXuong','tenMay','maThietBi'])+' thiết bị</small></div>';}).join('')+'</div>'+ (shown.length?groups(shown,canWrite):'<p class="pbd-plan-empty">'+(status?'Không có hạng mục ở trạng thái đang chọn.':'Không có hạng mục quá hạn, đến hạn hoặc sắp đến hạn trong 14 ngày tới.')+'</p>')+(!status&&unknown.length?'<details class="pbd-plan-unknown"><summary>'+unknown.length+' hạng mục chưa đủ mốc hoặc tần suất — cần kiểm tra</summary>'+groups(unknown,false)+'</details>':'')+(!status&&future.length?'<div class="pbd-plan-footer">'+future.length+' hạng mục có hạn sau 14 ngày.<button class="pbd-plan-link" data-plan-status="Chưa đến hạn">Xem các mục này</button></div>':'')+'</section>';}
 function html(rows,status,canWrite){return ['Bảo dưỡng','Thay mới'].map(type=>card(type,rows,status,canWrite)).join('');}
 document.addEventListener('click',e=>{const button=e.target.closest('[data-plan-status]');if(!button)return;PlannedMaintenance.state.filters.status=button.dataset.planStatus;PlannedMaintenance.render();});
 return {html};
})();
</script>
