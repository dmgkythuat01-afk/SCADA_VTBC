<style>
  @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");
  :root {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    font-size: 16px;
    color: #163d32;
    background: #f3f6f2;
    --mg: #176c52;
    --line: #e0e8df;
    --muted: #748376;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    -webkit-text-size-adjust: 100%;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button,
  a {
    -webkit-tap-highlight-color: transparent;
  }
  button {
    cursor: pointer;
    min-height: 48px;
    padding: 12px 16px;
    border: 1px solid var(--line);
    border-radius: 13px;
    background: white;
    color: #244f3f;
    font-size: 14px;
    font-weight: 600;
    line-height: 1.4;
  }
  button:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  .m-primary {
    background: var(--mg);
    border-color: var(--mg);
    color: white;
  }
  .m-danger {
    background: #fff0e9;
    color: #aa4e39;
    border-color: #f0d7cb;
  }
  .m-wide {
    width: 100%;
  }
  input,
  select,
  textarea {
    display: block;
    width: 100%;
    min-height: 52px;
    padding: 13px 14px;
    border: 1px solid #d5e0d5;
    border-radius: 12px;
    background: #fcfdfb;
    color: #183d32;
    margin-top: 9px;
    font-size: 16px;
    line-height: 1.55;
  }
  textarea {
    resize: vertical;
  }
  input:focus,
  select:focus,
  textarea:focus {
    outline: 2px solid #a6cbb0;
    outline-offset: 1px;
  }
  label {
    display: block;
    font-size: 14px;
    font-weight: 600;
    margin: 19px 0;
  }
  fieldset {
    border: 0;
    margin: 0;
    padding: 0;
    min-width: 0;
  }
  .m-logo {
    display: inline-grid;
    place-items: center;
    width: 42px;
    height: 42px;
    background: #acd2a3;
    color: #123e35;
    font-size: 27px;
    font-weight: 800;
    border-radius: 14px;
    flex-shrink: 0;
  }
  .m-eyebrow {
    display: block;
    color: #7b947e;
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.5px;
  }
  .m-login {
    max-width: 480px;
    padding: 32px 24px 28px;
    margin: auto;
    min-height: 100dvh;
    background:
      radial-gradient(ellipse at 100% 0, #dbe9d4, transparent 55%), #f3f6f2;
  }
  .m-login-brand {
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 22px;
    font-weight: 800;
  }
  .m-login-brand small {
    display: block;
    font-size: 9px;
    letter-spacing: 2px;
    margin-top: 3px;
    color: #6b8270;
  }
  .m-login-copy {
    padding: 37px 0 25px;
  }
  .m-login h1 {
    font-size: 34px;
    line-height: 1.35;
    letter-spacing: -1.2px;
    margin: 14px 0;
  }
  .m-login h1 em {
    font-style: normal;
    color: #33835d;
  }
  .m-login p {
    font-size: 13px;
    line-height: 1.8;
    color: #738274;
  }
  .m-login-form {
    padding: 22px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 22px;
    box-shadow: 0 12px 45px #23433307;
  }
  .m-login-form h2 {
    font-size: 20px;
    margin: 0;
  }
  .m-login-form label {
    font-size: 12px;
  }
  .m-password {
    display: flex;
    position: relative;
  }
  .m-password input {
    padding-right: 66px;
  }
  .m-password button {
    position: absolute;
    right: 5px;
    top: 14px;
    padding: 8px;
    background: transparent;
    border: 0;
    min-height: 42px;
    font-size: 12px;
  }
  .m-desktop-link {
    display: block;
    text-align: center;
    font-size: 11px;
    margin-top: 24px;
    color: #6d806d;
  }
  .m-topbar {
    height: 83px;
    background: #fffefb;
    border-bottom: 1px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 20px;
    position: sticky;
    top: 0;
    z-index: 30;
  }
  .m-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    color: #163d32;
    text-decoration: none;
    font-size: 21px;
    font-weight: 800;
  }
  .m-brand small {
    display: block;
    font-size: 8px;
    letter-spacing: 1.3px;
    font-weight: 600;
    margin-top: 3px;
    color: #7a8878;
  }
  .m-brand .m-logo {
    width: 38px;
    height: 38px;
    font-size: 24px;
    border-radius: 12px;
  }
  .m-top-actions {
    display: flex;
    align-items: center;
    gap: 9px;
  }
  .m-icon-button {
    border: 0;
    background: #edf2e9;
    min-width: 44px;
    min-height: 44px;
    padding: 8px;
    font-size: 23px;
    line-height: 1;
    border-radius: 14px;
  }
  .m-avatar {
    height: 42px;
    width: 42px;
    min-height: 42px;
    padding: 0;
    border-radius: 50%;
    background: #183e33;
    border: 0;
    color: #e9f1dc;
    font-size: 15px;
  }
  .m-main {
    max-width: 700px;
    margin: auto;
    padding: 12px 18px calc(112px + env(safe-area-inset-bottom));
  }
  .m-sync {
    font-size: 10px;
    text-align: right;
    color: #92a08f;
    margin: 0 0 18px;
  }
  .m-title {
    font-size: 26px;
    letter-spacing: -0.9px;
    line-height: 1.4;
    margin: 4px 0 9px;
  }
  .m-subtitle {
    font-size: 13px;
    line-height: 1.8;
    color: #798676;
    margin: 0 0 23px;
  }
  .m-hero {
    padding: 24px;
    background: #123e35;
    color: white;
    border-radius: 22px;
    position: relative;
    overflow: hidden;
    margin-bottom: 18px;
  }
  .m-hero::after {
    content: "";
    position: absolute;
    width: 200px;
    height: 200px;
    border: 35px solid #ffffff08;
    border-radius: 50%;
    right: -85px;
    top: -75px;
    pointer-events: none;
  }
  .m-hero .m-eyebrow {
    color: #acccaa;
  }
  .m-hero h1 {
    font-size: 26px;
    line-height: 1.45;
    letter-spacing: -0.6px;
    margin: 14px 0 8px;
    position: relative;
    z-index: 1;
  }
  .m-hero p {
    font-size: 12px;
    line-height: 1.8;
    color: #c5d9c5;
    margin: 0 0 16px;
  }
  .m-hero button {
    background: #b9d8a3;
    color: #123e35;
    border: 0;
    position: relative;
    z-index: 1;
  }
  .m-stats {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 11px;
    margin-bottom: 27px;
  }
  .m-stat {
    padding: 18px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 17px;
    text-align: left;
  }
  .m-stat small {
    font-size: 11px;
    color: #7c8b79;
  }
  .m-stat b {
    display: block;
    font-size: 31px;
    letter-spacing: -1px;
    margin-top: 11px;
  }
  .m-stat.warning {
    background: #fff4e5;
    border-color: #ecdac4;
  }
  .m-stat.warning b {
    color: #a66b2f;
  }
  .m-section-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
    margin: 25px 0 13px;
  }
  .m-section-head h2 {
    font-size: 17px;
    margin: 0;
  }
  .m-section-head button {
    font-size: 11px;
    min-height: 32px;
    padding: 6px 9px;
    border: 0;
    background: transparent;
  }
  .m-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 18px;
    margin-bottom: 13px;
    overflow: hidden;
  }
  .m-card-body {
    padding: 20px;
  }
  .m-ticket-open {
    display: block;
    width: 100%;
    text-align: left;
    border: 0;
    background: white;
    border-radius: 0;
    padding: 19px;
    min-height: 0;
    font-weight: 400;
  }
  .m-ticket-open:active {
    background: #f6faf1;
  }
  .m-card-top {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    align-items: center;
    margin-bottom: 13px;
  }
  .m-code {
    font-size: 10px;
    letter-spacing: 0.5px;
    color: #8a9886;
    font-weight: 600;
  }
  .m-badge {
    font-size: 10px;
    font-weight: 600;
    line-height: 1.5;
    border-radius: 7px;
    padding: 5px 8px;
    display: inline-block;
    background: #eaf1e5;
    color: #4d7751;
  }
  .m-badge.new {
    background: #e7eefb;
    color: #55769b;
  }
  .m-badge.in_progress {
    background: #e8f3ef;
    color: #267b60;
  }
  .m-badge.awaiting_confirmation {
    background: #fff0d6;
    color: #ab762c;
  }
  .m-badge.rework {
    background: #fce8e2;
    color: #b45945;
  }
  .m-badge.completed,
  .m-badge.accepted {
    background: #e7f0db;
    color: #5b7c40;
  }
  .m-badge.rejected {
    background: #fce8e2;
    color: #b45945;
  }
  .m-badge.draft {
    background: #f1eee6;
    color: #817658;
  }
  .m-ticket-open h3 {
    font-size: 17px;
    font-weight: 600;
    line-height: 1.6;
    letter-spacing: -0.3px;
    margin: 0 0 10px;
    color: #234d3e;
  }
  .m-ticket-open p {
    font-size: 12px;
    color: #81907d;
    line-height: 1.7;
    margin: 4px 0;
    white-space: normal;
  }
  .m-ticket-open .m-card-bottom {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    border-top: 1px solid #f0f3ed;
    margin-top: 15px;
    padding-top: 13px;
    font-size: 10px;
    color: #8c9887;
  }
  .m-group-title {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: 12px;
    letter-spacing: 0.4px;
    margin: 25px 0 13px;
    color: #647e65;
  }
  .m-group-title span {
    background: #e8eee2;
    padding: 4px 8px;
    border-radius: 7px;
    font-size: 10px;
  }
  .m-filters {
    margin-bottom: 20px;
  }
  .m-filters input {
    margin: 0 0 10px;
    background: white;
  }
  .m-filters select {
    background: white;
    font-size: 13px;
    min-height: 46px;
  }
  .m-chips {
    display: flex;
    gap: 7px;
    overflow: auto;
    margin: 15px -18px 0;
    padding: 0 18px 8px;
    scrollbar-width: none;
  }
  .m-chips button {
    white-space: nowrap;
    font-size: 11px;
    min-height: 35px;
    padding: 8px 12px;
    border-radius: 20px;
    background: transparent;
  }
  .m-chips button.active {
    background: #183e33;
    color: #fff;
    border-color: #183e33;
  }
  .m-empty {
    padding: 38px 20px;
    text-align: center;
    background: #fbfcf7;
    border: 1px dashed #d6e1cf;
    border-radius: 18px;
    color: #8a9783;
    font-size: 13px;
    line-height: 1.9;
  }
  .m-empty b {
    display: block;
    color: #4f7155;
    font-size: 16px;
    margin-bottom: 8px;
  }
  .m-form-card {
    background: white;
    padding: 20px;
    border: 1px solid var(--line);
    border-radius: 20px;
  }
  .m-form-card h2 {
    font-size: 17px;
    margin: 0 0 8px;
  }
  .m-form-section {
    border-bottom: 1px solid #edf1e8;
    padding: 8px 0 18px;
  }
  .m-form-section:last-of-type {
    border: 0;
  }
  .m-step {
    display: inline-grid;
    place-items: center;
    width: 24px;
    height: 24px;
    margin-right: 8px;
    border-radius: 8px;
    background: #e9f2df;
    color: #698154;
    font-size: 11px;
  }
  .m-optional {
    font-weight: 400;
    color: #94a18e;
    font-size: 11px;
    margin-left: 6px;
  }
  .m-hint {
    font-size: 11px;
    color: #81907c;
    line-height: 1.8;
  }
  .m-error {
    font-size: 12px;
    color: #b05142;
    line-height: 1.7;
    white-space: pre-wrap;
  }
  .m-error-panel {
    padding: 14px 16px;
    border-radius: 12px;
    background: #fff0e8;
    color: #a0503e;
    font-size: 12px;
    line-height: 1.7;
    margin-bottom: 16px;
    white-space: pre-wrap;
  }
  .m-bottom {
    display: flex;
    position: fixed;
    bottom: 0;
    left: 0;
    right: 0;
    padding: 10px 9px calc(10px + env(safe-area-inset-bottom));
    background: #fffefbee;
    border-top: 1px solid #dfe7d9;
    backdrop-filter: blur(16px);
    z-index: 40;
    justify-content: center;
  }
  .m-bottom button {
    flex: 1;
    max-width: 140px;
    border: 0;
    background: transparent;
    min-width: 0;
    padding: 5px 2px;
    color: #8c9986;
    min-height: 52px;
    border-radius: 10px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    position: relative;
  }
  .m-bottom button span {
    font-size: 9px;
    font-weight: 500;
    white-space: nowrap;
  }
  .m-bottom button svg {
    width: 22px;
    height: 22px;
    stroke-width: 1.8;
  }
  .m-bottom button.active {
    color: #1c6d4e;
  }
  .m-bottom button.active::before {
    content: "";
    width: 22px;
    height: 3px;
    border-radius: 4px;
    background: #1c6d4e;
    position: absolute;
    top: -10px;
  }
  .m-bottom .m-nav-count {
    position: absolute;
    top: 0;
    left: calc(50% + 8px);
    font-size: 8px;
    background: #b56c42;
    color: white;
    border-radius: 10px;
    padding: 2px 5px;
    min-width: 15px;
  }
  .m-back {
    border: 0;
    background: transparent;
    padding: 0;
    min-height: 36px;
    font-size: 12px;
    margin-bottom: 12px;
  }
  .m-detail-title {
    font-size: 24px;
    letter-spacing: -0.6px;
    line-height: 1.5;
    margin: 14px 0;
  }
  .m-detail-description {
    font-size: 15px;
    white-space: pre-wrap;
    line-height: 1.9;
    margin: 12px 0;
    color: #385d49;
  }
  .m-detail-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 18px;
    margin: 20px 0 3px;
  }
  .m-detail-grid label {
    font-size: 10px;
    margin: 0 0 7px;
    color: #95a08e;
    font-weight: 500;
  }
  .m-detail-grid p {
    font-size: 12px;
    font-weight: 500;
    line-height: 1.7;
    margin: 0;
    overflow-wrap: anywhere;
  }
  .m-action-bar {
    display: flex;
    gap: 10px;
    margin: 20px 0;
  }
  .m-action-bar button {
    flex: 1;
  }
  .m-history {
    padding: 20px;
  }
  .m-history + .m-history {
    border-top: 1px solid #edf1e8;
  }
  .m-history h3 {
    font-size: 15px;
    margin: 12px 0 5px;
  }
  .m-history p {
    font-size: 13px;
    line-height: 1.9;
    white-space: pre-wrap;
  }
  .m-history small {
    font-size: 10px;
    color: #8e9b85;
    display: block;
    line-height: 1.8;
  }
  .m-review-note {
    background: #f3f6eb;
    padding: 14px;
    border-radius: 12px;
    margin-top: 16px;
    font-size: 12px;
    line-height: 1.8;
  }
  .m-review-note.rejected {
    background: #fff1e9;
    color: #a76145;
  }
  .m-review-note b {
    display: block;
    margin-bottom: 5px;
  }
  .m-attachments {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }
  .m-attachments button {
    font-size: 11px;
    min-height: 38px;
    padding: 8px 12px;
    background: #f8faf4;
  }
  .m-sheet {
    border: 0;
    border-radius: 24px 24px 0 0;
    padding: 22px 20px calc(24px + env(safe-area-inset-bottom));
    max-width: 620px;
    width: 100%;
    max-height: 94dvh;
    margin: auto auto 0;
    box-shadow: 0 -20px 80px #163c3425;
  }
  .m-sheet::backdrop,
  .m-photo-dialog::backdrop {
    background: #102e2580;
    backdrop-filter: blur(4px);
  }
  .m-sheet-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 23px;
  }
  .m-sheet-head h2 {
    font-size: 22px;
    margin: 8px 0 0;
    letter-spacing: -0.5px;
  }
  .m-sheet-head .m-icon-button {
    font-size: 17px;
    flex-shrink: 0;
  }
  .m-performer {
    padding: 15px;
    background: #edf4e8;
    border-radius: 13px;
    font-size: 13px;
    line-height: 1.8;
  }
  .m-performer b {
    display: block;
    font-size: 15px;
  }
  .m-performer small {
    display: block;
    color: #7d8e74;
    font-size: 11px;
  }
  .m-check {
    font-size: 13px;
    line-height: 1.8;
    display: flex;
    align-items: start;
    gap: 12px;
    margin: 13px 0;
  }
  .m-check input {
    min-height: 20px;
    width: 20px;
    margin: 3px 0 0;
    flex-shrink: 0;
    accent-color: #176c52;
  }
  .m-photo-actions {
    display: flex;
    gap: 10px;
  }
  .m-photo-actions button {
    flex: 1;
    font-size: 13px;
    background: #f5f8ef;
  }
  .m-photo-grid {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 9px;
    margin: 15px 0;
  }
  .m-photo-tile {
    position: relative;
    aspect-ratio: 1;
    border-radius: 12px;
    overflow: hidden;
    background: #ecf1e6;
    border: 1px solid var(--line);
  }
  .m-photo-tile img {
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .m-photo-tile > button {
    width: 100%;
    height: 100%;
    font-size: 11px;
    border: 0;
    background: #eef5e5;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 6px;
    padding: 8px;
  }
  .m-photo-tile .m-remove-photo {
    position: absolute;
    top: 4px;
    right: 4px;
    border-radius: 50%;
    width: 25px;
    height: 25px;
    min-height: 25px;
    background: #173d32d9;
    color: white;
    padding: 0;
    font-size: 13px;
  }
  .m-photo-tile small {
    font-size: 9px;
    color: #718369;
  }
  .m-sheet-actions {
    display: flex;
    gap: 10px;
    margin-top: 20px;
  }
  .m-sheet-actions button {
    flex: 1;
  }
  .m-sheet-actions .m-primary {
    flex: 1.7;
  }
  .m-choice {
    display: flex;
    align-items: start;
    gap: 13px;
    padding: 16px;
    border: 1px solid var(--line);
    border-radius: 14px;
    margin: 13px 0;
  }
  .m-choice input {
    width: 20px;
    min-height: 20px;
    margin: 2px 0 0;
    flex-shrink: 0;
    accent-color: var(--mg);
  }
  .m-choice b {
    font-size: 13px;
  }
  .m-choice small {
    display: block;
    color: #81907b;
    font-size: 11px;
    font-weight: 400;
    line-height: 1.8;
    margin-top: 5px;
  }
  .m-photo-dialog {
    border: 0;
    border-radius: 18px;
    padding: 12px;
    max-width: 100%;
    width: calc(100% - 20px);
    background: #102e25;
  }
  .m-photo-dialog > button {
    display: block;
    margin-left: auto;
    background: #ffffff20;
    color: white;
    font-size: 16px;
  }
  .m-photo-dialog img {
    display: block;
    max-width: 100%;
    max-height: 78dvh;
