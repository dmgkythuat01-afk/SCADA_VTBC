<script>
  const Mobile = (() => {
    const $ = (id) => document.getElementById(id),
      esc = (value) =>
        String(value ?? "").replace(
          /[&<>"']/g,
          (c) =>
            ({
              "&": "&amp;",
              "<": "&lt;",
              ">": "&gt;",
              '"': "&quot;",
              "'": "&#39;",
            })[c],
        ),
      parse = (v, f = []) => {
        try {
          return JSON.parse(v || "");
        } catch {
          return f;
        }
      },
      uid = () => crypto.randomUUID();
    const STATUS = {
      new: "Mới tạo",
      in_progress: "Đang xử lý",
      awaiting_confirmation: "Chờ trưởng ca xác nhận",
      awaiting_pgd: "Chờ hai PGĐ phê duyệt",
      shift_confirmed: "Trưởng ca đã xác nhận",
      rework: "Cần làm lại",
      completed: "Hoàn thành",
      draft: "Bản nháp",
      submitted: "Đã gửi",
      accepted: "Đã đồng ý",
      rejected: "Cần làm lại",
    };
    const ICONS = {
      home: "M3 10 12 3l9 7M5 9v12h5v-7h4v7h5V9",
      tickets: "M7 3h10v4H7zM5 5H3v16h18V5h-2M7 12h10M7 16h6",
      plus: "M12 5v14M5 12h14",
      check: "m5 12 4 4 10-10M20 13v7H4V4h11",
      person: "M16 7a4 4 0 1 1-8 0 4 4 0 0 1 8 0ZM4 22v-3a8 8 0 0 1 16 0v3",
      assigned: "M9 4H4v17h16V4h-5M9 2h6v4H9zM8 13l3 3 5-6",
    };
    const M = {
      token: sessionStorage.getItem("dmgMobileWorkSession") || "",
      data: null,
      page: $("mobileInitialRequest").value ? "detail" : "home",
      requestId: $("mobileInitialRequest").value,
      status: "all",
      workshop: "all",
      query: "",
      mode: "requester",
      busy: false,
      loading: false,
      createKey: uid(),
      createDraft: {},
      reportDraft: null,
      pending: [],
      submitKey: "",
      review: null,
      reviewKey: "",
    };
    function rpc(method, ...args) {
      return new Promise((resolve, reject) => {
        if (!window.google?.script?.run) {
          reject(Error("Hãy mở bằng link Apps Script."));
          return;
        }
        google.script.run
          .withSuccessHandler(resolve)
          .withFailureHandler((e) =>
            reject(Error(e.message || "Không thực hiện được.")),
          )
          [method](...args);
      });
    }
    async function api(action, payload = {}) {
      const combined = [
        "create",
        "claim",
        "startReport",
        "submitReport",
        "review",
        "approve",
        "markRead",
      ].includes(action);
      const requestToken = M.token;
      const response = await rpc(
        "mobileApi",
        requestToken,
        action,
        combined ? { ...payload, _withSnapshot: true } : payload,
      );
      if (M.token !== requestToken)
        throw Error("Phiên đăng nhập đã thay đổi. Bỏ qua kết quả cũ.");
      if (combined && response.snapshot) {
        M.nextSnapshot = { token: requestToken, data: response.snapshot };
        return response.result;
      }
      return response;
    }
    function toast(text) {
      $("mobileToast").textContent = text;
      $("mobileToast").hidden = false;
      setTimeout(() => ($("mobileToast").hidden = true), 6000);
    }
    function error(e) {
      $("mobileError").hidden = false;
      $("mobileError").textContent = e.message || String(e);
    }
    function enabled(r) {
      return String(r.active) !== "false";
    }
    function date(value) {
      if (!value) return "";
      return String(value).slice(0, 10).split("-").reverse().join("/");
    }
    function time(value) {
      if (!value) return "";
      const d = new Date(value);
      return isNaN(d)
        ? String(value)
        : d.toLocaleString("vi-VN", {
            timeZone: "Asia/Ho_Chi_Minh",
            day: "2-digit",
            month: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
          });
    }
    function requestTypeLabel(type) {
      return (
        { repair: "Sửa chữa", maintenance: "Bảo dưỡng", new_work: "Làm mới" }[
          type
        ] || type
      );
    }
    function roleName(value) {
      const key = String(value || "")
        .normalize("NFD")
        .replace(/[\u0300-\u036f]/g, "")
        .replace(/[đĐ]/g, "d")
        .replace(/[^a-zA-Z0-9]/g, "")
        .toLowerCase();
      return (
        {
          truongca: "Trưởng ca",
          congnhan: "Công nhân",
          phongcongnghe: "Phòng Công nghệ",
          pgdchatluong: "PGĐ Chất lượng",
          pgdsanxuat: "PGĐ Sản xuất",
          pgdcongnghe: "PGĐ Công nghệ",
          kythuat: "Kỹ thuật",
          cokhi: "Cơ khí",
          tudonghoa: "Tự động hóa",
          admin: "Quản trị",
          kythuatbaotri: "Kỹ thuật bảo trì",
          technician: "Kỹ thuật",
        }[key] || value
      );
    }
    function technical() {
      return M.mode === "technical";
    }
    function person(username) {
      return (
        M.data.technicians.find((t) => t.useName === username)?.name ||
        (username === M.data.user.email ? M.data.user.name : username) ||
        "Chưa nhận"
      );
    }
    function request(id) {
      return M.data.requests.find((r) => r.id === id);
    }
    function badge(status) {
      return (
        '<span class="m-badge ' +
        esc(status) +
        '">' +
        esc(STATUS[status] || status) +
        "</span>"
      );
    }
    function button(action, label, id = "", cls = "") {
      return (
        '<button type="button" class="' +
        cls +
        '" data-mobile-action="' +
        action +
        '" data-id="' +
        esc(id) +
        '">' +
        label +
        "</button>"
      );
    }
    function empty(title, text = "") {
      return (
        '<div class="m-empty"><b>' + esc(title) + "</b>" + esc(text) + "</div>"
      );
    }
    function managerMode() {
      return !!(M.data.capabilities.approver || M.data.capabilities.viewer);
    }
    function canConfirm(r) {
      return (
        M.data.capabilities.shiftLeader && r.status === "awaiting_confirmation"
      );
    }
    function canApprove(r) {
      const branch = M.data.capabilities.approver,
        field = {
          quality: "trangThaiPGDChatLuong",
          production: "trangThaiPGDSanXuat",
        }[branch];
      return (
        !!field && r.status === "awaiting_pgd" && r[field] === "Chờ phê duyệt"
      );
    }
    function pendingMine() {
      return M.data.requests.filter((r) =>
        managerMode()
          ? M.data.capabilities.viewer
            ? r.status === "awaiting_pgd"
            : canApprove(r)
          : M.data.capabilities.shiftLeader
            ? canConfirm(r)
            : r.createdBy === M.data.user.email &&
              ["awaiting_confirmation", "awaiting_pgd"].includes(r.status),
      );
    }
    function reviewLabel(v) {
      const actor = v.decision.startsWith("quality_")
        ? "PGĐ Chất lượng"
        : v.decision.startsWith("production_")
          ? "PGĐ Sản xuất"
          : "Xác nhận ban đầu";
      return (
        actor +
        " · " +
        (v.decision.endsWith("reject")
          ? "Không đồng ý — yêu cầu làm lại"
          : "Đã đồng ý")
      );
    }
    function pgdStatusCards(r) {
      return (
        '<section class="m-approval-panel"><h2>Phê duyệt song song</h2><p class="m-hint">Hai PGĐ duyệt độc lập. Phiếu chỉ hoàn thành khi cả hai đồng ý.</p><div class="m-approval-grid">' +
        [
          ["quality", "PGĐ Chất lượng", "trangThaiPGDChatLuong"],
          ["production", "PGĐ Sản xuất", "trangThaiPGDSanXuat"],
        ]
          .map(([branch, label, field]) => {
            const sign = M.data.reviews.find(
                (v) =>
                  v.reportId === r.lastReportId &&
                  v.decision.startsWith(branch + "_"),
              ),
              status =
                r[field] ||
                (r.status === "completed"
                  ? "Theo luồng trước"
                  : "Chưa đến bước");
            return (
              '<div class="m-approval-status ' +
              (status === "Đã phê duyệt"
                ? "approved"
                : status === "Không phê duyệt"
                  ? "rejected"
                  : "") +
              '"><b>' +
              label +
              "</b><span>" +
              esc(status) +
              "</span>" +
              (sign
                ? "<small>" +
                  esc(sign.createdByName) +
                  " · " +
                  time(sign.createdAt) +
                  "</small>"
                : "") +
              "</div>"
            );
          })
          .join("") +
        "</div></section>"
      );
    }
    async function load(quiet = false) {
      if (M.loading) return;
      const token = M.token;
      M.loading = true;
      $("mobileRefresh").disabled = true;
      try {
        const prefetched = M.nextSnapshot;
        M.nextSnapshot = null;
        const data =
          prefetched?.token === token ? prefetched.data : await api("snapshot");
        if (M.token !== token) return;
        M.data = data;
        M.mode = data.capabilities.admin
          ? sessionStorage.getItem("mobileAdminMode") || "technical"
          : data.capabilities.technical
            ? "technical"
            : "requester";
        $("mobileLogin").hidden = true;
        $("mobileApp").hidden = false;
        $("mobileError").hidden = true;
        $("mobileAvatar").textContent = (data.user.name || data.user.email)
          .trim()
          .charAt(0)
          .toUpperCase();
        $("mobileSync").textContent =
          "Cập nhật " +
          new Date().toLocaleTimeString("vi-VN", {
            hour: "2-digit",
            minute: "2-digit",
          });
        if (!quiet || !["create"].includes(M.page)) render();
      } catch (e) {
        if (M.token !== token) return;
        if (/phiên đăng nhập/i.test(e.message)) {
          showLogin();
          $("mobileLoginError").textContent = e.message;
        } else throw e;
      } finally {
        if (M.token === token) {
          M.loading = false;
          $("mobileRefresh").disabled = false;
        }
      }
    }
    function nav() {
      const items = managerMode()
        ? [
            ["home", "Tổng quan", "home"],
            ["tickets", "Tất cả phiếu", "tickets"],
            [
              "pending",
              M.data.capabilities.approver ? "Chờ tôi duyệt" : "Chờ PGĐ duyệt",
              "check",
            ],
            ["results", "Lịch sử duyệt", "assigned"],
            ["account", "Tài khoản", "person"],
          ]
        : technical()
          ? [
              ["home", "Tổng quan", "home"],
              ["tickets", "Tất cả phiếu", "tickets"],
              ["assigned", "Giao cho tôi", "assigned"],
              ["results", "Kết quả", "check"],
              ["account", "Tài khoản", "person"],
            ]
          : [
              ["home", "Tổng quan", "home"],
              [
                "tickets",
                M.data.capabilities.shiftLeader
                  ? "Tất cả phiếu"
                  : "Phiếu của tôi",
                "tickets",
              ],
              ["create", "Tạo phiếu", "plus"],
              [
                "pending",
                M.data.capabilities.shiftLeader ? "Chờ xác nhận" : "Theo dõi",
                "check",
              ],
              ["account", "Tài khoản", "person"],
            ];
      $("mobileNav").innerHTML = items
        .map(
          ([page, label, icon]) =>
            '<button type="button" data-mobile-action="page" data-id="' +
            page +
            '" class="' +
            ((M.page === "detail" ? "tickets" : M.page) === page
              ? "active"
              : "") +
            '"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="' +
            ICONS[icon] +
            '"/></svg><span>' +
            label +
            "</span>" +
            (!technical() && page === "pending" && pendingMine().length
              ? '<small class="m-nav-count">' +
                pendingMine().length +
                "</small>"
              : "") +
            "</button>",
        )
        .join("");
    }
    function render() {
      if (!M.data) return;
      nav();
      (
        ({
          home: home,
          tickets: tickets,
          assigned: tickets,
          pending: pending,
          results: results,
          create: create,
          account: account,
          detail: detail,
        })[M.page] || home
      )();
    }
    function ticketCard(r) {
      return (
        '<article class="m-card"><button type="button" class="m-ticket-open" data-mobile-action="open" data-id="' +
        esc(r.id) +
        '"><div class="m-card-top"><span class="m-code">#' +
        esc(r.id.slice(-8).toUpperCase()) +
        "</span>" +
        badge(r.status) +
        "</div><h3>" +
        esc(r.title) +
        "</h3><p>⚙ " +
        esc(r.machineName) +
        (r.componentName ? " · " + esc(r.componentName) : " · Toàn máy") +
        "</p><p>" +
        esc(requestTypeLabel(r.type)) +
        " · Giao cho " +
        esc(person(r.assignedTo)) +
        '</p><div class="m-card-bottom"><span>' +
        esc(r.createdByName || r.createdBy) +
        "</span><span>" +
        time(r.createdAt) +
        " →</span></div></button></article>"
      );
    }
    function home() {
      const rows = M.data.requests,
        counts = [
          ["Mới tạo", rows.filter((r) => r.status === "new").length, "new"],
          [
            "Đang xử lý",
            rows.filter((r) => r.status === "in_progress").length,
            "in_progress",
          ],
          [
            "Chờ xác nhận",
            rows.filter((r) => r.status === "awaiting_confirmation").length,
            "awaiting_confirmation",
          ],
          [
            "Cần làm lại",
            rows.filter((r) => r.status === "rework").length,
            "rework",
          ],
        ];
      const urgent = rows
        .filter((r) =>
          technical()
            ? ["new", "rework"].includes(r.status)
            : pendingMine().some((p) => p.id === r.id),
        )
        .sort((a, b) => String(b.updatedAt).localeCompare(String(a.updatedAt)))
        .slice(0, 4);
      const notices = M.data.notifications.slice().reverse().slice(0, 4);
      $("mobileContent").innerHTML =
        '<section class="m-hero"><span class="m-eyebrow">' +
        esc(
          managerMode()
            ? "PHÊ DUYỆT & THEO DÕI"
            : technical()
              ? "ĐỘI NGŨ KỸ THUẬT"
              : "VẬN HÀNH CHỦ ĐỘNG",
        ) +
        "</span><h1>Chào " +
        esc(M.data.user.name) +
        " 👋</h1><p>" +
        esc(
          technical()
            ? "Theo dõi mọi phiếu theo xưởng. Bạn có thể nhận và xử lý bất kỳ phiếu nào."
            : "Gửi vấn đề đúng nơi, theo dõi kết quả và xác nhận sau khi kiểm tra.",
        ) +
        "</p>" +
        button(
          "page",
          !M.data.capabilities.requester
            ? "Xem phiếu yêu cầu →"
            : "＋ Tạo yêu cầu mới",
          !M.data.capabilities.requester ? "tickets" : "create",
        ) +
        '</section><div class="m-stats">' +
        counts
          .concat([
            [
              "Chờ PGĐ duyệt",
              rows.filter((r) => r.status === "awaiting_pgd").length,
              "awaiting_pgd",
            ],
          ])
          .map(
            ([label, n, status]) =>
              '<button type="button" class="m-stat ' +
              (["awaiting_confirmation", "rework"].includes(status)
                ? "warning"
                : "") +
              '" data-mobile-action="status" data-id="' +
              status +
              '"><small>' +
              label +
              "</small><b>" +
              n +
              "</b></button>",
          )
          .join("") +
        '</div><div class="m-section-head"><h2>' +
        esc(
          technical()
            ? "Cần ưu tiên xử lý"
            : managerMode()
              ? "Chờ phê duyệt PGĐ"
              : M.data.capabilities.shiftLeader
                ? "Đang chờ trưởng ca xác nhận"
                : "Theo dõi xác nhận & phê duyệt",
        ) +
        "</h2>" +
        button("page", "Xem tất cả →", technical() ? "tickets" : "pending") +
        "</div>" +
        (urgent.length
          ? urgent.map(ticketCard).join("")
          : empty(
              "Mọi thứ đã được cập nhật",
              technical()
                ? "Chưa có phiếu mới hoặc cần làm lại."
                : "Kết quả kỹ thuật gửi sẽ xuất hiện ở đây.",
            )) +
        (notices.length
          ? '<div class="m-section-head"><h2>Thông báo gần đây</h2></div><div class="m-card">' +
            notices
              .map(
                (n) =>
                  '<button class="m-notification ' +
                  (n.status === "unread" ? "unread" : "") +
                  '" data-mobile-action="notice" data-id="' +
                  esc(n.id) +
                  '"><b>' +
                  esc(n.message) +
                  "</b><small>" +
                  time(n.sentAt) +
                  "</small></button>",
              )
              .join("") +
            "</div>"
          : "");
    }
    function filteredTickets() {
      let rows = M.data.requests;
      if (M.page === "assigned")
        rows = rows.filter((r) => r.assignedTo === M.data.user.email);
      if (M.status !== "all") rows = rows.filter((r) => r.status === M.status);
      if (M.workshop !== "all")
        rows = rows.filter((r) => r.workshopId === M.workshop);
      if (M.query) {
        const q = M.query.toLocaleLowerCase("vi");
        rows = rows.filter((r) =>
          (
            r.title +
            " " +
            r.description +
            " " +
            r.machineName +
            " " +
            r.componentName +
            " " +
            r.createdByName +
            " " +
            person(r.assignedTo)
          )
            .toLocaleLowerCase("vi")
            .includes(q),
        );
      }
      return rows
        .slice()
        .sort((a, b) => String(b.createdAt).localeCompare(String(a.createdAt)));
    }
    function tickets() {
      const workshops = new Map(
        M.data.requests.map((r) => [r.workshopId, r.workshopName]),
      );
      $("mobileContent").innerHTML =
        '<h1 class="m-title">' +
        (M.page === "assigned"
          ? "Giao cho tôi"
          : technical()
            ? "Tất cả phiếu yêu cầu"
            : M.data.capabilities.shiftLeader || managerMode()
              ? "Tất cả phiếu yêu cầu"
              : "Phiếu của tôi") +
        '</h1><p class="m-subtitle">' +
        esc(
          technical()
            ? "Danh sách được gom theo xưởng. Mọi kỹ thuật đều được nhận và xử lý."
            : "Theo dõi từng yêu cầu từ lúc tạo đến khi xác nhận hoàn thành.",
        ) +
        '</p><div class="m-filters"><input id="mobileSearch" placeholder="Tìm máy, bộ phận, nội dung…" value="' +
        esc(M.query) +
        '"><select id="mobileWorkshopFilter"><option value="all">Tất cả xưởng</option>' +
        Array.from(workshops)
          .map(
            ([id, name]) =>
              '<option value="' +
              esc(id) +
              '" ' +
              (M.workshop === id ? "selected" : "") +
              ">" +
              esc(name) +
              "</option>",
          )
          .join("") +
        '</select><div class="m-chips">' +
        [
          "all",
          "new",
          "in_progress",
          "awaiting_confirmation",
          "awaiting_pgd",
          "rework",
          "completed",
        ]
          .map(
            (status) =>
              '<button data-mobile-action="filterStatus" data-id="' +
              status +
              '" class="' +
              (M.status === status ? "active" : "") +
              '">' +
              esc(status === "all" ? "Tất cả" : STATUS[status]) +
              "</button>",
          )
          .join("") +
        '</div></div><div id="mobileTicketGroups"></div>';
      const rows = filteredTickets(),
        groups = new Map();
      rows.forEach((r) => {
        if (!groups.has(r.workshopId))
          groups.set(r.workshopId, { name: r.workshopName, rows: [] });
        groups.get(r.workshopId).rows.push(r);
      });
      $("mobileTicketGroups").innerHTML = rows.length
        ? Array.from(groups.values())
            .map(
              (g) =>
                '<h2 class="m-group-title">' +
                esc(g.name) +
                "<span>" +
                g.rows.length +
                " phiếu</span></h2>" +
                g.rows.map(ticketCard).join(""),
            )
            .join("")
        : empty(
            "Không có phiếu phù hợp",
            "Thử đổi bộ lọc hoặc tải lại dữ liệu.",
          );
      $("mobileWorkshopFilter").onchange = (e) => {
        M.workshop = e.target.value;
        tickets();
      };
      $("mobileSearch").oninput = (e) => {
        const pos = e.target.selectionStart;
        M.query = e.target.value;
        tickets();
        $("mobileSearch").focus();
        $("mobileSearch").setSelectionRange(pos, pos);
      };
    }
    function pending() {
      const rows = pendingMine();
      $("mobileContent").innerHTML =
        '<h1 class="m-title">' +
        (managerMode()
          ? "Phê duyệt PGĐ"
          : M.data.capabilities.shiftLeader
            ? "Chờ trưởng ca xác nhận"
            : "Theo dõi phê duyệt") +
        '</h1><p class="m-subtitle">' +
        (managerMode()
          ? "Chất lượng và Sản xuất ký song song, không cần chờ nhau."
          : "Kết quả được trưởng ca xác nhận trước khi chuyển đồng thời tới hai PGĐ.") +
        "</p>" +
        (rows.length
          ? rows.map(ticketCard).join("")
          : empty(
              "Chưa có kết quả chờ xác nhận",
              "Khi kỹ thuật báo cáo xong, phiếu sẽ xuất hiện tại đây.",
            ));
    }
    function results() {
      if (managerMode()) {
        const reviews = M.data.reviews
          .filter(
            (v) =>

        "Ảnh được lưu riêng tư trên Google Drive.";
      reportPhotos();
      $("mobileReportDialog").showModal();
    }
    function reportPhotos() {
      const photos = parse(M.reportDraft?.photos);
      $("mobileReportPhotos").innerHTML =
        photos
          .map(
            (p, i) =>
              '<div class="m-photo-tile"><button type="button" data-mobile-action="photo" data-report="' +
              esc(M.reportDraft.id) +
              '" data-id="' +
              esc(p.id) +
              '">▧ Ảnh ' +
              (i + 1) +
              "<small>Đã lưu trên phiếu</small></button></div>",
          )
          .join("") +
        M.pending
          .map(
            (p) =>
              '<div class="m-photo-tile"><img src="' +
              esc(p.preview) +
              '" alt="Ảnh đã chọn"><button type="button" class="m-remove-photo" data-mobile-action="removePhoto" data-id="' +
              p.key +
              '" aria-label="Bỏ ảnh">✕</button></div>',
          )
          .join("");
    }
    function addFiles(files) {
      if (!M.reportDraft) return;
      const max = 12 - parse(M.reportDraft.photos).length - M.pending.length;
      if (files.length > max) {
        toast("Mỗi báo cáo tối đa 12 ảnh.");
        return;
      }
      for (const file of files) {
        if (!file.type.startsWith("image/") || file.size > 25 * 1024 * 1024) {
          toast("Chỉ chọn ảnh tối đa 25 MB trước khi thu nhỏ.");
          continue;
        }
        M.pending.push({
          file,
          key: uid(),
          preview: URL.createObjectURL(file),
        });
      }
      reportPhotos();
    }
    async function jpeg(file) {
      const url = URL.createObjectURL(file);
      try {
        const image = new Image();
        image.src = url;
        await image.decode();
        const ratio = Math.min(1, 1600 / Math.max(image.width, image.height)),
          canvas = document.createElement("canvas");
        canvas.width = Math.max(1, Math.round(image.width * ratio));
        canvas.height = Math.max(1, Math.round(image.height * ratio));
        canvas
          .getContext("2d")
          .drawImage(image, 0, 0, canvas.width, canvas.height);
        const data = canvas.toDataURL("image/jpeg", 0.8);
        if (data.length > 4200000)
          throw Error("Ảnh sau thu nhỏ vẫn quá lớn. Vui lòng chọn ảnh khác.");
        return data;
      } finally {
        URL.revokeObjectURL(url);
      }
    }
    async function saveReport(submit) {
      if (M.busy || !M.reportDraft) return;
      M.busy = true;
      $("mobileReportFields").disabled = true;
      $("mobileReportError").textContent = "";
      cacheReportText();
      const body = {
        actualResults: Array.from(
          $("mobileReportChecklist").querySelectorAll("[data-actual-result]"),
        ).map((i) => i.value),
        content: $("mobileReportText").value,
        noiDungCaiTien: $("mobileReportImprovement").value,
        yKienDongGop: $("mobileReportFeedback").value,
        performedDate: $("mobilePerformedDate").value,
        checks: Array.from(
          $("mobileReportChecklist").querySelectorAll('input[type="checkbox"]'),
        ).map((i) => i.checked),
      };
      try {
        if (submit && !body.content.trim())
          throw Error("Vui lòng nhập nội dung báo cáo.");
        let n = 0,
          total = M.pending.length;
        while (M.pending.length) {
          const file = M.pending[0];
          $("mobileReportProgress").textContent =
            "Đang lưu ảnh " + ++n + "/" + total + "…";
          const uploaded = await api("uploadPhoto", {
            reportId: M.reportDraft.id,
            revision: M.reportDraft.revision,
            uploadKey: file.key,
            name: file.file.name,
            dataUrl: await jpeg(file.file),
          });
          M.reportDraft = uploaded.report;
          URL.revokeObjectURL(file.preview);
          M.pending.shift();
          reportPhotos();
        }
        M.reportDraft = await api(submit ? "submitReport" : "saveDraft", {
          ...body,
          reportId: M.reportDraft.id,
          revision: M.reportDraft.revision,
          submitKey: M.submitKey,
        });
        if (submit) {
          sessionStorage.removeItem(draftCacheKey());
          sessionStorage.removeItem("mobileWorkSubmit:" + M.reportDraft.id);
          $("mobileReportDialog").close();
          M.reportDraft = null;
          M.page = "detail";
          await load();
          toast("Đã gửi kết quả cho người yêu cầu xác nhận.");
        } else {
          $("mobileReportProgress").textContent =
            "Đã lưu bản nháp và các ảnh đã chọn.";
          toast("Đã lưu nháp.");
        }
      } catch (e) {
        $("mobileReportError").textContent = e.message;
      } finally {
        M.busy = false;
        $("mobileReportFields").disabled = false;
      }
    }
    function closeReport() {
      if (M.busy) return;
      if (
        M.pending.length &&
        !confirm("Ảnh chưa được lưu. Bạn muốn đóng báo cáo?")
      )
        return;
      cacheReportText();
      clearPending();
      $("mobileReportDialog").close();
      M.reportDraft = null;
    }
    function openReview(id) {
      const r = request(id),
        d = M.data.reports.find((d) => d.id === r?.lastReportId);
      if (!r || !d) return;
      M.review = {
        request: r,
        report: d,
        kind: canApprove(r) ? "pgd" : "shift",
      };
      if (M.review.kind === "pgd" ? !canApprove(r) : !canConfirm(r)) return;
      $("mobileReviewStage").textContent =
        M.review.kind === "pgd"
          ? roleName(M.data.user.position) + " PHÊ DUYỆT"
          : "TRƯỞNG CA XÁC NHẬN";
      $("mobileReviewTitle").textContent =
        M.review.kind === "pgd"
          ? "Phê duyệt kết quả khắc phục"
          : "Kết quả đã đạt chưa?";
      $("mobileReviewAcceptHint").textContent =
        M.review.kind === "pgd"
          ? "Hoàn thành sau khi cả Chất lượng và Sản xuất đồng ý."
          : "Gửi đồng thời cho PGĐ Chất lượng và PGĐ Sản xuất.";
      M.reviewKey = uid();
      $("mobileReviewInfo").innerHTML =
        '<div class="m-performer"><small>NGƯỜI THỰC HIỆN</small><b>' +
        esc(d.actualByName) +
        "</b>" +
        esc(roleName(d.actualRole)) +
        " · " +
        date(d.performedDate) +
        '</div><p class="m-detail-description">' +
        esc(d.content) +
        "</p>" +
        reportNotes(d) +
        attachmentButtons(d);
      $("mobileReviewForm").elements.decision.value = "accept";
      $("mobileReviewReason").value = "";
      $("mobileReviewReason").required = false;
      $("mobileReviewError").textContent = "";
      $("mobileReviewDialog").showModal();
    }
    async function submitReview(e) {
      e.preventDefault();
      if (M.busy || !M.review) return;
      M.busy = true;
      $("mobileReviewFields").disabled = true;
      $("mobileReviewError").textContent = "";
      try {
        const r = M.review.request,
          result = await api(M.review.kind === "pgd" ? "approve" : "review", {
            requestId: r.id,
            reportId: M.review.report.id,
            revision: r.revision,
            decision: $("mobileReviewForm").elements.decision.value,
            reason: $("mobileReviewReason").value,
            reviewKey: M.reviewKey,
          });
        $("mobileReviewDialog").close();
        M.review = null;
        M.page = "detail";
        await load();
        const fresh = request(r.id);
        toast(
          result.decision.endsWith("reject")
            ? "Đã chuyển lại kỹ thuật để khắc phục."
            : fresh?.status === "completed"
              ? "Đủ hai phê duyệt PGĐ — phiếu hoàn thành."
              : "Đã ghi nhận. Phiếu đang chờ các phê duyệt còn lại.",
        );
      } catch (e) {
        $("mobileReviewError").textContent = e.message;
      } finally {
        M.busy = false;
        $("mobileReviewFields").disabled = false;
      }
    }
    function rememberCreate() {
      if (M.page === "create" && $("mobileCreateForm"))
        M.createDraft = Object.fromEntries(new FormData($("mobileCreateForm")));
    }
    function go(page) {
      rememberCreate();
      M.page = page;
      M.status = "all";
      M.query = "";
      M.workshop = "all";
      render();
      window.scrollTo(0, 0);
    }
    async function action(name, id, target) {
      if (name === "page") {
        go(id);
        return;
      }
      if (name === "open") {
        M.requestId = id;
        M.page = "detail";
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (name === "status") {
        M.page = "tickets";
        M.status = id;
        render();
        window.scrollTo(0, 0);
        return;
      }
      if (name === "filterStatus") {
        M.status = id;
        tickets();
        return;
      }
      if (name === "claim") {
        const r = request(id);
        await api("claim", { requestId: id, revision: r.revision });
        await load();
        toast("Bạn đã nhận xử lý phiếu.");
        return;
      }
      if (name === "report") {
        await openReport(id);
        return;
      }
      if (name === "review") {
        openReview(id);
        return;
      }
      if (name === "camera") {
        $("mobileCameraInput").click();
        return;
      }
      if (name === "gallery") {
        $("mobileGalleryInput").click();
        return;
      }
      if (name === "removePhoto") {
        const index = M.pending.findIndex((p) => p.key === id);
        if (index >= 0) {
          URL.revokeObjectURL(M.pending[index].preview);
          M.pending.splice(index, 1);
          reportPhotos();
        }
        return;
      }
      if (name === "closeReport") {
        closeReport();
        return;
      }
      if (name === "closeReview") {
        if (!M.busy) $("mobileReviewDialog").close();
        return;
      }
      if (name === "photo") {
        toast("Đang tải ảnh…");
        const p = await api("photo", { id, reportId: target.dataset.report });
        $("mobileFullPhoto").src = p.dataUrl;
        $("mobilePhotoDialog").showModal();
        return;
      }
      if (name === "closePhoto") {
        $("mobilePhotoDialog").close();
        $("mobileFullPhoto").removeAttribute("src");
        return;
      }
      if (name === "notice") {
        const n = M.data.notifications.find((n) => n.id === id);
        if (!n) return;
        await api("markRead", { id });
        M.page = "detail";
        M.requestId = n.requestId;
        await load();
        return;
      }
      if (name === "mode") {
        M.mode = id;
        sessionStorage.setItem("mobileAdminMode", id);
        go("home");
        return;
      }
      if (name === "logout") {
        try {
          await rpc("logoutEquipment", M.token);
        } finally {
          showLogin();
        }
        return;
      }
    }
    function showLogin() {
      clearPending();
      M.data = null;
      M.token = "";
      M.loading = false;
      M.reportDraft = null;
      M.review = null;
      M.createDraft = {};
      M.createKey = uid();
      M.page = "home";
      M.requestId = "";
      M.status = "all";
      M.workshop = "all";
      M.query = "";
      for (const id of [
        "mobileReportDialog",
        "mobileReviewDialog",
        "mobilePhotoDialog",
      ])
        $(id).close();
      M.nextSnapshot = null;
      sessionStorage.removeItem("dmgMobileWorkSession");
      for (let i = sessionStorage.length - 1; i >= 0; i--) {
        const key = sessionStorage.key(i);
        if (
          key.startsWith("mobileWorkDraft:") ||
          key.startsWith("mobileWorkSubmit:")
        )
          sessionStorage.removeItem(key);
      }
      $("mobileApp").hidden = true;
      $("mobileLogin").hidden = false;
    }
    document.addEventListener("click", (e) => {
      const target = e.target.closest("[data-mobile-action]");
      if (!target) return;
      target.disabled = true;
      Promise.resolve(
        action(target.dataset.mobileAction, target.dataset.id, target),
      )
        .catch((e) => {
          error(e);
          toast(e.message);
        })
        .finally(() => (target.disabled = false));
    });
    $("mobileLoginForm").onsubmit = async (e) => {
      e.preventDefault();
      $("mobileLoginButton").disabled = true;
      $("mobileLoginError").textContent = "";
      try {
        const r = await rpc(
          "loginEquipment",
          $("mobileUsername").value,
          $("mobilePassword").value,
        );
        M.token = r.token;
        M.nextSnapshot = r.snapshot
          ? { token: r.token, data: r.snapshot }
          : null;
        sessionStorage.setItem("dmgMobileWorkSession", M.token);
        $("mobilePassword").value = "";
        await load();
      } catch (e) {
        showLogin();
        $("mobileLoginError").textContent = e.message;
      } finally {
        $("mobileLoginButton").disabled = false;
      }
    };
    $("mobilePasswordToggle").onclick = () => {
      const input = $("mobilePassword");
      input.type = input.type === "password" ? "text" : "password";
      $("mobilePasswordToggle").textContent =
        input.type === "password" ? "Hiện" : "Ẩn";
    };
    $("mobileRefresh").onclick = () => {
      if (!M.busy) load().catch(error);
    };
    $("mobileBrand").onclick = (e) => {
      e.preventDefault();
      go("home");
    };
    $("mobileAvatar").onclick = () => go("account");
    $("mobileReportForm").onsubmit = (e) => {
      e.preventDefault();
      saveReport(true);
    };
    $("mobileSaveDraft").onclick = () => saveReport(false);
    $("mobileReportText").oninput = cacheReportText;
    $("mobilePerformedDate").onchange = cacheReportText;
    for (const id of ["mobileCameraInput", "mobileGalleryInput"])
      $(id).onchange = (e) => {
        addFiles(Array.from(e.target.files || []));
        e.target.value = "";
      };
    $("mobileReviewForm").onchange = () => {
      $("mobileReviewReason").required =
        $("mobileReviewForm").elements.decision.value === "reject";
    };
    $("mobileReviewForm").onsubmit = submitReview;
    $("mobileReportDialog").addEventListener("cancel", (e) => {
      e.preventDefault();
      closeReport();
    });
    $("mobileReviewDialog").addEventListener("cancel", (e) => {
      if (M.busy) e.preventDefault();
    });
    window.addEventListener("offline", () =>
      error(
        Error(
          "Đang mất kết nối. Kết nối mạng trước khi gửi phiếu hoặc kết quả.",
        ),
      ),
    );
    setInterval(() => {
      if (
        M.data &&
        !M.busy &&
        !M.loading &&
        !document.hidden &&
        !["create"].includes(M.page) &&
        !$("mobileReportDialog").open &&
        !$("mobileReviewDialog").open
      ) {
        const y = window.scrollY;
        load(true)
          .then(() => window.scrollTo(0, y))
          .catch(() => {});
      }
    }, 60000);
    if (M.token)
      load().catch((e) => {
        showLogin();
        $("mobileLoginError").textContent = e.message;
      });
    return {
      state: M,
      render,
      load,
      go,
      openReport,
      openReview,
      action,
      create,
      detail,
      api,
    };
  })();
</script>
