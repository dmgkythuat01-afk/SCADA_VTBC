<style>
#currentStockEditDialog{width:min(460px,calc(100vw - 32px));box-sizing:border-box;border:0;border-radius:18px;padding:24px;color:#18352d;box-shadow:0 20px 70px #142c3440}#currentStockEditDialog::backdrop{background:#122b3870}#currentStockEditDialog h2{margin:0 0 14px;font-size:21px}#currentStockEditDialog p{line-height:1.6;margin:7px 0;overflow-wrap:anywhere}#currentStockEditDialog input{width:100%;min-width:0;box-sizing:border-box;padding:12px;font-size:18px;margin:7px 0 12px}#currentStockEditDialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:14px}
</style>
<dialog id="currentStockEditDialog"><form id="currentStockEditForm">
  <h2>Sửa khối lượng tồn kho</h2><p id="currentStockEditName"></p><p id="currentStockEditInfo" class="sub-text"></p>
  <label for="currentStockEditQuantity">Khối lượng mới <span id="currentStockEditUnit"></span></label>
  <input id="currentStockEditQuantity" type="number" min="0" step="any" required inputmode="decimal">
  <div id="currentStockEditMessage" role="status"></div><div class="actions"><button type="button" class="btn btn-light" id="currentStockEditCancel">Hủy</button><button type="submit" class="btn btn-success" id="currentStockEditSave">Lưu</button></div>
</form></dialog>
<script>
const CurrentStockEdit=(()=>{
 const el=id=>document.getElementById(id);let draft=null,busy=false;
 function open(id){if(busy)return;const item=stockItems.find(row=>String(row.Id)===String(id));if(!item)return;draft={Id:item.Id,expectedQuantity:Number(item.khoiLuongNhap),token:sessionToken};el('currentStockEditName').textContent=item.tenNguyenLieu;el('currentStockEditInfo').textContent='Mã kho: '+item.Id+' · Lô: '+(item.LotNo||'—')+' · Hiện tại: '+formatNumber(item.khoiLuongNhap)+' '+(item.donVi||'');el('currentStockEditUnit').textContent=item.donVi?'('+item.donVi+')':'';el('currentStockEditQuantity').value=item.khoiLuongNhap;showMessage('currentStockEditMessage','','');el('currentStockEditDialog').showModal();el('currentStockEditQuantity').focus();el('currentStockEditQuantity').select();}
 function pending(value){busy=value;el('currentStockEditSave').disabled=value;el('currentStockEditCancel').disabled=value;el('currentStockEditQuantity').disabled=value;el('currentStockEditSave').textContent=value?'Đang lưu…':'Lưu';}
 el('currentStockEditCancel').onclick=()=>{if(!busy)el('currentStockEditDialog').close();};el('currentStockEditDialog').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
 el('currentStockEditForm').addEventListener('submit',event=>{event.preventDefault();if(busy||!draft)return;if(draft.token!==sessionToken){el('currentStockEditDialog').close();return;}const value=el('currentStockEditQuantity').value,quantity=Number(value);if(value.trim()===''||!Number.isFinite(quantity)||quantity<0){showMessage('currentStockEditMessage','error','Vui lòng nhập khối lượng hợp lệ từ 0 trở lên.');return;}const request={...draft};pending(true);const fail=error=>{pending(false);if(request.token!==sessionToken){el('currentStockEditDialog').close();return;}showMessage('currentStockEditMessage','error',error.message||'Không lưu được khối lượng.');};
 google.script.run.withSuccessHandler(result=>{if(!result?.success){fail({message:'Không lưu được khối lượng.'});return;}pending(false);if(request.token!==sessionToken){el('currentStockEditDialog').close();return;}const selectedManualId=document.getElementById("manualExportIdKho")?.value;const item=stockItems.find(row=>row.Id===result.Id);if(item)item.khoiLuongNhap=result.quantity;if(Number(result.quantity)===0)stockItems=stockItems.filter(row=>row.Id!==result.Id);renderStockTable();renderManualExportMaDatalist();renderManualExportIdOptions();if(selectedManualId===result.Id){if(Number(result.quantity)>0)document.getElementById("manualExportKhoiLuongNhap").value=formatNumber(result.quantity);else clearManualExportSelectedInfoOnly();}if(currentStockQrId===result.Id)renderStockQr(Number(result.quantity)>0&&item?buildQrData(item.Id,item):null);el('currentStockEditDialog').close();showMessage('stockActionMessage','success',result.message||'Đã cập nhật khối lượng.');}).withFailureHandler(fail).updateCurrentStockQuantity(request.token,{Id:request.Id,quantity,expectedQuantity:request.expectedQuantity});
 });return {open};
})();
</script>
