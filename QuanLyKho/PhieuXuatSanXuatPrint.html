<style>
  #autoProductionSlipCard { margin-top: 18px; }
  #autoProductionSlipCard[hidden] { display: none; }
  .auto-slip-controls { display: flex; gap: 14px; align-items: end; flex-wrap: wrap; margin-bottom: 14px; }
  .auto-slip-controls .field { flex: 1 1 240px; }
  #autoProductionSlipPreview { overflow: auto; border: 1px solid #d1d5db; background: #eee; padding: 16px; }
  #autoProductionSlipPreview .warehouse-slip { min-width: 1040px; padding: 20px; background: white; }
  #autoProductionSlipWarning { color: #92400e; margin-bottom: 12px; }
</style>
<div id="autoProductionSlipCard" class="card" hidden>
  <div class="card-title"><div><h2>Phiếu xuất kho</h2><p>Kiểm tra mẫu trước khi in. Các mục trống có thể điền tay sau khi in.</p></div></div>
  <div class="auto-slip-controls">
    <button class="btn btn-primary" onclick="AutoProductionSlip.print()">In / Xuất PDF</button>
    <button class="btn btn-success" onclick="AutoProductionSlip.word()">Xuất Word</button>
  </div>
  <div id="autoProductionSlipWarning" role="status"></div>
  <div id="autoProductionSlipPreview" oninput="AutoProductionSlip.edit(event)"></div>
</div>
<script>
const AutoProductionSlip = (function() {
  const el = id => document.getElementById(id);
  let selected = '', rows = [], recipient = '', warning = '';
  const editor = WarehouseSlipForm.createEditor();
  const esc = value => String(value ?? '').replace(/[&<>"']/g, char => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[char]));
  const styles = WarehouseSlipForm.styles + WarehouseSlipForm.editorStyles;
  // Ngày theo từng vị trí lô; không sao chép ngày của lô đầu sang các lô còn lại.
  function dateText(value) {
    const text = String(value ?? '').trim();
    const match = text.match(/^(\d{4})-(\d{2})-(\d{2})/);
    return match ? match[3] + '/' + match[2] + '/' + match[1] : text;
  }
  function list(value) { return String(value ?? '').split(/\s*,\s*|\r?\n/).map(part => part.trim()); }
  function lotGroup(row, rowIndex, printing) {
    const meta = row._slip || {};
    const lots = list(meta.lots);
    const manufactured = list(meta.manufactured), expires = list(meta.expires);
    const count = Math.max(lots.length, manufactured.length, expires.length);
    return Array.from({length:count}, (_, index) => {
      const label = count > 1 ? 'Lot ' + (index + 1) + ': ' : '';
      const values = [lots[index], dateText(manufactured[index]), dateText(expires[index])];
      return '<div class="slip-lot-row">' + values.map((value,column) => '<div>' + label + (value ? esc(value) : editor.field('row'+rowIndex+'lot'+index+'field'+column,'','…',printing)) + '</div>').join('') + '</div>';
    }).join('');
  }
  function quantity(value) {
    if (typeof value === 'number' && Number.isFinite(value)) return value.toLocaleString('vi-VN', {maximumFractionDigits:10});
    return String(value ?? '');
  }
  function printRows() {
    return rows.flatMap((row,sourceIndex) => {
      const meta = row._slip || {}, lots = list(meta.lots), amounts = meta.lotQuantities;
      if (!Array.isArray(amounts) || amounts.length !== lots.length || !amounts.length || amounts.some(q => !Number.isFinite(q) || q < 0) || Math.abs(amounts.reduce((sum,q) => sum+q,0)-Number(row['S\u1ed1 l\u01b0\u1ee3ng'])) > 0.000001 * Math.max(1,lots.length)) return [{row:row,key:String(sourceIndex)}];
      if (lots.length === 1) return [{row:row,key:String(sourceIndex)}];
      const manufactured = list(meta.manufactured), expires = list(meta.expires);
      return lots.map((lot,index) => ({key:sourceIndex+'lot'+index, row:{...row, 'S\u1ed1 l\u01b0\u1ee3ng':amounts[index], _slip:{...meta, lots:lot, manufactured:manufactured[index] || '', expires:expires[index] || ''}}}));
    });
  }
  function markup(printing) {
    const field = (key, initial='', placeholder='……………………') => editor.field(key,initial,placeholder,printing);
    const auto = (value,key) => String(value ?? '').trim() ? esc(value) : field(key,'','');
    const reasons = [...new Set(rows.map(row => String((row._slip || {}).recipe || '').trim()).filter(Boolean))].join('; ');
    const approvalDate = [...new Set(rows.map(row => {
      const value = dateText((row._slip || {}).approvalDate || row.thoiGianDuyet || row['Thời gian duyệt']).split(' ')[0];
      const match = value.match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);
      return match ? 'Ngày '+match[1].padStart(2,'0')+' tháng '+match[2].padStart(2,'0')+' năm '+match[3] : value;
    }).filter(Boolean))].join('; ');
    const body = printRows().map((entry,index) => {
      const row = entry.row, rowKey = entry.key;
      const amount = quantity(row['Số lượng']);
      return '<tr class="slip-data"><td class="slip-center">' + (index+1) + '</td><td>' + auto(row['Tên nguyên vật liệu'],'name'+rowKey) + '</td><td class="slip-center">' + auto((row._slip || {}).accountingCode,'code'+rowKey) + '</td><td class="slip-center">' + auto(row['Đvt'],'unit'+rowKey) + '</td><td class="slip-number-cell">' + auto(amount,'actual'+rowKey) + '</td><td class="slip-number-cell">' + auto(amount,'requested'+rowKey) + '</td><td colspan="3" class="slip-lot-group">' + lotGroup(row,rowKey,printing) + '</td><td>' + field('warehouseRow'+rowKey,'','') + '</td></tr>';
    }).join('');
    const signatures = ['Người lập phiếu','Người nhận hàng','Thủ kho','Kế toán trưởng','Ban Giám đốc'].map((title,index) => '<div><strong>' + title + '</strong><em>(Ký, họ tên)</em><div>' + field('signature'+index,'','') + '</div></div>').join('');
    return `<section class="warehouse-slip">
      <div class="slip-top"><div><div class="slip-company">CÔNG TY TNHH ĐỨC MINH ĐỒNG NAI</div><div class="slip-company-address">Đường D4-1, Khu Công nghiệp Long Đức, Xã Bình An, TP Đồng Nai, Việt Nam</div></div>
      <div class="slip-document">Mã số: BM-QT.KHO-01.05<br>Ngày ban hành/Sửa đổi: 01/01/2026<br>Lần ban hành/Sửa đổi: 02<br>Người ban hành: Nguyễn Thị Kim Chung</div></div>
      <h1>PHIẾU XUẤT KHO</h1><div class="slip-date">${esc(approvalDate || 'Ngày……tháng……năm………')}</div><div class="slip-number">Số: ${field('number')}</div>
      <div class="slip-info"><div class="slip-info-row"><div>Họ tên người nhận hàng: ${field('recipient',recipient)}</div><div>Địa chỉ (bộ phận): ${field('address')}</div></div>
      <div>Theo KHSX số: ${esc(selected)}</div><div>Lý do xuất kho: ${reasons ? esc(reasons) : field('reason')}</div>
      <div class="slip-info-row"><div>Xuất tại kho (ngăn lô): ${field('warehouse')}</div><div>Địa điểm: ${field('location')}</div></div></div>
      <table><colgroup>${[3,25,9,5,7,7,12,10,10,12].map(width => '<col style="width:'+width+'%">').join('')}</colgroup><thead><tr>
        <th rowspan="2">Stt</th><th rowspan="2">Tên, nhãn hiệu, quy cách phẩm chất vật tư, dụng cụ sản phẩm, hàng hóa</th><th rowspan="2">Mã số</th><th rowspan="2">Đơn vị tính</th><th colspan="2">Số lượng</th><th rowspan="2">Lô</th><th rowspan="2">Ngày sản xuất</th><th rowspan="2">Ngày hết hạn</th><th rowspan="2">Tên kho thực tế</th>
      </tr><tr><th>Thực xuất</th><th>Yêu cầu</th></tr><tr class="slip-column-keys">${['A','B','C','D','1','2','3','4','5','6'].map(key=>'<td>'+key+'</td>').join('')}</tr></thead><tbody>${body}</tbody></table>
      <div class="slip-signatures">${signatures}</div>
    </section>`;
  }
  function refresh() {
    el('autoProductionSlipCard').hidden = !selected || !rows.length;
    el('autoProductionSlipWarning').textContent = warning;
    el('autoProductionSlipPreview').innerHTML = selected && rows.length ? '<style>' + styles + '</style>' + markup() : '';
  }
  function setData(plan, visibleRows, person, sourceWarning) {
    if (selected !== plan) editor.reset();
    selected = plan; rows = visibleRows || []; recipient = (person || {}).recipient || '';
    warning = sourceWarning || (person || {}).warning || (selected && !recipient ? 'Chưa tra được người nhận hàng; phiếu để dấu … để điền tay.' : '');
    if (selected && rows.some(row => !(row._slip || {}).accountingCode)) warning += (warning ? ' ' : '') + 'Có dòng chưa có mã kế toán; kiểm tra PhieuXuatNguyenLieu trước khi in.';
    const lotWarnings = [...new Set(rows.map(row => (row._slip || {}).lotAllocationWarning).filter(Boolean))];
    if (lotWarnings.length) warning += (warning ? ' ' : '') + lotWarnings.join(' ');
    refresh();
  }
  function print() {
    if (!selected || !rows.length) return;
    editor.read(el('autoProductionSlipPreview'));
    WarehouseSlipForm.openPrint('Phiếu xuất kho - '+selected,styles,markup(true),message => { el('autoProductionSlipWarning').textContent=message; });
  }
  function word() {
    if (!selected || !rows.length) return;
    editor.read(el('autoProductionSlipPreview'));
    WarehouseSlipWord.download('phieu-xuat-kho_'+selected+'.docx',markup(true));
  }
  return {setData:setData, refresh:refresh, print:print, word:word, edit:editor.capture};
})();
</script>
