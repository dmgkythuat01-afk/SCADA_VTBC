<style>
.material-catalog-controls{display:flex;flex-wrap:wrap;gap:10px;margin:14px 0}.material-catalog-controls .field{margin:0;min-width:150px;flex:1}.material-catalog-controls .material-search{flex:2;min-width:240px}.material-catalog-controls input,.material-catalog-controls select{width:100%;box-sizing:border-box;min-width:0}.material-catalog-table{overflow:auto;max-height:65vh;border:1px solid #dde5ec;border-radius:12px}.material-catalog-table table{width:max-content;min-width:100%;border-collapse:collapse}.material-catalog-table th,.material-catalog-table td{white-space:nowrap;padding:11px 13px;border-bottom:1px solid #e2e8ee;text-align:left}.material-catalog-table th{position:sticky;top:0;background:#eef3f9;z-index:1}.material-catalog-table .material-note{max-width:360px;overflow:hidden;text-overflow:ellipsis}.material-catalog-pages{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-top:14px}.material-catalog-actions{display:flex;gap:8px;flex-wrap:wrap}.material-catalog-table .btn{padding:7px 11px;font-size:13px}
#materialCatalogDialog{width:min(900px,calc(100vw - 28px));max-height:88vh;box-sizing:border-box;border:0;border-radius:18px;padding:24px;color:#1d3044;box-shadow:0 20px 70px #142c3440}#materialCatalogDialog::backdrop{background:#10263870}#materialCatalogDialog h2{margin:0 0 18px}#materialCatalogFields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}#materialCatalogFields .field{min-width:0;margin:0}#materialCatalogFields input,#materialCatalogFields select,#materialCatalogFields textarea{width:100%;min-width:0;box-sizing:border-box;padding:10px;font:inherit}#materialCatalogFields .material-full{grid-column:1/-1}#materialCatalogDialog .actions{display:flex;gap:10px;justify-content:flex-end;margin-top:18px}
@media(max-width:600px){#materialCatalogFields{grid-template-columns:minmax(0,1fr)}.material-catalog-controls .field,.material-catalog-controls .material-search{min-width:0;flex-basis:100%}#materialCatalogDialog{padding:18px}}
</style>
<div id="pageMaterialCatalog" class="feature-page"><div class="card">
  <div class="card-title"><div><h2>Danh mục nguyên liệu</h2><p>Quản lý dữ liệu sheet NguyenLieu.</p></div></div>
  <div class="material-catalog-actions"><button id="materialCatalogAdd" class="btn btn-success" disabled>+ Thêm nguyên liệu</button><button id="materialCatalogReload" class="btn btn-primary">Tải lại dữ liệu</button><button id="materialCatalogExcel" class="btn btn-success" disabled>Tải Excel</button></div>
  <div class="material-catalog-controls">
    <div class="field material-search"><label for="materialCatalogSearch">Tìm nguyên liệu</label><input id="materialCatalogSearch" placeholder="Tên, mã nguyên liệu, mã kế toán, nhà sản xuất, nhà cung cấp…"></div>
    <div class="field"><label for="materialCatalogType">Loại nguyên liệu</label><select id="materialCatalogType"><option value="">Tất cả</option></select></div>
    <div class="field"><label for="materialCatalogMaker">Nhà sản xuất</label><select id="materialCatalogMaker"><option value="">Tất cả</option></select></div>
    <div class="field"><label for="materialCatalogSupplier">Nhà cung cấp</label><select id="materialCatalogSupplier"><option value="">Tất cả</option></select></div>
    <div class="field"><label for="materialCatalogStatus">Trạng thái</label><select id="materialCatalogStatus"><option value="">Tất cả</option></select></div>
  </div>
  <button id="materialCatalogClear" class="btn btn-light">Bỏ lọc</button><div id="materialCatalogMessage" role="status"></div>
  <p id="materialCatalogCount" class="sub-text"></p><div id="materialCatalogTable" class="material-catalog-table"><div class="empty">Đang chờ tải danh mục.</div></div>
  <div class="material-catalog-pages"><button id="materialCatalogPrev" class="btn btn-light" disabled>← Trước</button><span id="materialCatalogPage"></span><button id="materialCatalogNext" class="btn btn-light" disabled>Sau →</button></div>
</div></div>
<dialog id="materialCatalogDialog"><form id="materialCatalogForm"><h2 id="materialCatalogTitle">Thêm nguyên liệu</h2><div id="materialCatalogFields"></div><div id="materialCatalogFormMessage" role="status"></div><div class="actions"><button id="materialCatalogCancel" type="button" class="btn btn-light">Hủy</button><button id="materialCatalogSave" type="submit" class="btn btn-success">Lưu</button></div></form></dialog>
<script>
const MaterialCatalog=(()=>{
  const el=id=>document.getElementById(id),esc=v=>escapeHtml(v),hidden=new Set(['nhaCungCap2','nhaCungCap3']),numeric=new Set(['tonAnToan','soNgayVeKhoMacDinh','heSoQuyDoiKho']);
  const filterFields=[['materialCatalogType','loaiNguyenLieu'],['materialCatalogMaker','nhaCungCap1'],['materialCatalogSupplier','nhaCungCapCap'],['materialCatalogStatus','trangThai']];
  let data=null,page=1,busy=false,loadedToken='',sequence=0,draft=null;
  const text=v=>String(v??''),searchKey=v=>text(v).normalize('NFD').replace(/\p{Diacritic}/gu,'').replace(/[đĐ]/g,'d').toLowerCase().trim();
  const columns=()=>data?data.headers.filter(k=>!hidden.has(k)):[];
  function filteredRows(){if(!data)return[];const query=searchKey(el('materialCatalogSearch').value);return data.rows.filter(row=>(!query||columns().some(k=>searchKey(row[k]).includes(query)))&&filterFields.every(([id,k])=>!el(id).value||text(row[k])===el(id).value));}
  function options(){filterFields.forEach(([id,k])=>{const selected=el(id).value,values=[...new Set(data.rows.map(r=>text(r[k])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));el(id).innerHTML='<option value="">Tất cả</option>'+values.map(v=>'<option value="'+esc(v)+'">'+esc(v)+'</option>').join('');el(id).value=values.includes(selected)?selected:'';});}
  function render(){const rows=filteredRows(),totalPages=Math.max(1,Math.ceil(rows.length/50));page=Math.max(1,Math.min(page,totalPages));el('materialCatalogCount').textContent=data?'Có '+rows.length+' / '+data.rows.length+' nguyên liệu · Mỗi trang 50 dòng':'';el('materialCatalogPage').textContent='Trang '+page+' / '+totalPages;el('materialCatalogPrev').disabled=busy||page===1;el('materialCatalogNext').disabled=busy||page===totalPages;el('materialCatalogExcel').disabled=busy||!rows.length;el('materialCatalogAdd').disabled=busy||!data;
    if(!data){el('materialCatalogTable').innerHTML='<div class="empty">Chưa có dữ liệu.</div>';return;}
    const keys=columns();el('materialCatalogTable').innerHTML='<table><thead><tr><th>Thao tác</th><th>STT</th>'+keys.map(k=>'<th>'+esc(data.labels[k]||k)+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.slice((page-1)*50,page*50).map((row,i)=>'<tr><td><button type="button" class="btn btn-light" data-material-edit="'+row._row+'" '+(busy?'disabled':'')+'>Sửa</button> <button type="button" class="btn btn-danger" data-material-delete="'+row._row+'" '+(busy?'disabled':'')+'>Xóa</button></td><td>'+((page-1)*50+i+1)+'</td>'+keys.map(k=>'<td class="material-note" title="'+esc(row[k])+'">'+esc(row[k])+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+(keys.length+2)+'">Không có nguyên liệu phù hợp.</td></tr>')+'</tbody></table>';
  }
  function pending(value){busy=value;el('materialCatalogReload').disabled=value;el('materialCatalogSave').disabled=value;el('materialCatalogCancel').disabled=value;el('materialCatalogSave').textContent=value?'Đang lưu…':'Lưu';render();}
  function accept(result,refreshLookup){data=result;loadedToken=sessionToken;options();render();if(refreshLookup&&Array.isArray(result.activeMaterials)){nguyenLieuList=result.activeMaterials;renderNguyenLieuDatalist();}}
  function load(){if(busy)return;const id=++sequence,token=sessionToken;pending(true);showMessage('materialCatalogMessage','info','Đang tải danh mục nguyên liệu…');google.script.run.withSuccessHandler(result=>{if(id!==sequence)return;pending(false);if(token!==sessionToken)return;if(!result?.success){showMessage('materialCatalogMessage','error','Không tải được danh mục.');return;}accept(result,false);showMessage('materialCatalogMessage','success','Đã tải '+result.rows.length+' nguyên liệu.');}).withFailureHandler(error=>{if(id!==sequence)return;pending(false);if(token===sessionToken)showMessage('materialCatalogMessage','error',error.message||'Không tải được dữ liệu.');}).getMaterialCatalog(token);}
  function open(){if(loadedToken!==sessionToken){data=null;page=1;load();}else render();}
  function edit(row){if(busy||!data)return;draft={row:row?row._row:null,version:row?row._version:'',token:sessionToken};el('materialCatalogTitle').textContent=row?'Sửa nguyên liệu':'Thêm nguyên liệu';el('materialCatalogFields').innerHTML=columns().map((key,index)=>{
    const value=row?text(row[key]):key==='trangThai'?'Sử dụng':'',required=['maNguyenLieu','tenNguyenLieu'].includes(key),label=esc(data.labels[key]||key)+(required?' *':'');let control;
    if(key==='ghiChu')control='<textarea name="'+esc(key)+'" rows="3">'+esc(value)+'</textarea>';
    else if(key==='trangThai'){const choices=[...new Set(['','Sử dụng','Không sử dụng',...data.rows.map(r=>text(r[key])),value])];control='<select name="'+esc(key)+'">'+choices.map(v=>'<option value="'+esc(v)+'" '+(v===value?'selected':'')+'>'+esc(v||'Chưa thiết lập')+'</option>').join('')+'</select>';}
    else{const choices=[...new Set(data.rows.map(r=>text(r[key])).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));control='<input name="'+esc(key)+'" value="'+esc(value)+'" '+(required?'required ':'')+(numeric.has(key)?'type="number" min="'+(key==='heSoQuyDoiKho'?'0.000000000001':'0')+'" step="'+(key==='soNgayVeKhoMacDinh'?'1':'any')+'"':'type="text" list="materialCatalogChoices'+index+'"')+'><datalist id="materialCatalogChoices'+index+'">'+(!numeric.has(key)?choices.map(v=>'<option value="'+esc(v)+'"></option>').join(''):'')+'</datalist>';}
    return '<div class="field '+(key==='ghiChu'?'material-full':'')+'"><label>'+label+'</label>'+control+'</div>';
  }).join('');showMessage('materialCatalogFormMessage','','');el('materialCatalogDialog').showModal();el('materialCatalogFields').querySelector('input')?.focus();}
  function save(event){event.preventDefault();if(busy||!draft)return;if(draft.token!==sessionToken){el('materialCatalogDialog').close();return;}const payload={row:draft.row,version:draft.version,values:Object.fromEntries(new FormData(el('materialCatalogForm')).entries())},token=draft.token;pending(true);google.script.run.withSuccessHandler(result=>{pending(false);if(token!==sessionToken){el('materialCatalogDialog').close();return;}if(!result?.success){showMessage('materialCatalogFormMessage','error','Không lưu được nguyên liệu.');return;}accept(result,true);el('materialCatalogDialog').close();showMessage('materialCatalogMessage','success','Đã lưu nguyên liệu.');}).withFailureHandler(error=>{pending(false);if(token===sessionToken)showMessage('materialCatalogFormMessage','error',error.message||'Không lưu được dữ liệu.');}).saveMaterialCatalog(token,payload);}
  function remove(row){if(busy||!row)return;if(!confirm('Xóa nguyên liệu '+row.tenNguyenLieu+' ('+row.maNguyenLieu+') khỏi danh mục? Dữ liệu kho và phiếu đã phát sinh được giữ nguyên.'))return;const token=sessionToken;pending(true);google.script.run.withSuccessHandler(result=>{pending(false);if(token!==sessionToken)return;if(!result?.success){showMessage('materialCatalogMessage','error','Không xóa được nguyên liệu.');return;}accept(result,true);showMessage('materialCatalogMessage','success','Đã xóa nguyên liệu khỏi danh mục.');}).withFailureHandler(error=>{pending(false);if(token===sessionToken)showMessage('materialCatalogMessage','error',error.message||'Không xóa được dữ liệu.');}).deleteMaterialCatalog(token,{row:row._row,version:row._version});}
  el('materialCatalogAdd').onclick=()=>edit(null);el('materialCatalogReload').onclick=load;el('materialCatalogForm').addEventListener('submit',save);el('materialCatalogCancel').onclick=()=>{if(!busy)el('materialCatalogDialog').close();};el('materialCatalogDialog').addEventListener('cancel',event=>{if(busy)event.preventDefault();});
  el('materialCatalogTable').addEventListener('click',event=>{const button=event.target.closest('[data-material-edit],[data-material-delete]');if(!button||busy)return;const row=data.rows.find(r=>r._row===Number(button.dataset.materialEdit||button.dataset.materialDelete));if(button.dataset.materialEdit)edit(row);else remove(row);});
  el('materialCatalogSearch').oninput=()=>{page=1;render();};filterFields.forEach(([id])=>el(id).onchange=()=>{page=1;render();});el('materialCatalogClear').onclick=()=>{el('materialCatalogSearch').value='';filterFields.forEach(([id])=>el(id).value='');page=1;render();};el('materialCatalogPrev').onclick=()=>{page--;render();};el('materialCatalogNext').onclick=()=>{page++;render();};
  el('materialCatalogExcel').onclick=()=>{if(!data)return;const keys=columns(),headers=keys.map(k=>data.labels[k]||k),rows=filteredRows().map(row=>Object.fromEntries(keys.map((k,i)=>[headers[i],row[k]])));exportRowsToExcel('danh-muc-nguyen-lieu.xls',headers,rows,'materialCatalogMessage');};
  return {open,load,render,filteredRows};
})();
</script>
