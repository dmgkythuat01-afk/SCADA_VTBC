<section id="masterViewKeToan" class="master-module hidden">
<style>
#masterViewKeToan{--g:#075d49;--g2:#0aa678;--line:#d7e6e0;--text:#2d403a;--muted:#6d817a}
#masterViewKeToan *{box-sizing:border-box}.kt-head{display:flex;justify-content:space-between;align-items:center;gap:16px;margin-bottom:18px}.kt-head h2{margin:0;color:var(--g);font-size:25px}.kt-head p{margin:5px 0 0;color:#667b73;font-size:14px}.kt-card{background:#fff;border:1px solid var(--line);border-radius:22px;overflow:hidden;box-shadow:0 10px 30px rgba(16,76,61,.08)}
.kt-toolbar{display:grid;grid-template-columns:105px 260px minmax(260px,1fr) 260px auto;gap:10px;align-items:center;padding:17px 20px}.kt-title{font-size:17px;font-weight:800;color:var(--g)}.kt-control{width:100%;height:45px;border:1px solid #d4e2dd;border-radius:13px;padding:0 14px;outline:none;background:#fff;font:inherit}.kt-control:focus,.kt-input:focus{border-color:#00866a;box-shadow:0 0 0 3px rgba(0,134,106,.08)}
.kt-btn{min-height:44px;border:0;border-radius:13px;padding:0 18px;font:inherit;font-weight:800;cursor:pointer;white-space:nowrap}.kt-primary{color:#fff;background:linear-gradient(135deg,#08785d,#0bb783);box-shadow:0 8px 20px rgba(0,134,106,.18)}.kt-light{background:#eff8f4;color:var(--g)}.kt-btn:disabled{opacity:.55;cursor:not-allowed}
.kt-table-wrap{max-height:calc(100vh - 285px);min-height:300px;overflow:auto;border-top:1px solid #e4ece9}.kt-table{width:100%;min-width:1250px;border-collapse:separate;border-spacing:0;font-size:13px}.kt-table th{position:sticky;top:0;z-index:2;padding:11px 10px;background:#075743;color:#fff;text-align:left;line-height:1.2}.kt-table td{padding:11px 10px;border-bottom:1px solid #e6eeeb;color:#31423d;vertical-align:middle;background:#fff}.kt-table tbody tr:hover td{background:#f8fcfa}.kt-actions{display:flex;gap:7px}.kt-action{border:0;border-radius:10px;padding:7px 11px;font:inherit;font-size:12px;font-weight:800;cursor:pointer}.kt-edit{background:#eaf7f2;color:#07674f}.kt-delete{background:#fdeaea;color:#bf2e2e}.kt-empty{text-align:center!important;padding:40px!important;color:#7c8c87!important}.kt-count{padding:11px 20px;border-top:1px solid #e5eeea;background:#fbfdfc;color:#71827c;font-size:12px}
.kt-modal-back{position:fixed;inset:0;z-index:10000;display:none;align-items:center;justify-content:center;padding:22px;background:rgba(24,36,45,.6);backdrop-filter:blur(2px)}.kt-modal-back.show{display:flex}.kt-modal{width:min(980px,96vw);max-height:94vh;display:flex;flex-direction:column;overflow:hidden;background:#fff;border-radius:22px;box-shadow:0 28px 90px rgba(0,0,0,.3)}.kt-modal-head{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:17px 22px;border-bottom:1px solid #dce7e3}.kt-modal-head h3{margin:0;font-size:23px;color:#18202f}.kt-modal-body{overflow:auto;padding:21px 22px 28px}.kt-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:20px 14px}.kt-field label{display:block;margin-bottom:7px;color:#35485d;font-size:13px;font-weight:800}.kt-required{color:#d43a3a}.kt-input{width:100%;min-height:47px;border:1px solid #d3e1dc;border-radius:13px;padding:10px 13px;outline:none;background:#fff;font:inherit}textarea.kt-input{min-height:82px;resize:vertical}.kt-modal-foot{display:flex;justify-content:flex-end;gap:10px;padding:16px 22px;border-top:1px solid #dce7e3;background:#f8fbfa}body.kt-modal-open{overflow:hidden}
@media(max-width:1100px){.kt-toolbar{grid-template-columns:1fr 1fr}.kt-title{grid-column:1/-1}}@media(max-width:760px){.kt-toolbar,.kt-grid{grid-template-columns:1fr}.kt-modal-back{padding:8px}.kt-modal{width:100%;max-height:97vh}}
</style>

<div class="kt-head"><div><h2>Sản phẩm</h2><p>Nhập, sửa, xóa dữ liệu đầu vào cho sheet SanPham.</p></div><button class="kt-btn kt-light" onclick="masterKT_reload()">↻ Tải lại</button></div>

<div class="kt-card">
  <div class="kt-toolbar">
    <div class="kt-title">Sản phẩm</div>
    <select id="ktFilterGroup" class="kt-control" onchange="masterKT_groupChanged()"><option value="">Tất cả nhóm sản phẩm</option></select>
    <select id="ktFilterProduct" class="kt-control" onchange="masterKT_render()"><option value="">Tất cả sản phẩm</option></select>
    <input id="ktSearch" class="kt-control" placeholder="Tìm kiếm dữ liệu..." oninput="masterKT_render()">
    <button class="kt-btn kt-primary" onclick="masterKT_openForm()">Thêm mới</button>
  </div>
  <div class="kt-table-wrap">
    <table class="kt-table">
      <thead><tr><th>Nhóm sản phẩm</th><th>Mã sản phẩm</th><th>Mã kế toán TP</th><th>Tên sản phẩm</th><th>Đơn vị SKU</th><th>Quy cách mặc định</th><th>Trạng thái</th><th>Ghi chú</th><th>Thao tác</th></tr></thead>
      <tbody id="ktTableBody"></tbody>
    </table>
  </div>
  <div id="ktCount" class="kt-count">0 sản phẩm</div>
</div>

<div id="ktModalBack" class="kt-modal-back" onclick="masterKT_backdropClick(event)">
  <div class="kt-modal">
    <div class="kt-modal-head"><h3 id="ktModalTitle">Thêm Sản phẩm</h3><button class="kt-btn kt-light" onclick="masterKT_closeForm()">Đóng</button></div>
    <div class="kt-modal-body"><div class="kt-grid">
      <div class="kt-field"><label>Nhóm sản phẩm</label><input id="kt_nhomSanPham" class="kt-input" list="ktGroupList" placeholder="Chọn nhóm hiện có hoặc nhập nhóm mới"><datalist id="ktGroupList"></datalist></div>
      <div class="kt-field"><label>Mã sản phẩm <span class="kt-required">*</span></label><input id="kt_maSanPham" class="kt-input"></div>
      <div class="kt-field"><label>Mã kế toán TP</label><input id="kt_MaKeToanTP" class="kt-input"></div>
      <div class="kt-field"><label>Tên sản phẩm <span class="kt-required">*</span></label><input id="kt_tenSanPham" class="kt-input"></div>
      <div class="kt-field"><label>Đơn vị SKU</label><input id="kt_donViSKU" class="kt-input" list="ktUnitList"><datalist id="ktUnitList"></datalist></div>
      <div class="kt-field"><label>Quy cách mặc định</label><input id="kt_quyCachMacDinh" class="kt-input"></div>
      <div class="kt-field"><label>Trạng thái</label><select id="kt_trangThai" class="kt-input"><option value="">Chọn trạng thái</option><option value="Đang dùng">Đang dùng</option><option value="Ngừng dùng">Ngừng dùng</option></select></div>
      <div class="kt-field"><label>Ghi chú</label><textarea id="kt_ghiChu" class="kt-input"></textarea></div>
    </div></div>
    <div class="kt-modal-foot"><button class="kt-btn kt-light" onclick="masterKT_closeForm()">Hủy</button><button id="ktSaveBtn" class="kt-btn kt-primary" onclick="masterKT_saveForm()">Lưu dữ liệu</button></div>
  </div>
</div>

<script>
const MASTER_KT_STATE={loaded:false,loading:false,rows:[],dropdowns:{nhomSanPham:[],donViSKU:[],trangThai:[]},editingRowNumber:0};
function masterKT_server(fn,...args){return new Promise((resolve,reject)=>google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](...args));}
function masterKT_escape(v){return String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#039;');}
async function masterKT_init(force=false){if(MASTER_KT_STATE.loading)return;if(MASTER_KT_STATE.loaded&&!force){masterKT_render();return}MASTER_KT_STATE.loading=true;try{const r=await masterKT_server('masterKT_getData');MASTER_KT_STATE.rows=r?.rows||[];MASTER_KT_STATE.dropdowns=r?.dropdowns||{};MASTER_KT_STATE.loaded=true;masterKT_renderFilters();masterKT_render()}catch(e){console.error(e);alert('Không tải được dữ liệu Sản phẩm:\n'+(e?.message||e))}finally{MASTER_KT_STATE.loading=false}}
async function masterKT_reload(){await masterKT_init(true)}
function masterKT_renderFilters(){const g=document.getElementById('ktFilterGroup'),p=document.getElementById('ktFilterProduct');const oldG=g?.value||'',oldP=p?.value||'';const groups=[...new Set(MASTER_KT_STATE.rows.map(r=>String(r.nhomSanPham||'').trim()).filter(Boolean))].sort((a,b)=>a.localeCompare(b,'vi'));if(g){g.innerHTML='<option value="">Tất cả nhóm sản phẩm</option>'+groups.map(v=>`<option value="${masterKT_escape(v)}">${masterKT_escape(v)}</option>`).join('');g.value=groups.includes(oldG)?oldG:''}masterKT_renderProductFilter(oldP)}
function masterKT_renderProductFilter(preferred=null){const p=document.getElementById('ktFilterProduct'),g=document.getElementById('ktFilterGroup')?.value||'';if(!p)return;const current=preferred!==null?preferred:p.value;const rows=MASTER_KT_STATE.rows.filter(r=>!g||String(r.nhomSanPham||'')===g).slice().sort((a,b)=>String(a.tenSanPham||'').localeCompare(String(b.tenSanPham||''),'vi'));p.innerHTML='<option value="">Tất cả sản phẩm</option>'+rows.map(r=>`<option value="${masterKT_escape(r.maSanPham)}">${masterKT_escape(r.tenSanPham||r.maSanPham)}</option>`).join('');if(rows.some(r=>String(r.maSanPham||'')===String(current||'')))p.value=current}
function masterKT_groupChanged(){masterKT_renderProductFilter('');masterKT_render()}
function masterKT_filtered(){const g=document.getElementById('ktFilterGroup')?.value||'',p=document.getElementById('ktFilterProduct')?.value||'',q=String(document.getElementById('ktSearch')?.value||'').trim().toLowerCase();return MASTER_KT_STATE.rows.filter(r=>{if(g&&String(r.nhomSanPham||'')!==g)return false;if(p&&String(r.maSanPham||'')!==p)return false;if(q&&!['nhomSanPham','maSanPham','MaKeToanTP','tenSanPham','donViSKU','quyCachMacDinh','trangThai','ghiChu'].map(k=>r[k]).join(' ').toLowerCase().includes(q))return false;return true})}
function masterKT_render(){const body=document.getElementById('ktTableBody'),count=document.getElementById('ktCount');if(!body)return;const rows=masterKT_filtered();body.innerHTML=rows.length?rows.map(r=>`<tr><td>${masterKT_escape(r.nhomSanPham)}</td><td>${masterKT_escape(r.maSanPham)}</td><td>${masterKT_escape(r.MaKeToanTP)}</td><td>${masterKT_escape(r.tenSanPham)}</td><td>${masterKT_escape(r.donViSKU)}</td><td>${masterKT_escape(r.quyCachMacDinh)}</td><td>${masterKT_escape(r.trangThai)}</td><td>${masterKT_escape(r.ghiChu)}</td><td><div class="kt-actions"><button class="kt-action kt-edit" onclick="masterKT_openForm(${Number(r.__rowNumber)})">Sửa</button><button class="kt-action kt-delete" onclick="masterKT_delete(${Number(r.__rowNumber)})">Xóa</button></div></td></tr>`).join(''):'<tr><td colspan="9" class="kt-empty">Không có dữ liệu phù hợp.</td></tr>';if(count)count.textContent=`Hiển thị ${rows.length} / ${MASTER_KT_STATE.rows.length} sản phẩm`}
function masterKT_fillLists(){const g=document.getElementById('ktGroupList'),u=document.getElementById('ktUnitList');if(g)g.innerHTML=(MASTER_KT_STATE.dropdowns.nhomSanPham||[]).map(v=>`<option value="${masterKT_escape(v)}"></option>`).join('');if(u)u.innerHTML=(MASTER_KT_STATE.dropdowns.donViSKU||[]).map(v=>`<option value="${masterKT_escape(v)}"></option>`).join('')}
function masterKT_set(id,v){const e=document.getElementById(id);if(e)e.value=v??''}
function masterKT_openForm(rowNumber=0){rowNumber=Number(rowNumber||0);const r=rowNumber?MASTER_KT_STATE.rows.find(x=>Number(x.__rowNumber)===rowNumber):null;if(rowNumber&&!r){alert('Không tìm thấy sản phẩm cần sửa.');return}MASTER_KT_STATE.editingRowNumber=rowNumber;masterKT_fillLists();document.getElementById('ktModalTitle').textContent=rowNumber?'Sửa Sản phẩm':'Thêm Sản phẩm';['nhomSanPham','maSanPham','MaKeToanTP','tenSanPham','donViSKU','quyCachMacDinh','trangThai','ghiChu'].forEach(k=>masterKT_set('kt_'+k,r?.[k]||''));document.getElementById('ktModalBack')?.classList.add('show');document.body.classList.add('kt-modal-open');setTimeout(()=>document.getElementById('kt_nhomSanPham')?.focus(),30)}
function masterKT_closeForm(){document.getElementById('ktModalBack')?.classList.remove('show');document.body.classList.remove('kt-modal-open');MASTER_KT_STATE.editingRowNumber=0}
function masterKT_backdropClick(e){if(e.target?.id==='ktModalBack')masterKT_closeForm()}
function masterKT_form(){const o={__rowNumber:MASTER_KT_STATE.editingRowNumber||''};['nhomSanPham','maSanPham','MaKeToanTP','tenSanPham','donViSKU','quyCachMacDinh','trangThai','ghiChu'].forEach(k=>o[k]=document.getElementById('kt_'+k)?.value.trim()||'');return o}
async function masterKT_saveForm(){const r=masterKT_form();if(!r.maSanPham){alert('Vui lòng nhập Mã sản phẩm.');document.getElementById('kt_maSanPham')?.focus();return}if(!r.tenSanPham){alert('Vui lòng nhập Tên sản phẩm.');document.getElementById('kt_tenSanPham')?.focus();return}const dup=MASTER_KT_STATE.rows.some(x=>String(x.maSanPham||'').trim().toUpperCase()===r.maSanPham.toUpperCase()&&Number(x.__rowNumber||0)!==Number(r.__rowNumber||0));if(dup){alert('Mã sản phẩm "'+r.maSanPham+'" đã tồn tại.');return}const b=document.getElementById('ktSaveBtn');if(b){b.disabled=true;b.textContent='Đang lưu...'}try{const result=await masterKT_server('masterKT_saveProduct',r);MASTER_KT_STATE.rows=result?.data?.rows||[];MASTER_KT_STATE.dropdowns=result?.data?.dropdowns||{};masterKT_closeForm();masterKT_renderFilters();masterKT_render();alert(result?.message||'Đã lưu dữ liệu.')}catch(e){console.error(e);alert('Có lỗi khi lưu sản phẩm:\n'+(e?.message||e))}finally{if(b){b.disabled=false;b.textContent='Lưu dữ liệu'}}}
async function masterKT_delete(rowNumber){rowNumber=Number(rowNumber||0);const r=MASTER_KT_STATE.rows.find(x=>Number(x.__rowNumber||0)===rowNumber);if(!r){alert('Không tìm thấy sản phẩm cần xóa.');return}if(!confirm('Bạn có chắc muốn xóa sản phẩm:\n\n'+(r.tenSanPham||r.maSanPham)+'\n\nMã: '+(r.maSanPham||'')+'?'))return;try{const result=await masterKT_server('masterKT_deleteProduct',rowNumber);MASTER_KT_STATE.rows=result?.data?.rows||[];MASTER_KT_STATE.dropdowns=result?.data?.dropdowns||{};masterKT_renderFilters();masterKT_render();alert(result?.message||'Đã xóa sản phẩm.')}catch(e){console.error(e);alert('Có lỗi khi xóa sản phẩm:\n'+(e?.message||e))}}
(function(){const s=document.getElementById('masterViewKeToan');if(!s)return;const ob=new MutationObserver(()=>{if(!s.classList.contains('hidden')&&!MASTER_KT_STATE.loaded&&!MASTER_KT_STATE.loading)masterKT_init(false)});ob.observe(s,{attributes:true,attributeFilter:['class']});if(!s.classList.contains('hidden'))masterKT_init(false)})();
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.getElementById('ktModalBack')?.classList.contains('show'))masterKT_closeForm()});
</script>
</section>
