<!doctype html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="referrer" content="no-referrer"><title>Camera xu&#7845;t kho</title>
<style>*{box-sizing:border-box}body{margin:0;background:#eef7f2;color:#153d30;font:17px system-ui,-apple-system,sans-serif;padding:20px 14px}main{max-width:540px;margin:auto;background:white;padding:22px 18px;border:1px solid #dce9e1;border-radius:24px}h1{font-size:24px;margin:0 0 8px}p{font-size:15px;line-height:1.6;color:#587263}.stage{background:#102c21;border-radius:18px;min-height:230px;overflow:hidden}video,img{display:block;width:100%;max-height:60dvh;object-fit:contain}[hidden]{display:none!important}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}button{flex:1;min-width:120px;min-height:52px;border:0;border-radius:13px;padding:12px;background:#087b63;color:white;font:700 16px system-ui;cursor:pointer}button.light{background:#e8f3ec;color:#285b43}button:disabled{opacity:.5}#status{min-height:24px;font-size:15px;line-height:1.5;margin-top:14px}</style></head>
<body><main><h1>Ch&#7909;p &#7843;nh xu&#7845;t kho</h1><p>Ch&#7909;p r&#245; nguy&#234;n li&#7879;u v&#224; nh&#227;n l&#244;. &#7842;nh s&#7869; tr&#7903; v&#7873; phi&#7871;u &#273;ang nh&#7853;p.</p><div class="stage"><video id="video" autoplay muted playsinline></video><img id="still" alt="?nh v?a ch?p" hidden></div><div id="status" role="status"></div><div class="actions"><button id="switch" class="light" onclick="flip()">&#272;&#7893;i camera</button><button id="shoot" onclick="capture()" disabled>Ch&#7909;p &#7843;nh</button><button id="retake" class="light" onclick="start()" hidden>Ch&#7909;p l&#7841;i</button><button id="use" onclick="sendPhoto()" hidden>D&#249;ng &#7843;nh n&#224;y</button><button class="light" onclick="cancel()">H&#7911;y</button></div></main>
<script>
const params=new URLSearchParams(location.hash.slice(1)),nonce=params.get('nonce')||'',parentOrigin=params.get('origin')||'';
const allowedParent=/^https:\/\/(?:[a-z0-9-]+\.)*googleusercontent\.com$/.test(parentOrigin)||parentOrigin==='https://script.google.com';
const el=id=>document.getElementById(id);let stream=null,image='',facing='environment',generation=0;
function stop(){if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;el('video').srcObject=null;}
function linked(){return window.opener&&allowedParent&&/^[a-f0-9]{32}$/.test(nonce);}
async function start(){
 stop();image='';const request=++generation;el('video').hidden=false;el('still').hidden=true;el('shoot').hidden=false;el('shoot').disabled=true;el('switch').hidden=false;el('retake').hidden=true;el('use').hidden=true;
 if(!linked()){el('status').textContent='H\u00e3y m\u1edf camera b\u1eb1ng n\u00fat Ch\u1ee5p \u1ea3nh trong trang xu\u1ea5t kho.';return;}
 try{if(window.self!==window.top)throw Error('H\u00e3y m\u1edf trang camera trong c\u1eeda s\u1ed5 ri\u00eang.');el('status').textContent='\u0110ang m\u1edf camera...';const media=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:facing},width:{ideal:1600},height:{ideal:1200}},audio:false});if(request!==generation){media.getTracks().forEach(t=>t.stop());return;}stream=media;el('video').srcObject=media;await el('video').play();el('shoot').disabled=false;el('status').textContent='\u0110\u01b0a nguy\u00ean li\u1ec7u v\u00e0o khung r\u1ed3i ch\u1ee5p \u1ea3nh.';}catch(error){stop();el('status').textContent='Kh\u00f4ng m\u1edf \u0111\u01b0\u1ee3c camera. H\u00e3y ki\u1ec3m tra quy\u1ec1n camera c\u1ee7a trang n\u00e0y. '+(error.message||'');}
}
function capture(){const v=el('video');if(!stream||!v.videoWidth)return;const canvas=document.createElement('canvas'),scale=Math.min(1,1280/Math.max(v.videoWidth,v.videoHeight));canvas.width=Math.round(v.videoWidth*scale);canvas.height=Math.round(v.videoHeight*scale);canvas.getContext('2d').drawImage(v,0,0,canvas.width,canvas.height);image=canvas.toDataURL('image/jpeg',.78);stop();el('still').src=image;el('still').hidden=false;v.hidden=true;el('shoot').hidden=true;el('switch').hidden=true;el('retake').hidden=false;el('use').hidden=false;el('status').textContent='Ki\u1ec3m tra \u1ea3nh tr\u01b0\u1edbc khi g\u1eedi v\u1ec1 phi\u1ebfu.';}
function sendPhoto(){if(!linked()||!image.startsWith('data:image/jpeg;base64,')||image.length>4200000)return;window.opener.postMessage({type:'worker-camera-photo',nonce:nonce,dataUrl:image},parentOrigin);image='';stop();el('status').textContent='\u0110\u00e3 g\u1eedi \u1ea3nh. B\u1ea1n c\u00f3 th\u1ec3 tr\u1edf l\u1ea1i trang phi\u1ebfu xu\u1ea5t.';window.close();}
function flip(){facing=facing==='environment'?'user':'environment';start();}
function cancel(){generation++;stop();image='';if(linked())window.opener.postMessage({type:'worker-camera-cancel',nonce:nonce},parentOrigin);window.close();}
window.addEventListener('pagehide',()=>{generation++;stop();});document.addEventListener('visibilitychange',()=>{if(document.hidden){generation++;stop();el('shoot').disabled=true;}else if(!image)start();});
start();
</script></body></html>
