<style>
#pageEpMangIn .plan-grid{grid-template-columns:minmax(0,1fr)}
.ep-box-picker{display:flex;align-items:flex-end;gap:12px;margin-top:16px}.ep-box-picker .field{flex:1;min-width:0;margin-bottom:0}.ep-box-picker select{width:100%;min-width:0}.ep-box-note{color:#647b80;font-size:13px;line-height:1.5}.ep-box-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}.ep-box-table th,.ep-box-table td{padding:11px 12px;border:1px solid #dbe7e2;text-align:left}.ep-box-table th{background:#edf6f1;color:#174d3d}.ep-box-table td.num{text-align:right}.ep-box-total{padding:12px 0;font-weight:700;color:#075c43}.ep-box-unavailable{color:#b42318}.ep-box-plan-id{font-size:12px;color:#647b80}.ep-box-details{margin:6px 0}.ep-box-details summary{cursor:pointer;color:#087153;font-weight:600}.ep-box-muted{color:#647b80}.ep-box-actions{display:flex;gap:8px}
@media(max-width:650px){.ep-box-picker{align-items:stretch;flex-direction:column}.ep-box-table{font-size:13px}.ep-box-picker .btn{width:100%}#pageEpMangIn .card{min-width:0}.ep-box-actions{flex-wrap:wrap}}
</style>
<script>
const EpMangInBoxes=(()=>{
  const el=id=>document.getElementById(id),esc=value=>escapeHtml(String(value??'')),num=value=>formatNumber(Number(value)||0);
  let boxes=[],draft=[],loadedToken='',pending=false,loadSequence=0,requestId='',editing=null;
  const newRequest=()=>{requestId=crypto.randomUUID();};
  const message=(type,text)=>showMessage('epMangInMessage',type,text);
  function busy(value){pending=value;['epMangInSaveBtn','epBoxAdd'].forEach(id=>{if(el(id))el(id).disabled=value;});}
  function products(){const select=el('epMangInTenSanPham');if(!select)return;const value=select.value;select.innerHTML='<option value="">-- Chọn sản phẩm --</option>'+(sanPhamLapViVTBCList||[]).slice().sort((a,b)=>String(a.tenSanPham).localeCompare(String(b.tenSanPham),'vi')).map(p=>`<option value="${esc(p.maSanPham)}">${esc(p.tenSanPham)}</option>`).join('');select.value=value;el('epMangInMaSanPham').value=select.value;renderPicker();renderDraft();}
  function available(box){return !box.giuChoKeHoach||box.giuChoKeHoach===editing?.IdEpMangIn;}
  function renderPicker(){const select=el('epBoxSelect');if(!select)return;const product=el('epMangInTenSanPham').value;
    const found=boxes.filter(b=>b.maSanPham===product&&available(b)&&!draft.includes(b.IdThungDungVi));
    select.innerHTML=`<option value="">${!product?'-- Chọn sản phẩm trước --':!loadedToken?'-- Tải dữ liệu để chọn thùng --':found.length?'-- Chọn thùng đựng vỉ --':'-- Không còn thùng khả dụng --'}</option>`+found.map(b=>`<option value="${esc(b.IdThungDungVi)}">${esc(b.IdThungDungVi)} · ${esc(num(b.soLuongViDaLap))} vỉ · NSX ${esc(b.ngaySanXuat||'—')} · Kho ${esc(b.vitriKho||b.viTriKho||'—')}</option>`).join('');
  }
  function boxRows(items,removable){return `<div class="table-wrap"><table class="ep-box-table"><thead><tr><th>STT</th><th>Thùng đựng vỉ</th><th>Ngày sản xuất</th><th>Vị trí kho</th><th>${removable?'Vỉ còn tồn':'Vỉ khi chọn'}</th>${removable?'<th>Thao tác</th>':''}</tr></thead><tbody>`+items.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.IdThungDungVi)}</td><td>${esc(b.ngaySanXuat||'—')}</td><td>${esc(b.vitriKho||b.viTriKho||'—')}</td><td class="num">${b.unavailable?'<span class="ep-box-unavailable">Không khả dụng</span>':esc(num(b.soLuongViDaLap??b.soLuongViKhiChon))}</td>${removable?`<td><button class="btn btn-danger mini-btn" data-ep-remove="${i}">Bỏ</button></td>`:''}</tr>`).join('')+'</tbody></table></div>';}
  function renderDraft(){if(!el('epBoxDraft'))return;const items=draft.map(id=>{const b=boxes.find(b=>b.IdThungDungVi===id);return b&&available(b)?b:{IdThungDungVi:id,unavailable:true};});
    el('epBoxDraft').innerHTML=items.length?boxRows(items,true)+`<div class="ep-box-total">${items.length} thùng đã chọn · Tổng tồn khả dụng: ${esc(num(items.reduce((n,b)=>n+(b.unavailable?0:Number(b.soLuongViDaLap)),0)))} vỉ</div>`:'<div class="empty">Chưa thêm thùng vào danh sách.</div>';
    el('epBoxDraft').querySelectorAll('[data-ep-remove]').forEach(button=>button.onclick=()=>{if(pending)return;draft.splice(Number(button.dataset.epRemove),1);newRequest();renderPicker();renderDraft();});
  }
  function changeProduct(){if(pending)return;if(draft.length&&!confirm('Đổi sản phẩm sẽ bỏ danh sách thùng đang chọn. Tiếp tục?')){el('epMangInTenSanPham').value=el('epMangInMaSanPham').value;return;}el('epMangInMaSanPham').value=el('epMangInTenSanPham').value;draft=[];newRequest();renderPicker();renderDraft();}
  function add(){if(pending)return;if(loadedToken!==sessionToken){load();return;}const id=el('epBoxSelect').value,b=boxes.find(b=>b.IdThungDungVi===id);if(!b||b.maSanPham!==el('epMangInTenSanPham').value||!available(b)||draft.includes(id)){message('error','Vui lòng chọn thùng khả dụng.');return;}draft.push(id);newRequest();message('','');renderPicker();renderDraft();}
  function reset(){if(pending)return;editing=null;editingEpMangInSTT=null;draft=[];newRequest();['epMangInTenSanPham','epMangInMaSanPham','epMangInSoLuong'].forEach(id=>el(id).value='');el('epMangInSaveBtn').innerText='Tạo kế hoạch';el('epMangInSaveBtn').className='btn btn-success';message('','');renderPicker();renderDraft();}
  function open(){if(loadedToken!==sessionToken){boxes=[];draft=[];editing=null;newRequest();load();}else{renderPicker();renderDraft();}}
  function load(){if(pending||!sessionToken)return;const token=sessionToken,sequence=++loadSequence;busy(true);message('info','Đang tải kế hoạch và thùng còn tồn…');
    google.script.run.withSuccessHandler(res=>{if(token!==sessionToken||sequence!==loadSequence){busy(false);return;}busy(false);if(!res?.success){message('error','Không tải được danh sách thùng.');return;}boxes=res.boxes||[];epMangInPlans=res.plans||[];loadedToken=token;renderPicker();renderDraft();renderPlans();message('success','Đã tải kế hoạch và tồn thùng hiện tại.');}).withFailureHandler(error=>{busy(false);if(token===sessionToken)message('error',error.message||'Không tải được dữ liệu.');}).getEpMangInBoxData(token);
  }
  function payload(){return {STT:editing?.STT,IdEpMangIn:editing?.IdEpMangIn||'',phienBan:editing?.phienBan||0,maSanPham:el('epMangInTenSanPham').value,soLuongKeHoach:Number(el('epMangInSoLuong').value),items:draft.slice(),maYeuCau:requestId};}
  function save(){if(pending)return;if(loadedToken!==sessionToken){message('error','Vui lòng tải lại danh sách thùng trước khi tạo kế hoạch.');return;}const data=payload(),selected=draft.map(id=>boxes.find(b=>b.IdThungDungVi===id));
    if(!data.maSanPham||!draft.length||selected.some(b=>!b||!available(b)||b.maSanPham!==data.maSanPham)){message('error','Chọn sản phẩm và thêm các thùng khả dụng vào danh sách.');return;}
    if(!Number.isSafeInteger(data.soLuongKeHoach)||data.soLuongKeHoach<=0||data.soLuongKeHoach>selected.reduce((n,b)=>n+Number(b.soLuongViDaLap),0)){message('error','Số lượng kế hoạch phải là số nguyên dương và không vượt tổng tồn đã chọn.');return;}
    if(!confirm((editing?'Cập nhật':'Tạo')+' kế hoạch với '+draft.length+' thùng và '+num(data.soLuongKeHoach)+' vỉ?'))return;
    const token=sessionToken;busy(true);showLoading('Đang lưu kế hoạch','Đang kiểm tra tồn và giữ riêng các thùng…');
    const runner=google.script.run.withSuccessHandler(res=>{busy(false);hideLoading();if(token!==sessionToken)return;if(!res?.success){message('error','Không lưu được kế hoạch.');return;}epMangInPlans=res.plans||[];reset();renderPlans();message('success',res.message);load();}).withFailureHandler(error=>{busy(false);hideLoading();if(token===sessionToken)message('error',error.message||'Không lưu được kế hoạch. Bạn có thể thử lại.');});
    if(editing)runner.updateKeHoachEpMangIn(token,data);else runner.createKeHoachEpMangIn(token,data);
  }
  function editable(plan){return !plan.noiDungLenhXuat&&!plan.IdXuatEpMangIn&&!/^(Hủy kế hoạch|Đã hủy|Hủy|Hoàn thành|Đã hoàn thành)$/i.test(plan.trangThai||'')&&plan.soLuongThucHien===''&&!plan.nguoiBaoCao&&!plan.ThoiGianBaoCao&&!(plan.items||[]).some(d=>Number(d.soLuongViDaXuat)>0||d.thoiGianXuat);}
  function edit(stt){if(pending)return;if(loadedToken!==sessionToken){message('info','Tải danh sách thùng trước khi sửa kế hoạch.');load();return;}const p=epMangInPlans.find(p=>Number(p.STT)===Number(stt));if(!p||!editable(p))return;editing=p;editingEpMangInSTT=p.STT;draft=(p.items||[]).map(d=>d.IdThungDungVi);newRequest();el('epMangInTenSanPham').value=p.maSanPham;el('epMangInMaSanPham').value=p.maSanPham;el('epMangInSoLuong').value=p.soLuongKeHoach;el('epMangInSaveBtn').innerText='Cập nhật kế hoạch';el('epMangInSaveBtn').className='btn btn-warning';renderPicker();renderDraft();message('info','Đang sửa kế hoạch STT '+p.STT+(p.IdEpMangIn?' · '+p.IdEpMangIn:'. Kế hoạch cũ: cần chọn thùng trước khi lưu.'));el('pageEpMangIn').scrollIntoView({behavior:'smooth',block:'start'});}
  function cancel(stt){if(pending)return;const p=epMangInPlans.find(p=>Number(p.STT)===Number(stt));if(!p||!editable(p)||!confirm('Hủy kế hoạch STT '+p.STT+' và nhả các thùng đang giữ?'))return;const token=sessionToken;busy(true);showLoading('Đang hủy kế hoạch','Đang nhả các thùng đang giữ…');google.script.run.withSuccessHandler(res=>{busy(false);hideLoading();if(token!==sessionToken)return;epMangInPlans=res.plans||[];if(editing?.STT===p.STT)reset();renderPlans();message('success',res.message);load();}).withFailureHandler(error=>{busy(false);hideLoading();if(token===sessionToken)message('error',error.message||'Không hủy được kế hoạch.');}).deleteKeHoachEpMangIn(token,{STT:p.STT,IdEpMangIn:p.IdEpMangIn||'',phienBan:p.phienBan||0});}
  function renderPlans(){const root=el('epMangInListBox');if(!root)return;if(!epMangInPlans.length){root.innerHTML='<div class="empty">Không có kế hoạch trong 5 ngày gần nhất.</div>';return;}
    root.innerHTML='<div class="table-wrap"><table class="ep-box-table"><thead><tr><th>STT / Mã kế hoạch</th><th>Sản phẩm</th><th>Vỉ kế hoạch</th><th>Thùng đã chọn</th><th>Đã thực hiện</th><th>Thời gian tạo</th><th>Người tạo</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>'+epMangInPlans.map(p=>`<tr><td>${esc(p.STT)}<div class="ep-box-plan-id">${esc(p.IdEpMangIn||'Kế hoạch cũ')}</div></td><td>${esc(p.tenSanPham)}<div class="ep-box-muted">${esc(p.maSanPham)}</div></td><td class="num">${esc(num(p.soLuongKeHoach))}</td><td>${p.items?.length?`<details class="ep-box-details"><summary>${p.items.length} thùng · Xem chi tiết</summary>${boxRows(p.items,false)}</details>`:'<span class="ep-box-muted">Chưa chọn thùng</span>'}</td><td class="num">${p.soLuongThucHien===''?'Chưa báo cáo':esc(num(p.soLuongThucHien))}</td><td>${esc(p.thoiGianTao)}</td><td>${esc(p.nguoiTao)}</td><td>${esc(p.trangThai)}</td><td>${editable(p)?`<div class="ep-box-actions"><button class="btn btn-warning mini-btn" data-ep-edit="${Number(p.STT)}">Sửa</button><button class="btn btn-danger mini-btn" data-ep-cancel="${Number(p.STT)}">Hủy kế hoạch</button></div>`:'—'}</td></tr>`).join('')+'</tbody></table></div>';
    root.querySelectorAll('[data-ep-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.epEdit)));root.querySelectorAll('[data-ep-cancel]').forEach(b=>b.onclick=()=>cancel(Number(b.dataset.epCancel)));
  }
  return {open,load,products,changeProduct,add,reset,save,edit,cancel,renderPlans};
})();
</script>
