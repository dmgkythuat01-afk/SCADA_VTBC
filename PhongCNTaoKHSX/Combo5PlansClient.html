<style>
#pageCombo5 .plan-grid{grid-template-columns:minmax(0,1fr)}
.combo5-box-picker{display:flex;align-items:flex-end;gap:12px;margin-top:16px}.combo5-box-picker .field{flex:1;min-width:0;margin-bottom:0}.combo5-box-picker select{width:100%;min-width:0}.combo5-box-note{color:#647b80;font-size:13px;line-height:1.5}.combo5-box-table{width:100%;border-collapse:collapse;white-space:nowrap;font-size:14px}.combo5-box-table th,.combo5-box-table td{padding:11px 12px;border:1px solid #dbe7e2;text-align:left}.combo5-box-table th{background:#edf6f1;color:#174d3d}.combo5-box-table td.num{text-align:right}.combo5-box-total{padding:12px 0;font-weight:700;color:#075c43}.combo5-box-unavailable{color:#b42318}.combo5-box-plan-id{font-size:12px;color:#647b80}.combo5-box-details{margin:6px 0}.combo5-box-details summary{cursor:pointer;color:#087153;font-weight:600}.combo5-box-muted{color:#647b80}.combo5-box-actions{display:flex;gap:8px}
@media(max-width:650px){.combo5-box-picker{align-items:stretch;flex-direction:column}.combo5-box-table{font-size:13px}.combo5-box-picker .btn{width:100%}#pageCombo5 .card{min-width:0}.combo5-box-actions{flex-wrap:wrap}}
</style>
<script>
const Combo5Plans=(()=>{
  const el=id=>document.getElementById(id),esc=value=>escapeHtml(String(value??'')),num=value=>formatNumber(Number(value)||0);
  let combo5Plans=[],editingCombo5STT=null;
  let boxes=[],draft=[],loadedToken='',pending=false,loadSequence=0,requestId='',editing=null;
  const newRequest=()=>{requestId=crypto.randomUUID();};
  const message=(type,text)=>showMessage('combo5Message',type,text);
  function busy(value){pending=value;['combo5SaveBtn','epBoxAddCombo5'].forEach(id=>{if(el(id))el(id).disabled=value;});}
  function mount(){const root=el('pageCombo5');if(root.dataset.mounted)return;root.dataset.mounted='1';root.innerHTML=`<div class="plan-grid"><div class="card"><div class="card-title"><div><h2>Kế hoạch đóng thùng combo 5</h2><p>Chọn sản phẩm, thêm thùng nguồn còn tồn rồi nhập số thùng kế hoạch.</p></div><button class="btn btn-light" onclick="Combo5Plans.load()">Tải lại</button></div><div class="field"><label>Tên sản phẩm <span style="color:red">*</span></label><select id="combo5TenSanPham" onchange="Combo5Plans.changeProduct()"><option value="">-- Chọn sản phẩm --</option></select></div><div class="field"><label>Mã sản phẩm</label><input id="combo5MaSanPham" readonly placeholder="Tự điền theo sản phẩm"></div><div class="combo5-box-picker"><div class="field"><label>Thùng nguồn còn tồn — ngày sản xuất cũ trước</label><select id="epBoxSelectCombo5"><option value="">-- Chọn sản phẩm trước --</option></select></div><button id="epBoxAddCombo5" class="btn btn-light" onclick="Combo5Plans.add()">+ Thêm vào danh sách</button></div><div id="epBoxDraftCombo5"></div><p class="combo5-box-note">Thùng được giữ riêng sau khi lưu, không trừ tồn khi tạo kế hoạch.</p><div class="field"><label>Thùng kế hoạch <span style="color:red">*</span></label><input id="combo5SoLuong" type="number" min="1" step="1" placeholder="Nhập số thùng kế hoạch"></div><p class="combo5-box-note">Thùng kế hoạch là chỉ tiêu đầu ra. Tồn thùng nguồn tính bằng vỉ; chưa tự quy đổi khi chưa có quy cách đóng gói.</p><div class="actions"><button id="combo5SaveBtn" class="btn btn-success" onclick="Combo5Plans.save()">Tạo kế hoạch</button><button class="btn btn-light" onclick="Combo5Plans.reset()">Làm mới</button></div><div id="combo5Message"></div></div><div class="card"><div class="card-title"><div><h2>Danh sách kế hoạch đóng thùng combo 5</h2><p>Kế hoạch đang chờ và các kế hoạch trong 5 ngày gần nhất.</p></div></div><div id="combo5ListBox"><div class="empty">Chưa tải dữ liệu.</div></div></div></div>`;}
  function products(){const select=el('combo5TenSanPham');if(!select)return;const value=select.value;select.innerHTML='<option value="">-- Chọn sản phẩm --</option>'+(sanPhamLapViVTBCList||[]).slice().sort((a,b)=>String(a.tenSanPham).localeCompare(String(b.tenSanPham),'vi')).map(p=>`<option value="${esc(p.maSanPham)}">${esc(p.tenSanPham)}</option>`).join('');select.value=value;el('combo5MaSanPham').value=select.value;renderPicker();renderDraft();}
  function available(box){return !box.giuChoKeHoach||box.giuChoKeHoach===editing?.IdDongThungCombo5;}
  function renderPicker(){const select=el('epBoxSelectCombo5');if(!select)return;const product=el('combo5TenSanPham').value;
    const found=boxes.filter(b=>b.maSanPham===product&&available(b)&&!draft.includes(b.IdThungDungVi)).sort((a,b)=>(a.ngaySanXuatSort||'9999').localeCompare(b.ngaySanXuatSort||'9999')||String(a.IdThungDungVi).localeCompare(String(b.IdThungDungVi)));
    select.innerHTML=`<option value="">${!product?'-- Chọn sản phẩm trước --':!loadedToken?'-- Tải dữ liệu để chọn thùng --':found.length?'-- Chọn thùng đựng vỉ --':'-- Không còn thùng khả dụng --'}</option>`+found.map(b=>`<option value="${esc(b.IdThungDungVi)}">NSX ${esc(b.ngaySanXuat||'Chưa có ngày')} · Ngày lắp ${esc(b.thoiGianLuu||'Chưa có ngày')} · ${esc(b.IdThungDungVi)} · ${esc(num(b.soLuongViDaLap))} vỉ · Kho ${esc(b.vitriKho||b.viTriKho||'—')}</option>`).join('');
  }
  function fifoMessage(ids,candidate){const product=el('combo5TenSanPham').value,eligible=boxes.filter(b=>b.maSanPham===product&&available(b)&&Number(b.soLuongViDaLap)>0),unknown=eligible.find(b=>!b.ngaySanXuatSort);if(unknown)return 'Thùng '+unknown.IdThungDungVi+' thiếu hoặc sai ngày sản xuất. Cần cập nhật ngày trước khi chọn theo thứ tự cũ nhất.';const chosen=new Set(ids),dates=eligible.filter(b=>candidate?b.IdThungDungVi===candidate:chosen.has(b.IdThungDungVi)).map(b=>b.ngaySanXuatSort).sort(),newest=dates[dates.length-1],older=eligible.filter(b=>b.ngaySanXuatSort<newest&&!chosen.has(b.IdThungDungVi)).sort((a,b)=>a.ngaySanXuatSort.localeCompare(b.ngaySanXuatSort));if(!older.length)return '';const first=older[0];return 'Còn '+older.filter(b=>b.ngaySanXuatSort===first.ngaySanXuatSort).length+' thùng NSX '+first.ngaySanXuat+' chưa được chọn (ví dụ '+first.IdThungDungVi+'). Phải chọn hết ngày cũ trước khi thêm ngày mới.';}
  function boxRows(items,removable){return `<div class="table-wrap"><table class="combo5-box-table"><thead><tr><th>STT</th><th>Thùng đựng vỉ</th><th>Ngày sản xuất</th><th>Vị trí kho</th><th>${removable?'Vỉ còn tồn':'Vỉ khi chọn'}</th>${removable?'<th>Thao tác</th>':''}</tr></thead><tbody>`+items.map((b,i)=>`<tr><td>${i+1}</td><td>${esc(b.IdThungDungVi)}</td><td>${esc(b.ngaySanXuat||'—')}</td><td>${esc(b.vitriKho||b.viTriKho||'—')}</td><td class="num">${b.unavailable?'<span class="combo5-box-unavailable">Không khả dụng</span>':esc(num(b.soLuongViDaLap??b.soLuongViKhiChon))}</td>${removable?`<td><button class="btn btn-danger mini-btn" data-ep-remove="${i}">Bỏ</button></td>`:''}</tr>`).join('')+'</tbody></table></div>';}
  function renderDraft(){if(!el('epBoxDraftCombo5'))return;const items=draft.map(id=>{const b=boxes.find(b=>b.IdThungDungVi===id);return b&&available(b)?b:{IdThungDungVi:id,unavailable:true};});
    el('epBoxDraftCombo5').innerHTML=items.length?boxRows(items,true)+`<div class="combo5-box-total">${items.length} thùng đã chọn · Tổng tồn khả dụng: ${esc(num(items.reduce((n,b)=>n+(b.unavailable?0:Number(b.soLuongViDaLap)),0)))} vỉ</div>`:'<div class="empty">Chưa thêm thùng vào danh sách.</div>';
    el('epBoxDraftCombo5').querySelectorAll('[data-ep-remove]').forEach(button=>button.onclick=()=>{if(pending)return;draft.splice(Number(button.dataset.epRemove),1);newRequest();renderPicker();renderDraft();});
  }
  function changeProduct(){if(pending)return;if(draft.length&&!confirm('Đổi sản phẩm sẽ bỏ danh sách thùng đang chọn. Tiếp tục?')){el('combo5TenSanPham').value=el('combo5MaSanPham').value;return;}el('combo5MaSanPham').value=el('combo5TenSanPham').value;draft=[];newRequest();renderPicker();renderDraft();}
  function add(){if(pending)return;if(loadedToken!==sessionToken){load();return;}const id=el('epBoxSelectCombo5').value,b=boxes.find(b=>b.IdThungDungVi===id);if(!b||b.maSanPham!==el('combo5TenSanPham').value||!available(b)||draft.includes(id)){message('error','Vui lòng chọn thùng khả dụng.');return;}const fifo=fifoMessage(draft.concat(id),id);if(fifo){message('error',fifo);return;}draft.push(id);newRequest();message('','');renderPicker();renderDraft();}
  function reset(){if(pending)return;editing=null;editingCombo5STT=null;draft=[];newRequest();['combo5TenSanPham','combo5MaSanPham','combo5SoLuong'].forEach(id=>el(id).value='');el('combo5SaveBtn').innerText='Tạo kế hoạch';el('combo5SaveBtn').className='btn btn-success';message('','');renderPicker();renderDraft();}
  function open(){mount();products();if(loadedToken!==sessionToken){boxes=[];draft=[];editing=null;newRequest();load();}else{renderPicker();renderDraft();}}
  function load(){if(pending||!sessionToken)return;const token=sessionToken,sequence=++loadSequence;busy(true);message('info','Đang tải kế hoạch và thùng còn tồn…');
    google.script.run.withSuccessHandler(res=>{if(token!==sessionToken||sequence!==loadSequence){busy(false);return;}busy(false);if(!res?.success){message('error','Không tải được danh sách thùng.');return;}boxes=res.boxes||[];combo5Plans=res.plans||[];loadedToken=token;renderPicker();renderDraft();renderPlans();message('success','Đã tải kế hoạch và tồn thùng hiện tại.');}).withFailureHandler(error=>{busy(false);if(token===sessionToken)message('error',error.message||'Không tải được dữ liệu.');}).getCombo5PlanData(token);
  }
  function payload(){return {STT:editing?.STT,IdDongThungCombo5:editing?.IdDongThungCombo5||'',phienBan:editing?.phienBan||0,maSanPham:el('combo5TenSanPham').value,soLuongKeHoach:Number(el('combo5SoLuong').value),items:draft.slice(),maYeuCau:requestId};}
  function save(){if(pending)return;if(loadedToken!==sessionToken){message('error','Vui lòng tải lại danh sách thùng trước khi tạo kế hoạch.');return;}const data=payload(),selected=draft.map(id=>boxes.find(b=>b.IdThungDungVi===id));
    if(!data.maSanPham||!draft.length||selected.some(b=>!b||!available(b)||b.maSanPham!==data.maSanPham)){message('error','Chọn sản phẩm và thêm các thùng khả dụng vào danh sách.');return;}
    if(!Number.isSafeInteger(data.soLuongKeHoach)||data.soLuongKeHoach<=0){message('error','Thùng kế hoạch phải là số nguyên dương.');return;}
    const fifo=fifoMessage(draft);if(fifo){message('error',fifo);return;}
    if(!confirm((editing?'Cập nhật':'Tạo')+' kế hoạch với '+draft.length+' thùng và '+num(data.soLuongKeHoach)+' thùng?'))return;
    const token=sessionToken;busy(true);showLoading('Đang lưu kế hoạch','Đang kiểm tra tồn và giữ riêng các thùng…');
    const runner=google.script.run.withSuccessHandler(res=>{busy(false);hideLoading();if(token!==sessionToken)return;if(!res?.success){message('error','Không lưu được kế hoạch.');return;}combo5Plans=res.plans||[];reset();renderPlans();message('success',res.message);load();}).withFailureHandler(error=>{busy(false);hideLoading();if(token===sessionToken)message('error',error.message||'Không lưu được kế hoạch. Bạn có thể thử lại.');});
    if(editing)runner.updateKeHoachCombo5(token,data);else runner.createKeHoachCombo5(token,data);
  }
  function editable(plan){return !plan.noiDungLenhXuat&&!plan.IdXuatDongThungCombo5&&!/^(Hủy kế hoạch|Đã hủy|Hủy|Hoàn thành|Đã hoàn thành)$/i.test(plan.trangThai||'')&&plan.soLuongThucHien===''&&!plan.nguoiBaoCao&&!plan.ThoiGianBaoCao&&!(plan.items||[]).some(d=>Number(d.soLuongViDaXuat)>0||d.thoiGianXuat);}
  function edit(stt){if(pending)return;if(loadedToken!==sessionToken){message('info','Tải danh sách thùng trước khi sửa kế hoạch.');load();return;}const p=combo5Plans.find(p=>Number(p.STT)===Number(stt));if(!p||!editable(p))return;editing=p;editingCombo5STT=p.STT;draft=(p.items||[]).map(d=>d.IdThungDungVi);newRequest();el('combo5TenSanPham').value=p.maSanPham;el('combo5MaSanPham').value=p.maSanPham;el('combo5SoLuong').value=p.soLuongKeHoach;el('combo5SaveBtn').innerText='Cập nhật kế hoạch';el('combo5SaveBtn').className='btn btn-warning';renderPicker();renderDraft();message('info','Đang sửa kế hoạch STT '+p.STT+(p.IdDongThungCombo5?' · '+p.IdDongThungCombo5:'. Kế hoạch cũ: cần chọn thùng trước khi lưu.'));el('pageCombo5').scrollIntoView({behavior:'smooth',block:'start'});}
  function cancel(stt){if(pending)return;const p=combo5Plans.find(p=>Number(p.STT)===Number(stt));if(!p||!editable(p)||!confirm('Hủy kế hoạch STT '+p.STT+' và nhả các thùng đang giữ?'))return;const token=sessionToken;busy(true);showLoading('Đang hủy kế hoạch','Đang nhả các thùng đang giữ…');google.script.run.withSuccessHandler(res=>{busy(false);hideLoading();if(token!==sessionToken)return;combo5Plans=res.plans||[];if(editing?.STT===p.STT)reset();renderPlans();message('success',res.message);load();}).withFailureHandler(error=>{busy(false);hideLoading();if(token===sessionToken)message('error',error.message||'Không hủy được kế hoạch.');}).cancelKeHoachCombo5(token,{STT:p.STT,IdDongThungCombo5:p.IdDongThungCombo5||'',phienBan:p.phienBan||0});}
  function renderPlans(){const root=el('combo5ListBox');if(!root)return;if(!combo5Plans.length){root.innerHTML='<div class="empty">Không có kế hoạch trong 5 ngày gần nhất.</div>';return;}
    root.innerHTML='<div class="table-wrap"><table class="combo5-box-table"><thead><tr><th>STT / Mã kế hoạch</th><th>Sản phẩm</th><th>Thùng kế hoạch</th><th>Thùng đã chọn</th><th>Đã thực hiện</th><th>Thời gian tạo</th><th>Người tạo</th><th>Trạng thái</th><th>Thao tác</th></tr></thead><tbody>'+combo5Plans.map(p=>`<tr><td>${esc(p.STT)}<div class="combo5-box-plan-id">${esc(p.IdDongThungCombo5||'Kế hoạch cũ')}</div></td><td>${esc(p.tenSanPham)}<div class="combo5-box-muted">${esc(p.maSanPham)}</div></td><td class="num">${esc(num(p.soLuongKeHoach))}</td><td>${p.items?.length?`<details class="combo5-box-details"><summary>${p.items.length} thùng · Xem chi tiết</summary>${boxRows(p.items,false)}</details>`:'<span class="combo5-box-muted">Chưa chọn thùng</span>'}</td><td class="num">${p.soLuongThucHien===''?'Chưa báo cáo':esc(num(p.soLuongThucHien))}</td><td>${esc(p.thoiGianTao)}</td><td>${esc(p.nguoiTao)}</td><td>${esc(p.trangThai)}</td><td>${editable(p)?`<div class="combo5-box-actions"><button class="btn btn-warning mini-btn" data-ep-edit="${Number(p.STT)}">Sửa</button><button class="btn btn-danger mini-btn" data-ep-cancel="${Number(p.STT)}">Hủy kế hoạch</button></div>`:'—'}</td></tr>`).join('')+'</tbody></table></div>';
    root.querySelectorAll('[data-ep-edit]').forEach(b=>b.onclick=()=>edit(Number(b.dataset.epEdit)));root.querySelectorAll('[data-ep-cancel]').forEach(b=>b.onclick=()=>cancel(Number(b.dataset.epCancel)));
  }
  return {open,load,products,changeProduct,add,reset,save,edit,cancel,renderPlans};
})();
</script>
