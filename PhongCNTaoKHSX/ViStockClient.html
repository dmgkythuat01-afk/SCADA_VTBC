<style>
.vi-stock-controls{display:flex;gap:12px;align-items:end;flex-wrap:wrap;margin:14px 0}.vi-stock-controls .field{min-width:200px;flex:1;margin:0}.vi-stock-controls select{width:100%;min-height:42px}.vi-stock-table{overflow:auto;max-height:65vh;border:1px solid #dde5e2;border-radius:10px}.vi-stock-table table{min-width:100%;width:max-content;border-collapse:collapse}.vi-stock-table th,.vi-stock-table td{white-space:nowrap;padding:11px 14px;border-bottom:1px solid #e4ece8;text-align:left}.vi-stock-table th{background:#eef5f1;position:sticky;top:0}.vi-stock-table .vi-number{text-align:right;font-variant-numeric:tabular-nums}.vi-stock-summary{font-weight:700;margin:14px 0;color:#075d47}.vi-stock-note{font-size:13px;color:#677a72;margin:8px 0}.vi-stock-progress{margin-top:20px}
</style>
<script>
const ViStock=(()=>{
 let data=null,busy=false;
 const el=id=>document.getElementById(id),esc=value=>escapeHtml(value),number=v=>Number(v||0).toLocaleString('vi-VN');
 function mount(){const page=el('pageKhoBanThanhPham');if(page.dataset.mounted)return;page.dataset.mounted='1';page.innerHTML=`<div class="card"><div class="card-title"><div><h2>Tồn kho vỉ VTBC</h2><p>Số vỉ hiện còn trong kho, chưa xuất sang ép màng.</p></div><button class="btn btn-success" id="viStockReload">Tải dữ liệu</button></div><div class="vi-stock-controls"><div class="field"><label>Sản phẩm</label><select id="viStockProduct"><option value="">Tất cả sản phẩm</option></select></div><div class="field"><label>Hiển thị</label><select id="viStockMode"><option value="total">Tổng theo sản phẩm — tất cả ngày</option><option value="detail">Chi tiết theo thùng / ngày</option></select></div></div><div id="viStockMessage"></div><div id="viStockSummary" class="vi-stock-summary"></div><div id="viStockTable"></div></div><div class="card vi-stock-progress"><div class="card-title"><div><h2>Theo dõi tiến độ lắp vỉ</h2><p>Số đã lắp gồm vỉ còn tồn và vỉ đã xuất. Bộ lọc sản phẩm ở trên áp dụng cho cả hai card.</p></div></div><div id="viStockProgress"></div></div>`;el('viStockReload').onclick=load;el('viStockProduct').onchange=render;el('viStockMode').onchange=render;}
 function table(columns,rows){return '<div class="vi-stock-table"><table><thead><tr>'+columns.map(c=>'<th>'+esc(c[1])+'</th>').join('')+'</tr></thead><tbody>'+(rows.length?rows.map(r=>'<tr>'+columns.map(c=>'<td'+(c[2]?' class="vi-number"':'')+'>'+esc(c[2]?number(r[c[0]]):r[c[0]]??'')+'</td>').join('')+'</tr>').join(''):'<tr><td colspan="'+columns.length+'">Không có dữ liệu.</td></tr>')+'</tbody></table></div>';}
 function render(){if(!data)return;const product=el('viStockProduct').value,filter=r=>!product||r.productKey===product,details=data.details.filter(filter),totals=data.totals.filter(filter),progress=data.progress.filter(filter);el('viStockSummary').textContent='Tồn kho hiện tại: '+number(totals.reduce((n,r)=>n+r.tonKho,0))+' vỉ';
 const columns=el('viStockMode').value==='total'?[['tenSanPham','Tên sản phẩm'],['maSanPham','Mã sản phẩm'],['tonKho','Tồn kho (vỉ)',true],['soThungConTon','Số thùng còn tồn',true]]:[['tenSanPham','Tên sản phẩm'],['maSanPham','Mã sản phẩm'],['IdThungDungVi','Mã thùng đựng vỉ'],['IdLapVi','Mã kế hoạch lắp vỉ'],['soLuongViDaLap','Tồn kho (vỉ)',true],['ngaySanXuat','Ngày sản xuất'],['thoiGianLuu','Thời gian lưu'],['nguoiLuu','Người lưu'],['vitriKho','Vị trí kho'],['IdThungBanThanhPham1','Thùng BTP 1'],['IdThungBanThanhPham2','Thùng BTP 2']];
 el('viStockTable').innerHTML=table(columns,el('viStockMode').value==='total'?totals:details);el('viStockProgress').innerHTML=table([['IdLapVi','Mã kế hoạch lắp vỉ'],['tenSanPham','Tên sản phẩm'],['keHoach','Kế hoạch (vỉ)',true],['daLap','Đã lắp (vỉ)',true],['daXuat','Đã xuất ép màng (vỉ)',true],['tonKho','Còn tồn (vỉ)',true],['conCanLap','Còn cần lắp (vỉ)',true]],progress);
 showMessage('viStockMessage',data.warnings.length?'error':'',data.warnings.join(' '));}
 function load(){if(busy)return;busy=true;el('viStockReload').disabled=true;el('viStockReload').textContent='Đang tải…';const done=()=>{busy=false;el('viStockReload').disabled=false;el('viStockReload').textContent='Tải lại dữ liệu';};google.script.run.withSuccessHandler(res=>{done();if(!res?.success){showMessage('viStockMessage','error','Không tải được tồn kho vỉ.');return;}data=res;const selected=el('viStockProduct').value,products=new Map([...res.totals,...res.progress].map(r=>[r.productKey,r]));el('viStockProduct').innerHTML='<option value="">Tất cả sản phẩm</option>'+[...products.values()].sort((a,b)=>a.tenSanPham.localeCompare(b.tenSanPham,'vi')).map(r=>'<option value="'+esc(r.productKey)+'">'+esc(r.tenSanPham)+(r.maSanPham?' — '+esc(r.maSanPham):'')+'</option>').join('');el('viStockProduct').value=products.has(selected)?selected:'';render();}).withFailureHandler(err=>{done();showMessage('viStockMessage','error',err.message||String(err));}).getViStock(sessionToken);}
 function open(){mount();if(!data)load();}
 return {open};
})();
</script>
