<!doctype html>
<html lang="vi">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>DMG Quản lý thiết bị</title
  ><style>
    body {
      font: 18px system-ui;
      background: #f4f6f2;
      color: #123e35;
      max-width: 640px;
      margin: 12vh auto;
      padding: 24px;
      line-height: 1.8;
    }
    a {
      display: inline-block;
      background: #176c52;
      color: white;
      padding: 12px 20px;
      border-radius: 12px;
      text-decoration: none;
    }
  </style>
  <h1>DMG Quản lý thiết bị</h1>
  <p>
    Ứng dụng đã chuyển sang Google Apps Script. Dữ liệu lưu tại Google Sheets,
    ảnh lưu Google Drive.
  </p>
  <a
    href="https://script.google.com/macros/s/AKfycbwK1JwWhrazLtOZ7YnPZedvkS71KLvCWCQDY52fvmLVk4505FulJFF_ER7Cz1mkaYguJg/exec"
    target="_top"
    >Mở ứng dụng</a
  >
  <script>
    if (navigator.serviceWorker)
      navigator.serviceWorker
        .getRegistrations()
        .then((rs) => rs.forEach((r) => r.unregister()));
  </script>
</html>
