<script>
  "use strict";
  const $ = (id) => document.getElementById(id),
    esc = (v) =>
      String(v ?? "").replace(
        /[&<>"']/g,
        (c) =>
          ({
            "&": "&amp;",
            "<": "&lt;",
            ">": "&gt;",
            '"': "&quot;",
            "'": "&#39;",
          })[c],
      ),
    parse = (v, f = []) => {
      try {
        return JSON.parse(v || "");
      } catch {
        return f;
      }
    },
    uid = () => crypto.randomUUID();
  const TYPES = {
      workshop: "Xưởng",
      area: "Khu vực",
      machine: "Máy",
      component: "Thiết bị / bộ phận",
    },
    NEXT = { workshop: "area", area: "machine", machine: "component" },
    STATUS = {
      open: "Chờ xử lý",
      in_progress: "Đang thực hiện",
      completed: "Hoàn thành",
    };
  const state = {
    data: null,
    page: "dashboard",
    assetId: "",
    filter: "all",
    search: "",
    user: null,
    busy: false,
  };
  let sessionToken = sessionStorage.getItem("equipmentSession") || "";
  function gasCall(method, ...args) {
    return new Promise((resolve, reject) => {
      if (!window.google?.script?.run) {
        reject(Error("H\u00e3y m\u1edf app b\u1eb1ng link Apps Script."));
        return;
      }
      google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler((error) =>
          reject(
            Error(
              error.message ||
                "Kh\u00f4ng k\u1ebft n\u1ed1i \u0111\u01b0\u1ee3c.",
            ),
          ),
        )
        [method](...args);
    });
  }
  function api(action, payload = {}) {
    return gasCall("equipmentApi", sessionToken, action, payload);
  }
  function alertError(error) {
    $("alert").hidden = false;
    $("alert").textContent = error.message || String(error);
  }
  function toast(text) {
    $("toast").textContent = text;
    $("toast").hidden = false;
    setTimeout(() => ($("toast").hidden = true), 4500);
  }
  function enabled(a) {
    return String(a.active) !== "false";
  }
  function assets() {
    return state.data.assets.filter(enabled);
  }
  function path(id) {
    let a = state.data.assets.find((a) => a.id === id),
      names = [],
      n = 0;
    while (a && n++ < 5) {
      names.unshift(a.name);
      a = state.data.assets.find((x) => x.id === a.parentId);
    }
    return names.join(" / ");
  }
  function descendants(id) {
    const out = [id];
    for (let i = 0; i < out.length; i++)
      state.data.assets
        .filter((a) => a.parentId === out[i])
        .forEach((a) => out.push(a.id));
    return out;
  }
  function day(v) {
    return v ? String(v).slice(0, 10).split("-").reverse().join("/") : "";
  }
  function due(s) {
    const n =
      (Date.parse(s.dueDate + "T00:00:00Z") -
        Date.parse(state.data.today + "T00:00:00Z")) /
      86400000;
    return n <= 0 ? "overdue" : n <= 14 ? "soon" : "later";
  }
  function duePill(s) {
    const d = due(s);
    return (
      '<span class="pill ' +
      (d === "overdue" ? "red" : d === "soon" ? "amber" : "") +
      '">' +
      (d === "overdue"
        ? "Đến hạn / quá hạn"
        : d === "soon"
          ? "Trong 14 ngày tới"
          : "Đúng lịch") +
      "</span>"
    );
  }
  function member(email) {
    return (
      state.data.members.find((m) => m.email === email)?.name ||
      email ||
      "Chưa giao"
    );
  }
  function empty(title, detail = "") {
    return (
      '<div class="empty"><strong>' +
      esc(title) +
      "</strong>" +
      esc(detail) +
      "</div>"
    );
  }
  function action(cmd, label, id = "", cls = "") {
    return (
      '<button type="button" class="' +
      cls +
      '" data-action="' +
      cmd +
      '" data-id="' +
      esc(id) +
      '">' +
      label +
      "</button>"
    );
  }
  function card(title, sub, body, actions = "") {
    return (
      '<div class="card"><div class="card-head"><div><h2>' +
      title +
      "</h2>" +
      (sub ? "<p>" + sub + "</p>" : "") +
      '</div><div class="actions">' +
      actions +
      "</div></div>" +
      body +
      "</div>"
    );
  }
  async function refresh() {
    if (state.busy) return;
    state.busy = true;
    $("refresh").disabled = true;
    try {
      state.data = await api("snapshot");
      $("alert").hidden = true;
      $("connection").textContent = "Đã đồng bộ";
      $("userName").textContent = state.data.user.name;
      $("lastSync").textContent =
        "Cập nhật " + new Date().toLocaleTimeString("vi-VN");
      render();
    } catch (e) {
      $("connection").textContent = "Chưa kết nối";
      if (/phi\u00ean \u0111\u0103ng nh\u1eadp/i.test(e.message)) {
        showLogin();
        $("loginError").textContent = e.message;
      } else alertError(e);
    } finally {
      state.busy = false;
      $("refresh").disabled = false;
    }
  }
  function scheduleTable(items) {
    if (!items.length)
      return empty(
        "Không có lịch trong mục này",
        "Lịch được tạo riêng cho từng bộ phận.",
      );
    return (
      '<div class="table-scroll"><table><thead><tr><th>BỘ PHẬN / VỊ TRÍ</th><th>CÔNG VIỆC</th><th>CHU KỲ</th><th>HẠN TIẾP THEO</th><th>PHỤ TRÁCH</th><th></th></tr></thead><tbody>' +
      items
        .sort((a, b) => a.dueDate.localeCompare(b.dueDate))
        .map(
          (s) =>
            '<tr class="' +
            due(s) +
            '"><td>' +
            esc(state.data.assets.find((a) => a.id === s.componentId)?.name) +
            "<small>" +
            esc(path(s.componentId)) +
            "</small></td><td>" +
            esc(s.name) +
            "<small>" +
            duePill(s) +
            "</small></td><td>" +
            s.interval +
            " " +
            (s.unit === "week" ? "tuần" : "tháng") +
            "</td><td><b>" +
            day(s.dueDate) +
            "</b></td><td>" +
            esc(member(s.assignee)) +
            '</td><td><div class="actions">' +
            action("startMaintenance", "Thực hiện", s.id) +
            (state.data.user.role === "admin"
              ? action("editSchedule", "Sửa lịch", s.id)
              : "") +
            "</div></td></tr>",
        )
        .join("") +
      "</tbody></table></div>"
    );
  }
  function render() {
    if (!state.data) {
      $("content").innerHTML = empty("Đang kết nối Google Sheets…");
      return;
    }
    document
      .querySelectorAll("nav button")
      .forEach((b) =>
        b.classList.toggle("active", b.dataset.page === state.page),
      );
    const titles = {
      dashboard: "Tổng quan vận hành",
      assets: "Hồ sơ thiết bị",
      managers: "Người quản lý máy",
      calendar: "Lịch bảo dưỡng",
      jobs: "Công việc & lịch sử",
      settings: "Thiết lập ứng dụng",
    };
    $("pageTitle").textContent = titles[state.page];
    ({
      dashboard: renderDashboard,
      assets: renderAssets,
      managers: renderManagers,
      calendar: renderCalendar,
      jobs: renderJobs,
      settings: renderSettings,
    })[state.page]();
  }
  function renderDashboard() {
    const schedules = state.data.schedules.filter(enabled),
      late = schedules.filter((s) => due(s) === "overdue"),
      soon = schedules.filter((s) => due(s) === "soon"),
      jobs = state.data.jobs.filter((j) => j.status !== "completed");
    $("content").innerHTML =
      '<div class="metrics">' +
      [
        [
          "Máy đang quản lý",
          assets().filter((a) => a.type === "machine").length,
          "Hồ sơ theo xưởng & khu vực",
          "",
        ],
        [
          "Đến hạn / quá hạn",
          late.length,
          "Cần ưu tiên thực hiện",
          "alert-metric",
        ],
        ["Trong 14 ngày tới", soon.length, "Chủ động chuẩn bị nguồn lực", ""],
        ["Công việc đang mở", jobs.length, "Sửa chữa & bảo dưỡng", ""],
      ]
        .map(
          ([name, n, sub, cls]) =>
            '<div class="metric ' +
            cls +
            '"><span>' +
            name +
            '</span><div class="number">' +
            n +
            "</div><span>" +
            sub +
            "</span></div>",
        )
        .join("") +
      "</div>" +
      card(
        "Ưu tiên bảo dưỡng",
        "Các công việc đến hạn luôn được giữ đỏ cho đến khi hoàn thành.",
        scheduleTable([...late, ...soon]),
        action("goCalendar", "Xem toàn bộ"),
      ) +
      '<div class="grid-two">' +
      card(
        "Công việc đang xử lý",
        "Theo dõi người nhận và tiến độ.",
        jobs.length
          ? jobs.slice(0, 5).map(jobCard).join("")
          : empty("Chưa có công việc đang mở"),
      ) +
      card(
        "Nhịp kiểm tra hằng tuần",
        "Báo cáo tự động sáng thứ Hai và thứ Sáu.",
        '<div class="card-body"><p>01 · Kiểm tra các việc đã đến hạn.</p><p>02 · Chuẩn bị lịch bảo dưỡng 14 ngày tới.</p><p>03 · Cập nhật kết quả và ảnh hoàn thành.</p><p class="hint">Hạn tiếp theo tính từ ngày thực tế hoàn thành. Email gửi vào thứ Hai và thứ Sáu hằng tuần.</p></div>',
      ) +
      "</div>";
  }
  function tree(parentId = "") {
    return assets()
      .filter((a) => String(a.parentId || "") === parentId)
      .map(
        (a) =>
          '<div class="tree-node"><button data-action="selectAsset" data-id="' +
          esc(a.id) +
          '" class="' +
          (state.assetId === a.id ? "selected" : "") +
          '">' +
          { workshop: "▦", area: "▧", machine: "⚙", component: "◇" }[a.type] +
          " " +
          esc(a.name) +
          '</button><div class="tree-children">' +
          tree(a.id) +
          "</div></div>",
      )
      .join("");
  }
  function renderAssets() {
    const a = state.data.assets.find((a) => a.id === state.assetId),
      admin = state.data.user.role === "admin";
    $("content").innerHTML =
      '<div class="tree-layout">' +
      card(
        "Danh mục",
        "Xưởng → khu vực → máy → bộ phận",
        '<div class="tree-panel">' +
          (tree() || empty("Chưa có xưởng")) +
          "</div>",
        admin ? action("addAsset", "＋ Xưởng", "") : "",
      ) +
      "<div>" +
      (a
        ? assetDetail(a)
        : card(
            "Hồ sơ thiết bị",
            "Mọi thông tin tập trung theo từng máy.",
            empty(
              "Chọn một máy hoặc bộ phận",
              "Bắt đầu bằng cách thêm xưởng, sau đó khu vực, máy và bộ phận.",
            ),
          )) +
      "</div></div>";
  }
  function assetDetail(a) {
    const admin = state.data.user.role === "admin",
      children = assets().filter((c) => c.parentId === a.id),
      ids = descendants(a.id),
      schedules = state.data.schedules.filter(
        (s) => enabled(s) && ids.includes(s.componentId),
      ),
      jobs = state.data.jobs.filter((j) => ids.includes(j.componentId));
    let html = card(
      esc(TYPES[a.type]),
      esc(path(a.id)),
      '<div class="card-body"><div class="detail-heading"><div><h2>' +
        esc(a.name) +
        '</h2><span class="pill">' +
        esc(a.code || "Chưa đặt mã") +
        '</span></div><div class="actions">' +
        (admin ? action("editAsset", "Sửa hồ sơ", a.id) : "") +
        (a.type === "component"
          ? action("repair", "＋ Báo sửa chữa", a.id, "primary")
          : "") +
        '</div></div><div class="data-grid"><div><label>ỨNG DỤNG / CÔNG DỤNG</label><p>' +
        esc(a.purpose || "Chưa cập nhật") +
        "</p></div><div><label>CHI TIẾT / THÔNG SỐ</label><p>" +
        esc(a.details || "Chưa cập nhật") +
        "</p></div></div>" +
        machineManagerSummary(a) +
        (parse(a.checklist).length
          ? "<h3>Danh mục kiểm tra</h3>" +
            parse(a.checklist)
              .map((x) => '<div class="check">☐ ' + esc(x) + "</div>")
              .join("")
          : "") +
        "</div>",
    );
    if (NEXT[a.type])
      html += card(
        esc(TYPES[NEXT[a.type]]) + " trực thuộc",
        children.length + " mục",
        children.length
          ? '<div class="card-body">' +
              children
                .map(
                  (c) =>
                    '<div class="child-card"><div><b>' +
                    esc(c.name) +
                    '</b><small class="muted">' +
                    esc(c.code) +
                    "</small></div>" +
                    action("selectAsset", "Mở hồ sơ →", c.id) +
                    "</div>",
                )
                .join("") +
              "</div>"
          : empty("Chưa có " + TYPES[NEXT[a.type]].toLowerCase()),
        admin ? action("addAsset", "＋ Thêm", a.id, "primary") : "",
      );
    html += card(
      "Lịch bảo dưỡng",
      schedules.length + " công việc",
      scheduleTable(schedules),
      a.type === "component" && admin
        ? action("addSchedule", "＋ Thêm lịch", a.id, "primary")
        : "",
    );
    if (jobs.length)
      html += card(
        "Lịch sử sửa chữa & bảo dưỡng",
        "Lưu theo từng bộ phận, người thực hiện và ảnh.",
        jobs
          .sort((a, b) => String(b.openedAt).localeCompare(String(a.openedAt)))
          .map(jobCard)
          .join(""),
      );
    return html;
  }
  function renderCalendar() {
    let schedules = state.data.schedules.filter(enabled);
    if (state.filter !== "all")
      schedules = schedules.filter((s) => due(s) === state.filter);
    $("content").innerHTML =
      '<div class="filter-row"><select id="calendarFilter"><option value="all">Tất cả lịch</option><option value="overdue">Đến hạn / quá hạn</option><option value="soon">14 ngày tới</option><option value="later">Lịch xa hơn</option></select></div>' +
      card(
        "Kế hoạch theo bộ phận",
        "Mỗi công việc có chu kỳ riêng; kỳ mới tính từ ngày hoàn thành thực tế.",
        scheduleTable(schedules),
      );
    $("calendarFilter").value = state.filter;
    $("calendarFilter").onchange = (e) => {
      state.filter = e.target.value;
      renderCalendar();
    };
  }
  function jobCard(j) {
    const photos = parse(j.photos),
      result = parse(j.result, {}),
      done = j.status === "completed";
    return (
      '<article class="job"><div class="job-top"><div><span class="pill ' +
      (done ? "" : "blue") +
      '">' +
      esc(STATUS[j.status] || j.status) +
      '</span> <span class="hint">' +
      (j.type === "repair" ? "Sửa chữa" : "Bảo dưỡng") +
      "</span><h3>" +
      esc(j.title) +
      '</h3><small class="muted">' +
      esc(path(j.componentId)) +
      "</small></div>" +
      action("selectAsset", "Hồ sơ →", j.componentId) +
      "</div><p>" +
      esc(j.description || "") +
      '</p><small class="muted">Phụ trách: ' +
      esc(member(j.assignee)) +
      " · Mở việc: " +
      day(j.openedAt) +
      "</small>" +
      (done
        ? "<p><b>Kết quả:</b> " +
          esc(result.text || j.result) +
          '</p><small class="muted">Hoàn thành ' +
          day(j.completedDate) +
          " · " +
          esc(member(j.completedBy)) +
          "</small>"
        : '<div class="actions" style="margin-top:14px">' +
          action("assignJob", "Nhận / cập nhật người thực hiện", j.id) +
          action("completeJob", "Hoàn thành & thêm ảnh", j.id, "primary") +
          "</div>") +
      (photos.length
        ? '<div class="photos">' +
          photos
            .map(
              (p, i) =>
                '<button data-action="photo" data-job="' +
                esc(j.id) +
                '" data-id="' +
                esc(p.id) +
                '">▧ Ảnh ' +
                (i + 1) +
                "</button>",
            )
            .join("") +
          "</div>"
        : "") +
      "</article>"
    );
  }
  function renderJobs() {
    let jobs = state.data.jobs;
    if (state.search)
      jobs = jobs.filter((j) =>
        (j.title + " " + path(j.componentId) + " " + member(j.assignee))
          .toLocaleLowerCase("vi")
          .includes(state.search.toLocaleLowerCase("vi")),
      );
    $("content").innerHTML =
      '<div class="filter-row"><input id="jobSearch" placeholder="Tìm máy, bộ phận, công việc hoặc người phụ trách" value="' +
      esc(state.search) +
      '"></div>' +
      card(
        "Công việc & lịch sử",
        jobs.length + " công việc",
        jobs.length
          ? jobs
              .slice()
              .sort((a, b) =>
                String(b.openedAt).localeCompare(String(a.openedAt)),
              )
              .map(jobCard)
              .join("")
          : empty(
              "Chưa có công việc",
              "Mở một bộ phận để báo sửa chữa hoặc thực hiện lịch bảo dưỡng.",
            ),
      );
    $("jobSearch").oninput = (e) => {
      state.search = e.target.value;
      const start = e.target.selectionStart;
      renderJobs();
      $("jobSearch").focus();
      $("jobSearch").setSelectionRange(start, start);
    };
  }
  function renderSettings() {
    if (state.data.user.role !== "admin") {
      $("content").innerHTML = card(
        "Tài khoản",
        esc(state.data.user.email),
        '<div class="card-body"><p>Bạn có thể nhận việc, cập nhật sửa chữa, hoàn thành bảo dưỡng và đính kèm ảnh.</p></div>',
      );
      return;
    }
    const settings = state.data.settings;
    $("content").innerHTML =
      card(
        "Email & nhắc lịch",
        "Thứ Hai và thứ Sáu, khung 8–9 giờ sáng Việt Nam.",
        '<div class="card-body"><p>Email nhận: <b>' +
          esc(settings.reportEmails || "Chưa thiết lập") +
          '</b></p><p class="hint">Báo cáo gồm việc quá hạn, 14 ngày tới, việc đang xử lý và việc hoàn thành trong 7 ngày qua.</p><div class="actions">' +
          action("settings", "Sửa email nhận") +
          action("report", "Gửi báo cáo ngay") +
          "</div></div>",
      ) +
      card(
        "Thành viên",
        "Tài khoản đăng nhập từ sheet TaiKhoan.",
        '<div class="table-scroll"><table><thead><tr><th>HỌ TÊN</th><th>TÊN ĐĂNG NHẬP</th><th>EMAIL</th><th>CHỨC VỤ</th><th></th></tr></thead><tbody>' +
          state.data.members
            .map(
              (m) =>
                "<tr><td>" +
                esc(m.name) +
                "</td><td>" +
                esc(m.email) +
                "</td><td>" +
                esc(m.contactEmail || "—") +
                "</td><td>" +
                esc(
                  m.position || (m.role === "admin" ? "Quản trị" : "Kỹ thuật"),
                ) +
                "</td><td>" +
                action("editMember", "Sửa", m.email) +
                "</td></tr>",
            )
            .join("") +
          "</tbody></table></div>",
        action("addMember", "＋ Thành viên", "", "primary"),
      ) +
      card(
        "Kết quả gửi thông báo",
        "Theo dõi lỗi cấp quyền và dịch vụ.",
        '<div class="table-scroll"><table><thead><tr><th>NGÀY</th><th>KÊNH</th><th>NGƯỜI NHẬN</th><th>KẾT QUẢ</th></tr></thead><tbody>' +
          state.data.notifications
            .slice()
            .reverse()
            .map(
              (n) =>
                "<tr><td>" +
                day(n.date) +
                "</td><td>" +
                esc(n.kind) +
                "</td><td>" +
                esc(n.recipient) +
                "</td><td>" +
                esc(n.status) +
                (n.message ? "<small>" + esc(n.message) + "</small>" : "") +
                "</td></tr>",
            )
            .join("") +
          "</tbody></table></div>",
      );
  }
  const field = (label, name, value = "", type = "text", required = false) =>
    '<label class="field">' +
    label +
    '<input name="' +
    name +
    '" type="' +
    type +
    '" value="' +
    esc(value) +
    '" ' +
    (required ? "required" : "") +
    "></label>";
  const area = (label, name, value = "") =>
    '<label class="field">' +
    label +
    '<textarea name="' +
    name +
    '">' +
    esc(value) +
    "</textarea></label>";
  const people = (selected = "") =>
    '<label class="field">Người phụ trách<select name="assignee"><option value="">Chưa giao</option>' +
    state.data.members
      .map(
        (m) =>
          '<option value="' +
          esc(m.email) +
          '" ' +
          (m.email === selected ? "selected" : "") +
          ">" +
          esc(m.name) +
          " — " +
          esc(m.email) +
          "</option>",
      )
      .join("") +
    "</select></label>";
  let submitEditor = null;
  function editor(title, fields, submit) {
    $("editorTitle").textContent = title;
    $("editorFields").innerHTML = fields;
    $("formError").textContent = "";
    $("saveEditor").disabled = false;
    $("saveEditor").textContent = "Lưu";
    submitEditor = submit;
    $("editor").showModal();
  }
  function lines(v) {
    return String(v || "")
      .split("\n")
      .map((v) => v.trim())
      .filter(Boolean);
  }
  function assetEditor(id, parentId) {
    const a = state.data.assets.find((a) => a.id === id),
      parent = state.data.assets.find((a) => a.id === parentId),
      type = a?.type || (parent ? NEXT[parent.type] : "workshop");
    editor(
      (a ? "Sửa " : "Thêm ") + TYPES[type],
      field("Tên " + TYPES[type], "name", a?.name, "text", true) +
        field("Mã nhận diện", "code", a?.code) +
        (type === "machine" ? machineManagerField(a?.managerId || "") : "") +
        area("Ứng dụng / dùng để làm gì", "purpose", a?.purpose) +
        area("Thông số, model, hãng, chi tiết", "details", a?.details) +
        area(
          "Checklist kiểm tra — mỗi dòng một mục",
          "checklist",
          parse(a?.checklist).join("\n"),
        ) +
        (a
          ? '<label class="check"><input type="checkbox" name="active" ' +
            (enabled(a) ? "checked" : "") +
            ">Đang sử dụng</label>"
          : ""),
      async (f) =>
        api("saveAsset", {
          id: a?.id,
          revision: a?.revision,
          type,
          parentId: a?.parentId || parentId || "",
          ...Object.fromEntries(f),
          checklist: lines(f.get("checklist")),
          active: a ? f.has("active") : true,
        }),
    );
  }
  function scheduleEditor(id, componentId) {
    const s = state.data.schedules.find((s) => s.id === id);
    editor(
      s ? "Sửa lịch bảo dưỡng" : "Thêm lịch cho bộ phận",
      field("Công việc bảo dưỡng", "name", s?.name, "text", true) +
        field(
          "Chu kỳ (số nguyên 1–120)",
          "interval",
          s?.interval || 1,
          "number",
          true,
        ) +
        '<label class="field">Đơn vị chu kỳ<select name="unit"><option value="week" ' +
        (s?.unit === "week" ? "selected" : "") +
        '>Tuần</option><option value="month" ' +
        (!s || s.unit === "month" ? "selected" : "") +
        ">Tháng</option></select></label>" +
        field(
          "Hạn bảo dưỡng đầu tiên / tiếp theo",
          "dueDate",
          s?.dueDate || state.data.today,
          "date",
          true,
        ) +
        people(s?.assignee) +
        area(
          "Checklist thực hiện — mỗi dòng một mục",
          "checklist",
          parse(s?.checklist).join("\n"),
        ) +
        (s
          ? '<label class="check"><input type="checkbox" name="active" ' +
            (enabled(s) ? "checked" : "") +
            ">Lịch đang áp dụng</label>"
          : ""),
      async (f) =>
        api("saveSchedule", {
          id: s?.id,
          revision: s?.revision,
          componentId: s?.componentId || componentId,
          ...Object.fromEntries(f),
          interval: Number(f.get("interval")),
          checklist: lines(f.get("checklist")),
          active: s ? f.has("active") : true,
        }),
    );
  }
  async function compressedPhoto(file) {
    if (!/^image\//.test(file.type)) throw Error("Chỉ chọn tệp ảnh.");
    if (file.size > 25 * 1024 * 1024) throw Error("Ảnh gốc tối đa 25 MB.");
    const url = URL.createObjectURL(file);
    try {
      const image = new Image();
      image.src = url;
      await image.decode();
      const scale = Math.min(1, 1600 / Math.max(image.width, image.height)),
        canvas = document.createElement("canvas");
      canvas.width = Math.max(1, Math.round(image.width * scale));
      canvas.height = Math.max(1, Math.round(image.height * scale));
      canvas
        .getContext("2d")
        .drawImage(image, 0, 0, canvas.width, canvas.height);
      return canvas.toDataURL("image/jpeg", 0.8);
    } finally {
      URL.revokeObjectURL(url);
    }
  }
  function completionEditor(id) {
    const j = state.data.jobs.find((j) => j.id === id),
      s = state.data.schedules.find((s) => s.id === j.scheduleId),
      checks = parse(s?.checklist),
      requestId = uid();
    editor(
      "Hoàn thành: " + j.title,
      field(
        "Ngày thực tế hoàn thành",
        "completedDate",
        state.data.today,
        "date",
        true,
      ) +
        area("Nội dung đã làm / linh kiện thay / kết quả", "result") +
        checks
          .map(
            (x, i) =>
              '<label class="check"><input type="checkbox" name="check' +
              i +
              '" required>' +
              esc(x) +
              "</label>",
          )
          .join("") +
        '<label class="field">Ảnh hoàn thành (có thể chọn nhiều ảnh)<input name="photos" type="file" accept="image/*" multiple></label><p class="hint">Tối đa 12 ảnh mỗi công việc. Ảnh tự thu nhỏ và lưu riêng tư; chỉ tài khoản được cấp quyền xem được.</p><div id="uploadProgress" class="hint"></div>',
      async (f) => {
        const files = Array.from($("editorForm").elements.photos.files);
        if (parse(j.photos).length + files.length > 12)
          throw Error("Tối đa 12 ảnh mỗi công việc.");
        for (let i = 0; i < files.length; i++) {
          $("uploadProgress").textContent =
            "Đang lưu ảnh " + (i + 1) + "/" + files.length + "…";
          await api("uploadPhoto", {
            jobId: id,
            requestId: requestId + "-" + i,
            name: files[i].name,
            dataUrl: await compressedPhoto(files[i]),
          });
        }
        const snapshot = await api("snapshot"),
          fresh = snapshot.jobs.find((x) => x.id === id);
        return api("completeJob", {
          id,
          revision: fresh.revision,
          completedDate: f.get("completedDate"),
          result: f.get("result"),
          checks: checks.map((x, i) => f.has("check" + i)),
          requestId,
        });
      },
    );
  }
  async function execute(cmd, id, target) {
    if (cmd === "selectAsset") {
      state.assetId = id;
      state.page = "assets";
      render();
      return;
    }
    if (cmd === "goCalendar") {
      state.page = "calendar";
      render();
      return;
    }
    if (cmd === "addManager") return managerEditor();
    if (cmd === "editManager") return managerEditor(id);
    if (cmd === "addAsset") return assetEditor(null, id);
    if (cmd === "editAsset") return assetEditor(id);
    if (cmd === "addSchedule") return scheduleEditor(null, id);
    if (cmd === "editSchedule") return scheduleEditor(id);
    if (cmd === "repair") {
      const requestId = uid();
      return editor(
        "Báo sửa chữa — " + state.data.assets.find((a) => a.id === id).name,
        field("Hiện tượng / tên công việc", "title", "", "text", true) +
          area("Mô tả lỗi và yêu cầu xử lý", "description") +
          people(state.data.user.email),
        (f) =>
          api("openJob", {
            componentId: id,
            ...Object.fromEntries(f),
            requestId,
          }),
      );
    }
    if (cmd === "startMaintenance") {
      const s = state.data.schedules.find((s) => s.id === id);
      const j = await api("openJob", {
        componentId: s.componentId,
        scheduleId: id,
        requestId: uid(),
      });
      await refresh();
      completionEditor(j.id);
      return;
    }
    if (cmd === "assignJob") {
      const j = state.data.jobs.find((j) => j.id === id);
      return editor(
        "Người thực hiện",
        people(j.assignee || state.data.user.email),
        (f) =>
          api("assignJob", {
            id,
            revision: j.revision,
            assignee: f.get("assignee"),
          }),
      );
    }
    if (cmd === "completeJob") return completionEditor(id);
    if (cmd === "photo") {
      toast("Đang tải ảnh…");
      const p = await api("photo", { id, jobId: target.dataset.job });
      $("fullPhoto").src = p.dataUrl;
      $("photoViewer").showModal();
      return;
    }
    if (cmd === "settings")
      return editor(
        "Email nhận báo cáo",
        area(
          "C\u00e1c email, ng\u0103n c\u00e1ch b\u1eb1ng d\u1ea5u ph\u1ea9y",
          "reportEmails",
          state.data.settings.reportEmails,
        ),
        (f) => api("saveSettings", Object.fromEntries(f)),
      );
    if (cmd === "report") {
      if (!confirm("Gửi báo cáo ngay đến các email đã cấu hình?")) return;
      const result = await api("report");
      toast("Đã gửi " + result.sent + " thông báo.");
      if (result.errors?.length) alertError(Error(result.errors.join("\n")));
      await refresh();
      return;
    }
    if (cmd === "addMember" || cmd === "editMember") {
      const m = state.data.members.find((m) => m.email === id);
      return editor(
        m ? "Sửa thành viên" : "Thêm thành viên",
        field("Họ tên", "name", m?.name, "text", true) +
          field("Tên đăng nhập", "email", m?.email, "text", true) +
          field(
            "Email (dùng cho Google Workspace sau này)",
            "contactEmail",
            m?.contactEmail,
            "email",
          ) +
          field(
            m
              ? "Mật khẩu mới (để trống nếu giữ nguyên)"
              : "Mật khẩu (tối thiểu 12 ký tự)",
            "password",
            "",
            "password",
            !m,
          ) +
          field(
            "Chức vụ / quyền (admin là quản trị viên)",
            "role",
            m?.position || m?.role || "technician",
            "text",
            true,
          ) +
          (m
            ? '<label class="check"><input type="checkbox" name="active" checked>Cho phép truy cập</label>'
            : ""),
        (f) =>
          api("saveMember", {
            ...Object.fromEntries(f),
            active: m ? f.has("active") : true,
          }),
      );
    }
  }
  document.addEventListener("click", (e) => {
    const target = e.target.closest("[data-action]");
    if (target) {
      target.disabled = true;
      Promise.resolve(execute(target.dataset.action, target.dataset.id, target))
        .catch(alertError)
        .finally(() => (target.disabled = false));
    }
  });
  document.querySelectorAll("nav button").forEach(
    (b) =>
      (b.onclick = () => {
        state.page = b.dataset.page;
        state.filter = "all";
        render();
      }),
  );
  $("editorForm").onsubmit = async (e) => {
    e.preventDefault();
    $("saveEditor").disabled = true;
    $("formError").textContent = "";
    try {
      await submitEditor(new FormData(e.target));
      $("editor").close();
      toast("Đã lưu thành công.");
      await refresh();
    } catch (error) {
      $("formError").textContent = error.message;
    } finally {
      $("saveEditor").disabled = false;
    }
  };
  $("closeEditor").onclick = $("cancelEditor").onclick = () => {
    if (!$("saveEditor").disabled) $("editor").close();
  };
  $("editor").addEventListener("cancel", (e) => {
    if ($("saveEditor").disabled) e.preventDefault();
  });
  $("closePhoto").onclick = () => {
    $("photoViewer").close();
    $("fullPhoto").removeAttribute("src");
  };
  $("refresh").onclick = refresh;
  function showLogin() {
    sessionToken = "";
    sessionStorage.removeItem("equipmentSession");
    state.data = null;
    $("login").hidden = false;
    $("shell").hidden = true;
  }
  function showApp() {
    $("login").hidden = true;
    $("shell").hidden = false;
    return refresh();
  }
  $("loginForm").onsubmit = async (event) => {
    event.preventDefault();
    $("signIn").disabled = true;
    $("loginError").textContent = "";
    try {
      const result = await gasCall(
        "loginEquipment",
        $("loginEmail").value,
        $("loginPassword").value,
      );
      sessionToken = result.token;
      sessionStorage.setItem("equipmentSession", sessionToken);
      $("loginPassword").value = "";
      await showApp();
    } catch (error) {
      $("loginError").textContent = error.message;
    } finally {
      $("signIn").disabled = false;
    }
  };
  $("signOut").onclick = async () => {
    try {
      await gasCall("logoutEquipment", sessionToken);
    } catch (error) {}
    showLogin();
  };
  if (sessionToken) showApp();
  else
    gasCall("equipmentLoginInfo")
      .then((info) => {
        if (!info.initialized)
          $("loginError").textContent =
            "Ch\u01b0a kh\u1edfi t\u1ea1o. Ch\u1ee7 app ch\u1ea1y h\u00e0m setupEquipmentApp m\u1ed9t l\u1ea7n trong Apps Script.";
      })
      .catch((error) => ($("loginError").textContent = error.message));
  window.addEventListener("offline", () => {
    $("connection").textContent = "Mất kết nối";
    alertError(
      Error("Đang ngoại tuyến. Không lưu thay đổi cho đến khi có mạng."),
    );
  });
  window.addEventListener("online", refresh);
</script>
