<style>
  @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");
  :root {
    font-family: "Be Vietnam Pro", system-ui, sans-serif;
    color: #183c34;
    background: #f4f6f2;
    font-size: 14px;
    --green: #176c52;
    --line: #dfe6df;
    --muted: #718079;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button {
    cursor: pointer;
    border: 1px solid var(--line);
    border-radius: 9px;
    background: white;
    color: #254b40;
    padding: 10px 14px;
    font-weight: 600;
    min-height: 42px;
  }
  button:hover {
    background: #edf4ee;
  }
  button:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  .primary {
    background: var(--green);
    border-color: var(--green);
    color: white;
  }
  .primary:hover {
    background: #12553f;
  }
  .ghost {
    border: 0;
    background: transparent;
  }
  .danger {
    color: #b13132;
  }
  .login {
    min-height: 100vh;
    display: grid;
    place-items: center;
    background:
      radial-gradient(ellipse at 20% 0, #cde6d8, transparent 60%), #f3f5ef;
  }
  .login-card {
    max-width: 560px;
    padding: 52px;
    background: #ffffffd9;
    border: 1px solid white;
    border-radius: 28px;
    box-shadow: 0 30px 100px #224e3620;
  }
  .login h1 {
    font-size: 40px;
    line-height: 1.3;
    letter-spacing: -1.5px;
  }
  .login p {
    line-height: 1.8;
    color: var(--muted);
  }
  .login button {
    width: 100%;
    margin-top: 20px;
  }
  .brand-mark {
    display: inline-grid;
    place-items: center;
    width: 44px;
    height: 44px;
    background: #8abf9b;
    color: #123e35;
    border-radius: 14px;
    font-size: 26px;
    font-weight: 800;
  }
  .eyebrow {
    display: block;
    font-size: 10px;
    letter-spacing: 2px;
    font-weight: 700;
    color: #688474;
    margin-top: 14px;
  }
  aside {
    position: fixed;
    inset: 0 auto 0 0;
    width: 248px;
    background: #123e35;
    color: #d8e8df;
    padding: 32px 20px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    text-decoration: none;
    color: white;
    font-size: 17px;
    font-weight: 700;
  }
  .brand small {
    display: block;
    font-size: 8px;
    letter-spacing: 1.1px;
    color: #9ebbb0;
    margin-top: 5px;
  }
  nav {
    display: grid;
    gap: 8px;
    margin-top: 48px;
  }
  nav button {
    text-align: left;
    background: transparent;
    color: #bfd4c9;
    border: 0;
    padding: 14px;
  }
  nav button.active {
    background: #ffffff15;
    color: white;
    border-left: 3px solid #a4d3a1;
    border-radius: 4px 9px 9px 4px;
  }
  .sidebar-bottom {
    margin-top: auto;
    font-size: 11px;
    overflow-wrap: anywhere;
  }
  .sidebar-bottom button {
    color: #b6d0c2;
    display: block;
    margin-top: 10px;
  }
  main {
    margin-left: 248px;
    padding: 32px 36px;
    max-width: 1900px;
  }
  header {
    display: flex;
    justify-content: space-between;
    gap: 24px;
    align-items: center;
    margin-bottom: 30px;
  }
  header h1 {
    font-size: 26px;
    letter-spacing: -0.8px;
    margin: 9px 0;
  }
  .toolbar,
  .actions {
    display: flex;
    gap: 8px;
    align-items: center;
    flex-wrap: wrap;
  }
  .toolbar button {
    font-size: 11px;
  }
  .pill {
    border-radius: 30px;
    padding: 5px 9px;
    font-size: 10px;
    font-weight: 600;
    background: #e9f2e8;
    color: #267348;
    white-space: nowrap;
  }
  .pill.red {
    background: #fbe8e5;
    color: #b43c35;
  }
  .pill.amber {
    background: #fff0d4;
    color: #986513;
  }
  .pill.blue {
    background: #e6eef9;
    color: #3c639a;
  }
  .metrics {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 16px;
    margin-bottom: 26px;
  }
  .metric {
    padding: 23px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 15px;
  }
  .metric .number {
    font-size: 36px;
    font-weight: 700;
    letter-spacing: -1.5px;
    margin: 10px 0;
  }
  .metric span {
    font-size: 12px;
    color: var(--muted);
  }
  .metric.alert-metric {
    background: #fff5f0;
    border-color: #f1dbce;
  }
  .metric.alert-metric .number {
    color: #b44c35;
  }
  .card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    margin-bottom: 20px;
    overflow: hidden;
  }
  .card-head {
    padding: 22px 24px;
    border-bottom: 1px solid #edf0ea;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 16px;
  }
  .card-head h2 {
    font-size: 16px;
    margin: 0;
  }
  .card-head p {
    font-size: 11px;
    color: var(--muted);
    margin: 7px 0 0;
  }
  .card-body {
    padding: 24px;
  }
  .empty {
    text-align: center;
    padding: 50px 20px;
    color: var(--muted);
    line-height: 1.9;
  }
  .empty strong {
    display: block;
    color: #33594a;
    font-size: 17px;
    margin-bottom: 8px;
  }
  .table-scroll {
    overflow: auto;
  }
  table {
    border-collapse: collapse;
    width: 100%;
    font-size: 12px;
  }
  th {
    text-align: left;
    background: #f5f8f3;
    color: #718276;
    font-size: 10px;
    font-weight: 600;
    padding: 13px 20px;
    white-space: nowrap;
  }
  td {
    padding: 17px 20px;
    border-top: 1px solid #edf1ea;
    line-height: 1.6;
  }
  td small,
  .muted {
    display: block;
    color: var(--muted);
    font-size: 11px;
  }
  tr.overdue td:first-child {
    border-left: 3px solid #c45240;
  }
  tr.overdue {
    background: #fff8f5;
  }
  td button {
    font-size: 10px;
    padding: 7px 10px;
    min-height: 32px;
  }
  .grid-two {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  .tree-layout {
    display: grid;
    grid-template-columns: 280px 1fr;
    gap: 20px;
  }
  .tree-panel {
    max-height: 75vh;
    overflow: auto;
    padding: 18px;
  }
  .tree-node {
    padding: 7px 0;
  }
  .tree-row {
    display: flex;
    gap: 4px;
    align-items: start;
  }
  .tree-toggle, .tree-spacer {
    flex: 0 0 28px;
    width: 28px;
    min-height: 36px;
  }
  .tree-toggle {
    padding: 0;
    font-size: 19px;
    border: 1px solid var(--line);
    border-radius: 7px;
  }
  .tree-label {
    flex: 1;
    min-width: 0;
    text-align: left;
    border: 0;
    font-size: 12px;
    overflow-wrap: anywhere;
    min-height: 36px;
  }
  .tree-label.selected {
    background: #e8f2e8;
    color: #176c52;
  }
  .tree-children {
    margin-left: 14px;
    border-left: 1px solid var(--line);
    padding-left: 8px;
  }
  details > summary {
    cursor: pointer;
    font-size: 12px;
    padding: 10px 4px;
  }
  .breadcrumbs {
    font-size: 11px;
    color: var(--muted);
    margin-bottom: 18px;
    line-height: 1.8;
  }
  .detail-heading {
    display: flex;
    align-items: start;
    justify-content: space-between;
    gap: 20px;
  }
  .detail-heading h2 {
    font-size: 26px;
    margin: 0 0 8px;
  }
  .detail-heading p {
    color: var(--muted);
    line-height: 1.8;
  }
  .data-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    margin: 20px 0;
  }
  .data-grid label {
    display: block;
    color: var(--muted);
    font-size: 11px;
    margin-bottom: 7px;
  }
  .data-grid p {
    white-space: pre-wrap;
    line-height: 1.7;
    margin: 0;
  }
  .child-card {
    border: 1px solid var(--line);
    padding: 18px;
    border-radius: 12px;
    margin: 10px 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 12px;
  }
  .filter-row {
    display: flex;
    gap: 10px;
    margin: 0 0 20px;
    flex-wrap: wrap;
  }
  .filter-row input {
    flex: 1;
    min-width: 200px;
  }
  .job {
    padding: 22px;
    border-bottom: 1px solid var(--line);
  }
  .job:last-child {
    border: 0;
  }
  .job h3 {
    margin: 8px 0;
    font-size: 15px;
  }
  .job p {
    white-space: pre-wrap;
    line-height: 1.7;
  }
  .job-top {
    display: flex;
    justify-content: space-between;
    gap: 16px;
  }
  .photos {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    margin: 12px 0;
  }
  .photos button {
    font-size: 11px;
  }
  .hint {
    font-size: 11px !important;
    color: var(--muted);
    line-height: 1.8;
  }
  .error {
    color: #ad3333;
    font-size: 12px;
    white-space: pre-wrap;
  }
  #alert {
    padding: 14px 18px;
    background: #fff1db;
    color: #855916;
    border-radius: 10px;
    margin-bottom: 18px;
    white-space: pre-wrap;
  }
  footer {
    color: #8a988c;
    font-size: 10px;
    display: flex;
    justify-content: space-between;
    margin: 30px 0 0;
    gap: 20px;
  }
  dialog {
    border: 1px solid var(--line);
    border-radius: 20px;
    padding: 26px;
    max-width: 620px;
    width: calc(100% - 28px);
    max-height: 90vh;
    box-shadow: 0 30px 100px #123e3530;
  }
  dialog::backdrop {
    background: #0c281c88;
    backdrop-filter: blur(3px);
  }
  .dialog-title {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .dialog-title h2 {
    margin: 0;
    font-size: 20px;
  }
  label.field {
    display: block;
    margin: 15px 0;
    font-size: 12px;
    font-weight: 600;
  }
  input,
  textarea,
  select {
    width: 100%;
    padding: 12px;
    border: 1px solid #d4ded5;
    border-radius: 9px;
    background: #fcfdfb;
    color: #183c34;
    margin-top: 7px;
    min-height: 44px;
    line-height: 1.5;
  }
  input:focus,
  textarea:focus,
  select:focus {
    outline: 2px solid #a9d4b5;
    outline-offset: 1px;
  }
  textarea {
    min-height: 96px;
    resize: vertical;
  }
  input[type="checkbox"] {
    width: 18px;
    min-height: 18px;
    margin: 0 10px 0 0;
    vertical-align: middle;
  }
  .check {
    display: block;
    margin: 12px 0;
    line-height: 1.8;
  }
  .dialog-actions {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
    margin-top: 24px;
  }
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #123e35;
    color: white;
    padding: 15px 24px;
    border-radius: 12px;
    z-index: 20000;
    max-width: 90vw;
  }
  #photoViewer {
    max-width: 1100px;
  }
  #photoViewer img {
    display: block;
    max-width: 100%;
    max-height: 75vh;
    margin: auto;
  }
  #photoViewer button {
    display: block;
    margin-left: auto;
  }
  a {
    color: var(--green);
  }
  [hidden] {
    display: none !important;
  }
  @media (max-width: 1100px) {
    aside {
      width: 210px;
      padding: 24px 14px;
    }
    main {
      margin-left: 210px;
      padding: 24px;
    }
    .metrics {
      grid-template-columns: repeat(2, 1fr);
    }
    header {
      align-items: start;
      flex-direction: column;
    }
    .tree-layout {
      grid-template-columns: 230px 1fr;
    }
    .grid-two {
      grid-template-columns: 1fr;
    }
  }
  @media (max-width: 720px) {
    aside {
      position: static;
      width: 100%;
      padding: 16px;
    }
    .brand-mark {
      width: 36px;
      height: 36px;
      font-size: 22px;
    }
    .brand {
      font-size: 15px;
    }
    nav {
      margin-top: 16px;
      display: flex;
      overflow: auto;
      gap: 4px;
    }
    nav button {
      white-space: nowrap;
      padding: 10px;
      font-size: 11px;
      min-height: 40px;
    }
    .sidebar-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-top: 10px;
    }
    .sidebar-bottom button {
      margin: 0;
    }
    main {
      margin: 0;
      padding: 20px 14px;
    }
    header {
      gap: 8px;
      margin-bottom: 20px;
    }
    header h1 {
      font-size: 23px;
    }
    .toolbar {
      gap: 6px;
    }
    .toolbar button {
      padding: 8px 10px;
    }
    .metrics {
      gap: 10px;
    }
    .metric {
      padding: 16px;
    }
    .metric .number {
      font-size: 30px;
    }
    .tree-layout {
      grid-template-columns: 1fr;
    }
    .tree-panel {
      max-height: 330px;
    }
    .card-head,
    .card-body {
      padding: 18px;
    }
    .detail-heading {
      flex-direction: column;
      gap: 8px;
    }
    .detail-heading h2 {
      font-size: 23px;
    }
    .data-grid {
      grid-template-columns: 1fr;
    }
    .job {
      padding: 18px;
    }
    .job-top {
      flex-direction: column;
      gap: 8px;
    }
    .login-card {
      margin: 16px;
      padding: 32px 24px;
    }
    .login h1 {
      font-size: 32px;
    }
    .dialog-title h2 {
      font-size: 18px;
    }
    dialog {
      padding: 20px;
    }
    .card-head .actions {
      justify-content: flex-end;
    }
    footer {
      flex-direction: column;
    }
  }
  .manager-summary {
    padding: 18px 20px;
    margin: 4px 0 22px;
    background: #f0f6ef;
    border: 1px solid #dce9da;
    border-radius: 12px;
  }
  .manager-summary > label {
    font-size: 10px;
    font-weight: 700;
    letter-spacing: 1.2px;
    color: #66816c;
  }
  .manager-summary h3 {
    margin: 10px 0 6px;
    font-size: 17px;
  }
  .manager-summary p {
    margin: 6px 0;
    line-height: 1.7;
    color: #58705e;
  }
</style>
