<script>
  window.MaintenanceExcel = (() => {
    const enc = new TextEncoder(),
      xml = (v) =>
        String(v == null ? "" : v)
          .replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g, "")
          .slice(0, 32767)
          .replace(
            /[&<>"']/g,
            (c) =>
              ({
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&apos;",
              })[c],
          );
    const crcTable = Array.from({ length: 256 }, (_, n) => {
      let c = n;
      for (let j = 0; j < 8; j++) c = c & 1 ? 0xedb88320 ^ (c >>> 1) : c >>> 1;
      return c >>> 0;
    });
    function crc(bytes) {
      let c = 0xffffffff;
      for (const b of bytes) c = crcTable[(c ^ b) & 255] ^ (c >>> 8);
      return (c ^ 0xffffffff) >>> 0;
    }
    function join(parts) {
      const out = new Uint8Array(parts.reduce((n, p) => n + p.length, 0));
      let offset = 0;
      for (const p of parts) {
        out.set(p, offset);
        offset += p.length;
      }
      return out;
    }
    function zip(files) {
      const locals = [],
        central = [];
      let offset = 0;
      for (const [name, text] of Object.entries(files)) {
        const n = enc.encode(name),
          bytes = enc.encode(text),
          sum = crc(bytes),
          local = new Uint8Array(30 + n.length),
          v = new DataView(local.buffer);
        v.setUint32(0, 0x04034b50, true);
        v.setUint16(4, 20, true);
        v.setUint16(6, 0x800, true);
        v.setUint16(12, 0x21, true);
        v.setUint32(14, sum, true);
        v.setUint32(18, bytes.length, true);
        v.setUint32(22, bytes.length, true);
        v.setUint16(26, n.length, true);
        local.set(n, 30);
        locals.push(local, bytes);
        const h = new Uint8Array(46 + n.length),
          w = new DataView(h.buffer);
        w.setUint32(0, 0x02014b50, true);
        w.setUint16(4, 20, true);
        w.setUint16(6, 20, true);
        w.setUint16(8, 0x800, true);
        w.setUint16(14, 0x21, true);
        w.setUint32(16, sum, true);
        w.setUint32(20, bytes.length, true);
        w.setUint32(24, bytes.length, true);
        w.setUint16(28, n.length, true);
        w.setUint32(42, offset, true);
        h.set(n, 46);
        central.push(h);
        offset += local.length + bytes.length;
      }
      const end = new Uint8Array(22),
        e = new DataView(end.buffer),
        body = join(central);
      e.setUint32(0, 0x06054b50, true);
      e.setUint16(8, central.length, true);
      e.setUint16(10, central.length, true);
      e.setUint32(12, body.length, true);
      e.setUint32(16, offset, true);
      return join([...locals, body, end]);
    }
    function column(n) {
      let value = "";
      for (n++; n; n = Math.floor((n - 1) / 26))
        value = String.fromCharCode(65 + ((n - 1) % 26)) + value;
      return value;
    }
    function workbook(headers, rows) {
      const all = [headers, ...rows],
        last = column(headers.length - 1) + all.length;
      const sheet =
        '<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><dimension ref="A1:' +
        last +
        '"/><sheetViews><sheetView workbookViewId="0"><pane ySplit="1" topLeftCell="A2" activePane="bottomLeft" state="frozen"/></sheetView></sheetViews><cols>' +
        headers
          .map(
            (_, i) =>
              '<col min="' +
              (i + 1) +
              '" max="' +
              (i + 1) +
              '" width="26" customWidth="1"/>',
          )
          .join("") +
        "</cols><sheetData>" +
        all
          .map(
            (row, r) =>
              '<row r="' +
              (r + 1) +
              '">' +
              headers
                .map(
                  (_, c) =>
                    '<c r="' +
                    column(c) +
                    (r + 1) +
                    '" s="' +
                    (r === 0 ? 1 : 0) +
                    '" t="inlineStr"><is><t xml:space="preserve">' +
                    xml(row[c]) +
                    "</t></is></c>",
                )
                .join("") +
              "</row>",
          )
          .join("") +
        '</sheetData><autoFilter ref="A1:' +
        last +
        '"/></worksheet>';
      return zip({
        "[Content_Types].xml":
          '<?xml version="1.0"?><Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/><Override PartName="/xl/worksheets/sheet1.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/><Override PartName="/xl/styles.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.styles+xml"/></Types>',
        "_rels/.rels":
          '<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument" Target="xl/workbook.xml"/></Relationships>',
        "xl/workbook.xml":
          '<?xml version="1.0"?><workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="http://schemas.openxmlformats.org/officeDocument/2006/relationships"><sheets><sheet name="Lich su thiet bi" sheetId="1" r:id="rId1"/></sheets></workbook>',
        "xl/_rels/workbook.xml.rels":
          '<?xml version="1.0"?><Relationships xmlns="http://schemas.openxmlformats.org/package/2006/relationships"><Relationship Id="rId1" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/worksheet" Target="worksheets/sheet1.xml"/><Relationship Id="rId2" Type="http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles" Target="styles.xml"/></Relationships>',
        "xl/styles.xml":
          '<?xml version="1.0"?><styleSheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><fonts count="2"><font><sz val="11"/><name val="Calibri"/></font><font><b/><color rgb="FFFFFFFF"/><sz val="11"/><name val="Calibri"/></font></fonts><fills count="3"><fill><patternFill patternType="none"/></fill><fill><patternFill patternType="gray125"/></fill><fill><patternFill patternType="solid"><fgColor rgb="FF006B56"/><bgColor indexed="64"/></patternFill></fill></fills><borders count="1"><border/></borders><cellStyleXfs count="1"><xf numFmtId="0" fontId="0" fillId="0" borderId="0"/></cellStyleXfs><cellXfs count="2"><xf numFmtId="0" fontId="0" fillId="0" borderId="0" xfId="0" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf><xf numFmtId="0" fontId="1" fillId="2" borderId="0" xfId="0" applyFont="1" applyFill="1" applyAlignment="1"><alignment vertical="top" wrapText="1"/></xf></cellXfs><cellStyles count="1"><cellStyle name="Normal" xfId="0" builtinId="0"/></cellStyles></styleSheet>',
        "xl/worksheets/sheet1.xml": sheet,
      });
    }
    function download(name, headers, rows) {
      const blob = new Blob([workbook(headers, rows)], {
          type: "application/vnd.openxmlformats-officedocument.spreadsheetml.sheet",
        }),
        url = URL.createObjectURL(blob),
        link = document.createElement("a");
      link.href = url;
      link.download = name + ".xlsx";
      document.body.append(link);
      link.click();
      link.remove();
      setTimeout(() => URL.revokeObjectURL(url), 1000);
    }
    return { workbook, download };
  })();
</script>
