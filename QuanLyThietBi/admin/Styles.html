<style>
  @import url("https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap");
  :root {
    --ink: #183b38;
    --muted: #718580;
    --green: #006b56;
    --deep: #103f38;
    --mint: #e7f4ed;
    --line: #e2eae6;
    --bg: #f5f7f4;
    --red: #b63636;
  }
  * {
    box-sizing: border-box;
  }
  body {
    margin: 0;
    font-family: "Be Vietnam Pro", Arial, sans-serif;
    color: var(--ink);
    background: var(--bg);
    font-size: 13px;
  }
  button,
  input,
  select,
  textarea {
    font: inherit;
  }
  button,
  a,
  input,
  select,
  textarea {
    outline-offset: 3px;
  }
  button {
    border: 1px solid #d9e4de;
    background: white;
    color: var(--ink);
    border-radius: 9px;
    padding: 11px 16px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.15s;
  }
  button:hover {
    background: #eef5f0;
  }
  button:disabled {
    opacity: 0.5;
    cursor: wait;
  }
  .primary {
    background: var(--green);
    border-color: var(--green);
    color: #fff;
  }
  .primary:hover {
    background: #005443;
  }
  .danger {
    background: var(--red);
    border-color: var(--red);
    color: white;
  }
  .full {
    width: 100%;
  }
  [hidden] {
    display: none !important;
  }
  a {
    color: var(--green);
  }
  label {
    display: flex;
    flex-direction: column;
    gap: 9px;
    font-weight: 500;
  }
  input,
  select,
  textarea {
    width: 100%;
    border: 1px solid #d8e4dc;
    border-radius: 8px;
    background: white;
    padding: 12px;
    color: var(--ink);
    min-height: 44px;
  }
  input:focus,
  select:focus,
  textarea:focus {
    border-color: var(--green);
    outline: 2px solid #00846b16;
  }
  textarea {
    min-height: 105px;
    resize: vertical;
  }
  select {
    padding-right: 24px;
  }
  input[readonly] {
    background: #f2f5f3;
    color: var(--muted);
  }
  .error {
    color: var(--red);
    line-height: 1.7;
    white-space: pre-line;
  }
  .error:empty {
    display: none;
  }
  .mini-label,
  .eyebrow {
    font-size: 10px;
    letter-spacing: 1.6px;
    font-weight: 700;
    color: #668c7c;
  }
  .brand-mark {
    display: grid;
    place-items: center;
    background: #c0dcb6;
    color: var(--deep);
    border-radius: 13px;
    font-size: 26px;
    font-weight: 800;
    width: 48px;
    height: 48px;
  }
  .login {
    min-height: 100vh;
    display: grid;
    grid-template-columns: 1.05fr 1fr;
  }
  .login-art {
    background: var(--deep);
    color: #fff;
    padding: 8vw;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .login-art .eyebrow {
    margin-top: 38px;
    color: #b4d0b2;
  }
  .login-art h1 {
    font-size: clamp(30px, 3vw, 48px);
    line-height: 1.4;
    letter-spacing: -1.5px;
    margin: 12px 0 24px;
  }
  .login-art > p:last-of-type {
    color: #b8d1c7;
    line-height: 1.9;
    max-width: 400px;
  }
  .art-grid {
    display: flex;
    border-top: 1px solid #ffffff24;
    margin-top: 48px;
    padding-top: 28px;
    gap: 36px;
    color: #91b6a8;
    font-size: 11px;
    line-height: 2.6;
  }
  .art-grid b {
    color: white;
    font-size: 12px;
  }
  .login-form {
    align-self: center;
    width: min(430px, 85%);
    margin: 50px auto;
  }
  .login-form h2 {
    font-size: 27px;
    letter-spacing: -0.8px;
    margin-bottom: 12px;
  }
  .login-form > p {
    color: var(--muted);
    line-height: 1.8;
    margin-bottom: 30px;
  }
  .login-form label {
    margin: 24px 0;
  }
  .password-wrap {
    position: relative;
  }
  .password-wrap input {
    padding-right: 65px;
  }
  .password-wrap button {
    position: absolute;
    right: 3px;
    top: 3px;
    border: 0;
    background: transparent;
    padding: 10px;
    font-size: 11px;
  }
  .sidebar {
    position: fixed;
    inset: 0 auto 0 0;
    width: 250px;
    background: var(--deep);
    color: white;
    padding: 30px 20px;
    display: flex;
    flex-direction: column;
  }
  .brand {
    display: flex;
    gap: 12px;
    align-items: center;
    padding: 0 10px 38px;
  }
  .brand b {
    font-size: 22px;
    letter-spacing: 2px;
  }
  .brand small {
    display: block;
    font-size: 8px;
    letter-spacing: 1px;
    color: #a9c8b9;
    margin-top: 5px;
  }
  .sidebar-label {
    font-size: 8px;
    letter-spacing: 1.4px;
    color: #82ac9a;
    padding: 8px 12px 18px;
  }
  .nav-group summary {
    display: flex;
    gap: 11px;
    cursor: pointer;
    list-style: none;
    padding: 13px 12px;
    border-radius: 8px;
    color: #d4eadf;
  }
  .nav-group summary::-webkit-details-marker {
    display: none;
  }
  .nav-group summary span:last-child {
    margin-left: auto;
  }
  .nav-group:not([open]) summary span:last-child {
    transform: rotate(-90deg);
  }
  nav {
    display: flex;
    flex-direction: column;
    gap: 5px;
    margin: 10px 0;
  }
  nav button {
    border: 0;
    background: transparent;
    color: #bad6c7;
    text-align: left;
    padding: 13px 12px;
    font-size: 12px;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  nav button:hover {
    background: #ffffff0b;
  }
  nav button.active {
    background: #d5e9cc;
    color: #214e3c;
  }
  nav button .nav-icon {
    font-size: 18px;
    width: 23px;
    text-align: center;
  }
  nav button small {
    margin-left: auto;
    font-size: 10px;
    opacity: 0.65;
  }
  .sidebar-bottom {
    margin-top: auto;
    border-top: 1px solid #ffffff1a;
    padding: 22px 12px 0;
    color: #8db49f;
    font-size: 10px;
    line-height: 1.8;
  }
  .connection-dot {
    display: inline-block;
    border-radius: 50%;
    width: 6px;
    height: 6px;
    background: #a7d7a1;
    margin-right: 5px;
  }
  #currentUser {
    color: white;
    font-size: 12px;
    margin-top: 18px;
  }
  .sidebar-bottom button {
    color: #aac8b9;
    background: transparent;
    padding: 9px 0;
    border: 0;
    font-size: 11px;
  }

    margin-left: 250px;
    padding: 36px clamp(20px, 3vw, 52px);
    max-width: 2200px;
  }
  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 24px;
    margin-bottom: 30px;
  }
  .breadcrumb {
    font-size: 10px;
    color: var(--muted);
    display: flex;
    gap: 11px;
    margin-bottom: 12px;
  }
  .breadcrumb span:last-child {
    color: #315e4b;
  }
  header h1 {
    font-size: 27px;
    letter-spacing: -1px;
    margin: 0 0 10px;
  }
  header p {
    margin: 0;
    color: var(--muted);
    font-size: 12px;
  }
  .header-actions {
    display: flex;
    align-items: center;
    gap: 16px;
  }
  .sheet-link {
    font-size: 11px;
    text-decoration: none;
    white-space: nowrap;
  }
  .data-card {
    background: white;
    border: 1px solid var(--line);
    border-radius: 16px;
    overflow: hidden;
    box-shadow: 0 6px 28px #123d2510;
  }
  .card-heading {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 25px 26px;
    border-bottom: 1px solid #edf2ee;
    gap: 16px;
  }
  .card-heading h2 {
    font-size: 16px;
    margin: 0 0 9px;
  }
  .card-heading p {
    font-size: 11px;
    margin: 0;
    color: var(--muted);
  }
  .filters {
    padding: 20px 26px;
    display: flex;
    align-items: center;
    gap: 12px;
    flex-wrap: wrap;
    background: #fcfdfb;
  }

    align-items: center;
    position: relative;
    flex: 1 1 220px;
    max-width: 350px;
  }

    position: absolute;
    left: 13px;
    color: #6d8d7d;
    font-size: 24px;
  }
  .search-box input {
    padding-left: 40px;
    font-size: 12px;
  }
  #filterFields {
    display: flex;
    gap: 9px;
    flex-wrap: wrap;
  }
  #filterFields select {
    font-size: 11px;
    min-width: 130px;
    max-width: 210px;
  }
  .text-button {
    border: 0;
    background: transparent;
    color: var(--muted);
    font-size: 11px;
    padding: 10px;
  }
  .table-region {
    max-height: 65vh;
    overflow: auto;
    border-top: 1px solid var(--line);
    min-height: 260px;
  }
  table {
    border-collapse: separate;
    border-spacing: 0;
    width: 100%;
    font-size: 12px;
  }
  th,
  td {
    text-align: left;
    padding: 16px 18px;
    border-bottom: 1px solid #edf1ed;
    vertical-align: top;
  }
  th {
    position: sticky;
    top: 0;
    background: #eef4ef;
    color: #45624f;
    font-size: 10px;
    font-weight: 600;
    z-index: 2;
    white-space: nowrap;
    letter-spacing: 0.15px;
  }
  td {
    max-width: 350px;
    min-width: 145px;
    line-height: 1.7;
  }
  td.number,
  th.number {
    min-width: 55px;
    width: 55px;
    color: var(--muted);
    font-size: 11px;
  }
  tbody tr:hover td {
    background: #fafcf9;
  }
  .cell-text {
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
    white-space: pre-line;
  }
  .row-actions {
    white-space: nowrap;
    position: sticky;
    right: 0;
    background: white;
    min-width: 132px;
    width: 132px;
    border-left: 1px solid #edf1ed;
  }
  .row-actions button {
    font-size: 10px;
    padding: 7px 10px;
    border-radius: 6px;
    margin-right: 5px;
  }
  .row-actions button:last-child {
    color: var(--red);
  }
  th.row-actions {
    z-index: 3;
    background: #eef4ef;
  }
  .status {
    display: inline-block;
    font-size: 10px;
    border-radius: 6px;
    padding: 4px 9px;
    background: #e8f3e5;
    color: #47714c;
  }
  .empty {
    padding: 65px 25px;
    text-align: center;
    color: var(--muted);
    line-height: 1.9;
  }
  .empty .empty-icon {
    display: block;
    font-size: 34px;
    color: #adc3b3;
    margin-bottom: 16px;
  }
  .empty b {
    display: block;
    color: #3c6250;
    font-size: 15px;
    margin-bottom: 8px;
  }
  .data-card footer {
    padding: 16px 26px;
    display: flex;
    justify-content: space-between;
    gap: 15px;
    color: #90a095;
    font-size: 10px;
    border-top: 1px solid var(--line);
  }
  .relation-hint {
    font-size: 11px;
    line-height: 1.8;
    color: var(--muted);
    padding: 0 4px;
    margin-top: 20px;
  }
  .error-banner {
    padding: 15px 18px;
    color: var(--red);
    background: #fff2ee;
    border: 1px solid #f2d5cb;
    border-radius: 10px;
    margin-bottom: 20px;
    line-height: 1.7;
  }
  dialog {
    border: 1px solid var(--line);
    border-radius: 18px;
    width: min(760px, 95vw);
    max-height: 92vh;
    padding: 0;
    color: var(--ink);
    box-shadow: 0 25px 100px #062f3540;
  }
  dialog::backdrop {
    background: #103e3a70;
    backdrop-filter: blur(3px);
  }
  .dialog-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 25px 28px;
    border-bottom: 1px solid var(--line);
  }
  .dialog-header h2 {
    font-size: 19px;
    margin: 8px 0 0;
  }
  .close {
    border: 0;
    background: transparent;
    font-size: 25px;
    padding: 4px 10px;
  }
  fieldset {
    border: 0;
    padding: 25px 28px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 22px 20px;
    margin: 0;
  }
  fieldset label {
    font-size: 12px;
  }
  .wide {
    grid-column: 1/-1;
  }
  .required {
    color: var(--red);
    margin-left: 3px;
  }
  .field-note {
    font-size: 10px;
    color: var(--muted);
    font-weight: 400;
    line-height: 1.7;
  }
  .dialog-actions {
    padding: 20px 28px;
    background: #fafcf9;
    border-top: 1px solid var(--line);
    display: flex;
    justify-content: flex-end;
    gap: 12px;
  }
  .form-hint {
    font-size: 11px;
    line-height: 1.8;
    color: var(--muted);
    margin: 0 28px 18px;
  }
  #formError {
    margin: 0 28px 20px;
  }
  .delete-dialog {
    max-width: 450px;
    padding-top: 28px;
  }
  .delete-dialog > form > h2,
  .delete-dialog > form > p,
  .delete-icon {
    margin-left: 28px;
    margin-right: 28px;
  }
  .delete-dialog h2 {
    font-size: 20px;
  }
  .delete-dialog > form > p {
    line-height: 1.8;
  }
  .delete-icon {
    font-size: 32px;
    color: var(--red);
  }
  .toast {
    position: fixed;
    bottom: 28px;
    left: 50%;
    transform: translateX(-50%);
    padding: 15px 24px;
    color: white;
    background: var(--deep);
    border-radius: 12px;
    box-shadow: 0 8px 25px #0002;
    z-index: 100;
    max-width: 90vw;
    font-size: 12px;
    line-height: 1.6;
  }
  @media (min-width: 1700px) {
    main {
      padding-top: 48px;
    }
    .sidebar {
      width: 270px;
    }
    main {
      margin-left: 270px;
    }
  }
  @media (max-width: 1000px) {
    .sidebar {
      width: 210px;
      padding: 24px 12px;
    }
    main {
      margin-left: 210px;
      padding: 28px 20px;
    }
    .header-actions {
      gap: 8px;
    }
    .sheet-link {
      display: none;
    }
    header {
      align-items: start;
    }
    header h1 {
      font-size: 23px;
    }
  }
  @media (max-width: 700px) {
    .login {
      display: block;
    }
    .login-art {
      padding: 30px;
    }
    .login-art h1 {
      font-size: 26px;
    }
    .login-art .eyebrow {
      margin-top: 20px;
    }
    .login-art .art-grid,
    .login-art > p:last-of-type {
      display: none;
    }
    .login-form {
      margin: 40px auto;
    }
    .sidebar {
      position: static;
      width: 100%;
      padding: 18px 16px;
    }
    .brand {
      padding: 0 0 14px;
    }
    .brand-mark {
      width: 38px;
      height: 38px;
      font-size: 23px;
    }
    .brand b {
      font-size: 19px;
    }
    .sidebar-label,
    .sidebar-bottom {
      display: none;
    }
    .nav-group summary {
      padding: 8px;
    }
    nav {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }
    nav button {
      padding: 9px 8px;
      font-size: 10px;
      gap: 6px;
    }
    nav button small {
      display: none;
    }
    main {
      margin: 0;
      padding: 22px 14px;
    }
    header {
      margin-bottom: 20px;
      gap: 10px;
    }
    .breadcrumb {
      font-size: 9px;
    }
    header h1 {
      font-size: 23px;
    }
    header p {
      font-size: 10px;
      line-height: 1.6;
    }
    #reload {
      font-size: 10px;
      padding: 10px;
      white-space: nowrap;
    }
    .card-heading {
      padding: 20px 16px;
    }
    .card-heading h2 {
      font-size: 14px;
    }
    .card-heading button {
      font-size: 11px;
      padding: 11px;
    }
    .filters {
      padding: 16px;
      gap: 10px;
    }
    .search-box {
      max-width: none;
      flex-basis: 100%;
    }
    #filterFields {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr 1fr;
    }
    #filterFields select {
      min-width: 0;
      max-width: 100%;
    }
    .table-region {
      max-height: 65vh;
    }
    fieldset {
      grid-template-columns: 1fr;
      padding: 20px;
    }
    .wide {
      grid-column: auto;
    }
    .dialog-header {
      padding: 22px 20px;
    }
    .dialog-header h2 {
      font-size: 17px;
    }
    .dialog-actions {
      padding: 16px 20px;
    }
    .data-card footer {
      padding: 16px;
      font-size: 9px;
    }
    .row-actions {
      min-width: 120px;
      width: 120px;
    }
    th,
    td {
      padding: 14px;
    }
    .relation-hint {
      font-size: 10px;
    }
  }
  dialog.batch-mode {
    width: min(1080px, 96vw);
  }
  .equipment-batch {
    margin: 0 28px 24px;
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }
  .batch-heading {
    padding: 18px;
    display: flex;
    gap: 18px;
    justify-content: space-between;
    align-items: center;
    background: #f3f8f2;
  }
  .batch-heading h3 {
    font-size: 14px;
    margin: 0 0 7px;
  }
  .batch-heading h3 span {
    background: #d5e9cc;
    padding: 3px 8px;
    border-radius: 6px;
    margin-left: 6px;
  }
  .batch-heading p {
    font-size: 10px;
    color: var(--muted);
    line-height: 1.7;
    margin: 0;
  }
  .batch-heading button {
    white-space: nowrap;
    color: var(--green);
  }
  .batch-table {
    max-height: 280px;
    overflow: auto;
  }
  .batch-empty {
    padding: 25px 18px;
    font-size: 11px;
    color: var(--muted);
    line-height: 1.8;
  }
  .batch-mode .dialog-actions {
    position: sticky;
    bottom: 0;
    z-index: 4;
  }
  @media (max-width: 700px) {
    .equipment-batch {
      margin: 0 20px 20px;
    }
    .batch-heading {
      align-items: stretch;
      flex-direction: column;
      gap: 12px;
    }
  }
  #editorFields.criteria-form {grid-template-columns:repeat(6,minmax(0,1fr));gap:18px 20px}
  #editorFields.criteria-form label {grid-column:span 3;min-width:0}
  #editorFields.criteria-form label:has([name="thamSoCanKiemTra"]) {grid-column:1/-1}
  #editorFields.criteria-form label:has([name^="chiTieuDanhGia"]) {grid-column:span 2}
  #editorFields.criteria-form input[readonly] {background:#f1f6f3;color:#526c5f}
  @media(max-width:700px){#editorFields.criteria-form{grid-template-columns:repeat(2,minmax(0,1fr))}#editorFields.criteria-form label,#editorFields.criteria-form label:has([name^="chiTieuDanhGia"]){grid-column:1/-1}}
  #navigation {padding-left:14px}
  #editorFields.plan-catalog-form label:has([name="danhMucCanKiemTra"]){grid-column:1/-1}
