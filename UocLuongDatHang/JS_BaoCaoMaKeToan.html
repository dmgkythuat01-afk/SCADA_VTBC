<script>
const MktReports = (function() {
  const menu=[{key:'mktForecast',label:'Forecast bán hàng'},{key:'mktDemand',label:'Nhu cầu nguyên liệu'},{key:'mktPurchase',label:'Yêu cầu đặt hàng'}];
  const cache=new Map(),pending=new Map();let open=false,active='mktForecast',snapshot=null,epoch=0,displayed=null,displayedKind='';
  const el=id=>document.getElementById(id);
  const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const num=v=>Number(v||0).toLocaleString('vi-VN',{maximumFractionDigits:3});
  const dateVN=v=>{const match=String(v||'').match(/^(\d{4})-(\d{2})-(\d{2})/);return match?match[3]+'/'+match[2]+'/'+match[1]:String(v||'');};
  const codes=choices=>(choices||[]).map(c=>c.code+' ('+c.priority+')').join(', ');
  const isKey=key=>menu.some(m=>m.key===key);
  function renderMenu(){return `<div class="menu-group"><button class="nav nav-parent ${open?'open':''}" onclick="MktReports.toggle()"><span class="nav-parent-main"><span>🔢</span><span>Báo cáo theo mã kế toán</span></span><span class="nav-arrow">›</span></button><div class="submenu ${open?'open':''}">${menu.map(m=>`<button class="nav nav-sub ${active===m.key&&typeof currentView!=='undefined'&&currentView===m.key?'active':''}" onclick="showView('${m.key}')"><span>•</span><span>${m.label}</span></button>`).join('')}</div></div>`;}
  function toggle(){open=!open;globalThis.renderMenu();}
  function hide(){el('mktReports').classList.add('hidden');closeDetail();}
  function reset(){epoch++;cache.clear();pending.clear();snapshot=null;displayed=null;open=false;MktLegacy.reset();closeDetail();el('mktDetailBody').innerHTML='';}
  function invalidate(weeks){cache.delete(weeks);MktLegacy.clearComputed();}
  async function show(key){active=key;open=true;globalThis.renderMenu();hideBaoCaoModule();await MktLegacy.showReportView(key);}
  async function request(fn,...args) {
    const ticket=epoch;
    if(fn==='getBaoCaoForecastBanHang'){
      const data=await server(fn,...args);if(ticket!==epoch)throw new Error('Phiên báo cáo đã đóng.');return data;
    }
    const weeks=Number(args[0]||4);
    if(!cache.has(weeks)) {
      if(!pending.has(weeks)) {
        const task=server('mktGetReports',{weeks}).then(data=>{
          if(ticket!==epoch)throw new Error('Phiên báo cáo đã đóng.');
          if(!data||!data.success)throw new Error('Không nhận được dữ liệu báo cáo.');
          cache.set(weeks,data);return data;
        }).catch(err=>{if(ticket===epoch)clearTables();throw err;}).finally(()=>{if(ticket===epoch)pending.delete(weeks);});
        pending.set(weeks,task);
      }
      await pending.get(weeks);
    }
    if(ticket!==epoch)throw new Error('Phiên báo cáo đã đóng.');
    snapshot=cache.get(weeks);
    const warnings=fn==='getBaoCaoNhuCauNguyenLieu'?(snapshot.demandWarnings||snapshot.warnings):snapshot.warnings;
    return {weeks:snapshot.matrix.weeks,rows:snapshot.matrix.rows,products:snapshot.matrix.products||[],warnings,snapshot};
  }
  function clearTables(){displayed=null;['mkt_materialDemandTable','mkt_orderRequestTable'].forEach(id=>{if(el(id))el(id).innerHTML='';});if(typeof MktPurchaseOrder!=='undefined')MktPurchaseOrder.refresh();}
  function table(headers,rows){return '<thead><tr>'+headers.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+ (rows.length?rows.map(r=>'<tr>'+r.map(cell=>'<td>'+cell+'</td>').join('')+'</tr>').join(''):`<tr><td colspan="${headers.length}" class="empty">Không có dữ liệu phù hợp.</td></tr>`)+'</tbody>';}
  function action(week,key,label,product,ids){const scoped=product!==undefined;return `<button class="btn btn-ghost" data-week="${week}" data-material="${esc(key)}" ${scoped?'data-product="'+esc(product)+'" data-demand-ids="'+esc(JSON.stringify(ids||[]))+'"':''} onclick="MktReports.openDetail(Number(this.dataset.week),this.dataset.material${scoped?',this.dataset.product,JSON.parse(this.dataset.demandIds)':''})">${label}</button>`;}
  function prepare(data,kind){snapshot=data.snapshot;displayed=data;displayedKind=kind;const prefix=kind==='demand'?'mkt_materialDemand':'mkt_orderRequest';el(prefix+'Summary').textContent='Hiển thị '+data.weeks.length+' tuần • '+data.rows.length+' nguyên liệu (nhóm theo mã + tên)';const warning=el(prefix+'Warning');warning.style.display=data.warnings.length?'':'none';warning.innerHTML=data.warnings.length?'<details><summary>Có '+data.warnings.length+' cảnh báo dữ liệu — bấm để xem</summary><div class="mkt-warning-list">'+data.warnings.map(w=>'<div>• '+esc(w)+'</div>').join('')+'</div></details>':'';return el(prefix+'Table');}
  function renderDemand(data){
    const target=prepare(data,'demand');
    const heads=['Tên sản phẩm','Mã nguyên liệu','Tên nguyên liệu/vật tư','Đơn vị tính','Mã kế toán được phép dùng',...data.weeks.map(w=>'Tuần '+w.tuan+'/'+w.nam)];
    const products=data.products||[];
    const body=products.map(product=>product.materials.map((row,i)=>{
      const choices=row.choices.slice().sort((a,b)=>a.priority-b.priority||a.code.localeCompare(b.code));
      const badges=choices.length?choices.map((c,j)=>'<span class="mkt-priority mkt-priority-'+c.priority+(j===0?' mkt-priority-best':'')+'">Ưu tiên '+c.priority+': <b>'+esc(c.code)+'</b></span>').join(' '):'<span class="mkt-no-code">Chưa có mã được bật</span>';
      const weeks=data.weeks.map(w=>{const value=row.weeks[w.nam+'|'+w.tuan];return '<td class="material-demand-number">'+(value&&value.demand!==0?num(value.demand)+'<br>'+action(w.index,row.key,'Chi tiết',product.code,value.demandIds):'')+'</td>';}).join('');
      return '<tr data-product="'+esc(product.code)+'" class="'+(i===0?'material-product-start':'')+'"><td class="material-product-cell">'+(i===0?esc(product.name)+'<small class="mkt-product-code">'+esc(product.code)+'</small>':'')+'</td><td>'+esc(row.code)+'</td><td class="material-name-cell">'+esc(row.name)+'</td><td class="material-unit-cell">'+esc(row.unit)+'</td><td class="mkt-permitted-codes">'+badges+'</td>'+weeks+'</tr>';
    }).join('')).join('');
    target.innerHTML='<thead><tr>'+heads.map(h=>'<th>'+esc(h)+'</th>').join('')+'</tr></thead><tbody>'+(body||'<tr><td colspan="'+heads.length+'" class="empty">Không có nhu cầu nguyên liệu trong khoảng tuần đang xem.</td></tr>')+'</tbody>';
    const first=data.weeks[0],last=data.weeks[data.weeks.length-1];
    el('mkt_materialDemandSummary').textContent='Hiển thị '+data.weeks.length+' tuần'+(first?': Tuần '+first.tuan+'/'+first.nam+' → Tuần '+last.tuan+'/'+last.nam:'')+' • '+products.length+' sản phẩm';
  }
  function renderPurchase(data){
    const target=prepare(data,'purchase');
    const heads=[['','Mã nguyên<br>liệu vật tư'],['mkt-accounting','Mã kế toán<br>được dùng<br>(ưu tiên)'],['','Tên nguyên liệu vật tư'],['','Đơn vị'],['','Tồn đầu<br>tuần '+esc(data.weeks[0]?.tuan||'')],['','Tồn thực tế'],...data.weeks.flatMap(w=>[['order-request-week-demand','Nhu cầu<br>SX<br>tuần '+esc(w.tuan)],['order-request-week-inbound','Hàng về<br>tuần '+esc(w.tuan)],['order-request-week-ending','Tồn cuối<br>tuần '+esc(w.tuan)]]),['order-request-center','Leadtime'],['order-request-date','Ngày cần đặt<br>hàng (PO)'],['order-request-date','Ngày nhập kho dự<br>kiến'],['order-request-number','Đề xuất đặt'],['order-request-action','Xem phân bổ']];
    const td=(cls,html)=>'<td class="'+cls+'">'+html+'</td>',qty=v=>Number(v||0)!==0?num(v):'';
    const body=data.rows.map(row=>{
      const weeks=data.weeks.map(w=>{const v=row.weeks[w.nam+'|'+w.tuan]||{};return td('order-request-number order-request-week-demand',qty(v.demand))+td('order-request-number order-request-week-inbound',qty(v.receipts))+td('order-request-number order-request-week-ending '+(v.closing<0?'order-request-negative':''),qty(v.closing));}).join('');
      const lead=typeof row.leadtime==='number'?num(row.leadtime):esc(row.leadtime);
      const calendar=row.canDat?'<small>'+(row.planningWeek?'Đặt từ tuần '+esc(row.planningWeek)+'<br>':'')+(row.shortageWeek?'Thiếu từ tuần '+esc(row.shortageWeek):'')+'</small>':'';
      return '<tr class="'+(row.canDat?'order-request-row-need':'')+'">'+td('order-request-code',esc(row.code))+td('mkt-accounting',esc(codes(row.choices)))+td('order-request-name',esc(row.name))+td('order-request-unit',esc(row.unit))+td('order-request-number',num(row.opening))+td('order-request-number',row.actual==null?'—':num(row.actual))+weeks+td('order-request-center',lead)+td('order-request-date '+(row.canDat?'order-request-po':''),esc(dateVN(row.orderDate))+calendar)+td('order-request-date',esc(dateVN(row.needDate)))+td('order-request-number',qty(row.proposed))+td('order-request-action',snapshot.weeks.filter(w=>w.visible||row.purchases.some(p=>p.needWeek===w.index)).map(w=>action(w.index,row.key,'Tuần '+w.week)).join(' '))+'</tr>';
    }).join('');
    target.innerHTML='<thead><tr>'+heads.map(([cls,html])=>'<th class="'+cls+'">'+html+'</th>').join('')+'</tr></thead><tbody>'+(body||'<tr><td class="empty" colspan="'+heads.length+'">Không có dữ liệu.</td></tr>')+'</tbody>';
    if(target.parentElement)target.parentElement.scrollLeft=0;
    el('mkt_orderRequestSummary').innerHTML='<div class="order-summary-title">Hiển thị '+data.weeks.length+' tuần • '+data.rows.length+' nguyên liệu</div><div class="order-summary-weeks">'+data.weeks.map(w=>'<div class="order-summary-week"><b>Tuần '+esc(w.tuan)+'/'+esc(w.nam)+'</b><span>'+esc(dateVN(w.start||w.ngayDauTuan))+' → '+esc(dateVN(w.end||w.ngayCuoiTuan))+'</span></div>').join('')+'</div>';
    if(typeof MktPurchaseOrder!=='undefined')MktPurchaseOrder.refresh();
  }
  function exportExcel(){
    if(!displayed)return alert('Chưa có dữ liệu báo cáo.');
    if(typeof XLSX==='undefined')return alert('Không tìm thấy thư viện xuất Excel.');
    const data=displayed;
    let headers,values;
    if(displayedKind==='demand'){
      headers=['Tên sản phẩm','Mã nguyên liệu','Tên nguyên liệu/vật tư','Đơn vị tính','Mã kế toán được phép dùng (ưu tiên)',...data.weeks.map(w=>'Tuần '+w.tuan+'/'+w.nam)];
      values=(data.products||[]).flatMap(product=>product.materials.map(row=>[product.name,row.code,row.name,row.unit,row.choices.map(c=>'Ưu tiên '+c.priority+': '+c.code).join('; '),...data.weeks.map(w=>row.weeks[w.nam+'|'+w.tuan]?.demand||0)]));
    }else{
      headers=['Mã nguyên liệu vật tư','Mã kế toán được dùng (ưu tiên)','Tên nguyên liệu vật tư','Đơn vị','Tồn đầu tuần','Tồn thực tế',...data.weeks.flatMap(w=>['Nhu cầu SX tuần '+w.tuan,'Hàng về tuần '+w.tuan,'Tồn cuối tuần '+w.tuan]),'Leadtime','Ngày cần đặt hàng (PO)','Ngày nhập kho dự kiến','Đề xuất đặt'];
      values=data.rows.map(row=>[row.code,codes(row.choices),row.name,row.unit,row.opening,row.actual,...data.weeks.flatMap(w=>{const v=row.weeks[w.nam+'|'+w.tuan];return [v?.demand||0,v?.receipts||0,v?.closing||0];}),row.leadtime,row.orderDate,row.needDate,row.proposed]);
    }
    const book=XLSX.utils.book_new();XLSX.utils.book_append_sheet(book,XLSX.utils.aoa_to_sheet([headers,...values]),displayedKind==='demand'?'Nhu cau nguyen lieu':'Yeu cau dat hang');
    XLSX.writeFile(book,'Bao_cao_ma_ke_toan_'+displayedKind+'_'+new Date().toISOString().slice(0,10)+'.xlsx');
  }
  function openDetail(weekIndex,material,product,ids) {
    if(!snapshot)return;
    const d=snapshot.details.find(r=>r.weekIndex===weekIndex&&r.material===material);
    if(!d){el('mktStatus').textContent='Chưa có chi tiết cho tuần này.';return;}
    const demandById=new Map(d.demands.filter(n=>(product===undefined||n.product===product)&&(!Array.isArray(ids)||ids.includes(n.id))).map(r=>[r.id,r]));
    const allocations=d.allocations.filter(r=>demandById.has(r.demandId)).map(r=>[esc(demandById.get(r.demandId).product),esc(r.code),esc(r.priority),num(r.quantity),esc(d.unit)]);
    const shortage=d.shortages.filter(r=>demandById.has(r.demandId)).map(r=>{const need=demandById.get(r.demandId);return [esc(need.product),num(need.quantity),num(need.quantity-r.quantity),num(r.quantity),esc(codes(need.choices))];});
    const sum=(list,code)=>list.filter(r=>r.code===code).reduce((n,r)=>n+r.quantity,0);
    const allCodes=[...new Set([...d.opening,...d.arrivals,...d.balances].map(r=>r.code))].sort();
    const stock=allCodes.map(code=>[esc(code),num(sum(d.opening,code)),num(sum(d.arrivals,code)),num(sum(d.allocations,code)),num(sum(d.balances,code))]);
    const permittedSelected=new Set([...demandById.values()].flatMap(n=>n.choices.map(c=>c.code)));
    const purchases=snapshot.purchaseReport.filter(r=>r.needWeek===weekIndex&&r.material===material&&(product===undefined||(r.products.includes(product)&&permittedSelected.has(r.code))));
    const row=snapshot.matrix.rows.find(r=>r.key===material),week=snapshot.weeks[weekIndex],unit=row?.unit||d.unit||'';
    const selected=[...demandById.values()];
    const totalDemand=selected.reduce((n,r)=>n+Number(r.quantity||0),0);
    const totalAllocated=d.allocations.filter(r=>demandById.has(r.demandId)).reduce((n,r)=>n+r.quantity,0);
    const totalShortage=d.shortages.filter(r=>demandById.has(r.demandId)).reduce((n,r)=>n+r.quantity,0);
    const productNames=[...new Set(selected.map(n=>n.productName&&n.productName!==n.product?n.productName+' ('+n.product+')':n.product))].join(', ');
    const numeric=(rows,columns)=>rows.map(cells=>cells.map((cell,i)=>columns.includes(i)?'<span class="mkt-num">'+cell+'</span>':cell));
    const section=(title,heads,values,columns)=>'<section class="mkt-detail-section"><h3>'+title+'</h3><div class="mkt-scroll"><table>'+table(heads,numeric(values,columns))+'</table></div></section>';
    const metric=(key,label,value,cls)=>'<div class="mkt-metric '+cls+'" data-metric="'+key+'" data-value="'+value+'"><span>'+label+'</span><strong>'+num(value)+' <small>'+esc(unit)+'</small></strong></div>';
    el('mktDetailTitle').textContent='Chi tiết phân bổ — '+(row?.code||material);
    const context='<div class="mkt-context"><div><span>Sản phẩm</span><strong>'+esc(productNames||'Tất cả sản phẩm')+'</strong></div><div><span>Nguyên liệu</span><strong>'+esc((row?.code||material)+' — '+(row?.name||d.name||''))+'</strong></div><div><span>Tuần '+esc(week.week||week.tuan||'')+'/'+esc(week.year||week.nam||'')+'</span><strong>'+esc(dateVN(week.start))+(week.end?' → '+esc(dateVN(week.end)):'')+'</strong></div></div>';
    const metrics='<div class="mkt-metrics">'+metric('demand','Nhu cầu',totalDemand,'')+metric('allocated','Đã cấp từ tồn và hàng về',totalAllocated,'mkt-metric-allocated')+metric('shortage','Còn thiếu',totalShortage,totalShortage>0?'mkt-metric-shortage':'')+'</div>';
    const purchaseRows=purchases.map(p=>{
      const parts=[];if(p.baseShortage>0)parts.push('Thiếu tuần này: '+num(p.baseShortage)+' '+unit);if(p.reserve>0)parts.push('Giữ chỗ: '+num(p.reserve)+' '+unit);if(p.safety>0)parts.push('Tồn an toàn: '+num(p.safety)+' '+unit);if(p.rounding>0)parts.push('Làm tròn đặt hàng: '+num(p.rounding)+' '+unit);
      return [esc(p.code),'Ưu tiên '+esc(p.priority),num(p.proposed)+' '+esc(p.unit||unit),esc(parts.join(' · ')||'Bổ sung cho nhu cầu chưa được đáp ứng.')+'<br><small>Số lượng gộp cho: '+esc((p.products||[]).join(', ')||'tồn an toàn')+'</small>'];
    });
    const stockSection='<details class="mkt-stock-details"><summary>Xem tồn kho dùng chung theo mã kế toán</summary><p class="mkt-note">Các số dư dưới đây thuộc toàn nguyên liệu, dùng chung cho các sản phẩm; không phải tồn riêng của sản phẩm đang xem.</p>'+section('Đối chiếu tồn kho',['Mã kế toán','Tồn đầu ('+unit+')','Hàng về ('+unit+')','Đã cấp ('+unit+')','Tồn cuối ('+unit+')'],stock,[1,2,3,4])+'</details>';
    el('mktDetailBody').innerHTML=context+metrics+'<p class="mkt-note">“Được phép dùng” là mã đã bật trong BOM; “Đã cấp” là số lượng thực tế được phân bổ. Chưa cộng lượng mua đề xuất vào tồn.</p>'+section('1. Đã cấp từ những mã nào?',['Sản phẩm','Mã kế toán','Ưu tiên','Đã cấp','Đơn vị'],allocations,[2,3])+section('2. Nhu cầu và phần còn thiếu',['Sản phẩm','Nhu cầu ('+unit+')','Đã cấp ('+unit+')','Còn thiếu ('+unit+')','Mã được phép (ưu tiên)'],shortage,[1,2,3])+section('3. Đề xuất mua bổ sung',['Mã kế toán','Ưu tiên','Lượng đề xuất','Giải thích'],purchaseRows,[2])+stockSection;
    if(!el('mktDialog').open)el('mktDialog').showModal();
  }
  function closeDetail(){const dialog=el('mktDialog');if(dialog&&dialog.open)dialog.close();}
  return {isKey,renderMenu,toggle,show,hide,reset,invalidate,request,renderDemand,renderPurchase,openDetail,closeDetail,exportExcel,purchaseRows:()=>displayedKind==='purchase'&&displayed?displayed.rows:[]};
})();
</script>
